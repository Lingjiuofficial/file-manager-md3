          fun openFileWithSystem(context: Context, item: FileItem) {
              if (item.isDirectory) return
              val type = mimeOf(item.extension)
              try {
                  val uri = FileProvider.getUriForFile(
                      context, context.packageName + ".fileprovider", item.file
                  )
                  val intent = Intent(Intent.ACTION_VIEW).apply {
                      setDataAndType(uri, type)
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
                  context.startActivity(intent)
              } catch (e: Exception) {
                  Toast.makeText(context, "没有应用可以打开此文件", Toast.LENGTH_SHORT).show()
              }
          }

          fun applyRefreshRate(activity: Activity, targetHz: Float) {
              try {
                  val display = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) activity.display
                      else @Suppress("DEPRECATION") activity.windowManager.defaultDisplay
                  if (display == null) return
                  val modes = display.supportedModes ?: return
                  if (modes.isEmpty()) return
                  val target = modes.minByOrNull { kotlin.math.abs(it.refreshRate - targetHz) } ?: return
                  val attrs = activity.window.attributes
                  attrs.preferredDisplayModeId = target.modeId
                  activity.window.attributes = attrs
              } catch (_: Exception) {}
          }

          fun supportedRefreshRates(activity: Activity): List<Float> {
              return try {
                  val display = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) activity.display
                      else @Suppress("DEPRECATION") activity.windowManager.defaultDisplay
                  val modes = display?.supportedModes ?: return listOf(60f)
                  modes.map { it.refreshRate }.distinct().sortedDescending()
              } catch (_: Exception) { listOf(60f) }
          }

          // ============================================================
          // Zip 编辑器（流式重建）
          // ============================================================
          object ZipEditor {
              private const val BUF_SIZE = 16 * 1024

              /** 删除条目：entriesToRemove 精确匹配；prefixToRemove 若不为 null 则删除以此开头的所有条目 */
              fun removeEntries(zipFile: File, entriesToRemove: Set<String>, prefixToRemove: String?): Boolean {
                  return rebuild(zipFile) { name ->
                      val shouldRemove = entriesToRemove.contains(name) ||
                          (prefixToRemove != null && (name == prefixToRemove || name.startsWith(prefixToRemove)))
                      !shouldRemove
                  }
              }

              /** 重命名条目（支持目录：会同时重命名目录下的所有条目） */
              fun renameEntry(zipFile: File, oldName: String, newName: String, isDirectory: Boolean): Boolean {
                  val tmp = File(zipFile.parentFile, zipFile.name + ".tmp_" + System.currentTimeMillis())
                  return try {
                      ZipInputStream(zipFile.inputStream().buffered()).use { zin ->
                          ZipOutputStream(tmp.outputStream().buffered()).use { zout ->
                              val buffer = ByteArray(BUF_SIZE)
                              var entry = zin.nextEntry
                              while (entry != null) {
                                  val name = entry.name
                                  val renamed = if (isDirectory) {
                                      if (name == oldName || name.startsWith(oldName)) {
                                          newName + name.removePrefix(oldName)
                                      } else name
                                  } else {
                                      if (name == oldName) newName else name
                                  }
                                  val newEntry = ZipEntry(renamed).apply {
                                      if (entry.time != -1L) time = entry.time
                                  }
                                  zout.putNextEntry(newEntry)
                                  var len: Int
                                  while (zin.read(buffer).also { len = it } > 0) {
                                      zout.write(buffer, 0, len)
                                  }
                                  zout.closeEntry()
                                  zin.closeEntry()
                                  entry = zin.nextEntry
                              }
                          }
                      }
                      replaceOriginal(zipFile, tmp)
                  } catch (e: Exception) {
                      try { tmp.delete() } catch (_: Exception) {}
                      false
                  }
              }

              /** 添加空文件夹（末尾带 / 的 ZipEntry） */
              fun addEmptyFolder(zipFile: File, folderPath: String): Boolean {
                  val normalized = if (folderPath.endsWith("/")) folderPath else "$folderPath/"
                  val tmp = File(zipFile.parentFile, zipFile.name + ".tmp_" + System.currentTimeMillis())
                  return try {
                      var exists = false
                      ZipInputStream(zipFile.inputStream().buffered()).use { zin ->
                          ZipOutputStream(tmp.outputStream().buffered()).use { zout ->
                              val buffer = ByteArray(BUF_SIZE)
                              var entry = zin.nextEntry
                              while (entry != null) {
                                  val name = entry.name
                                  if (name == normalized) exists = true
                                  val newEntry = ZipEntry(name).apply {
                                      if (entry.time != -1L) time = entry.time
                                  }
                                  zout.putNextEntry(newEntry)
                                  var len: Int
                                  while (zin.read(buffer).also { len = it } > 0) {
                                      zout.write(buffer, 0, len)
                                  }
                                  zout.closeEntry()
                                  zin.closeEntry()
                                  entry = zin.nextEntry
                              }
                              if (!exists) {
                                  val newEntry = ZipEntry(normalized).apply { time = System.currentTimeMillis() }
                                  zout.putNextEntry(newEntry)
                                  zout.closeEntry()
                              }
                          }
                      }
                      replaceOriginal(zipFile, tmp)
                  } catch (e: Exception) {
                      try { tmp.delete() } catch (_: Exception) {}
                      false
                  }
              }

              /** 添加一组文件（innerPath -> sourceFile） */
              fun addFiles(zipFile: File, additions: List<Pair<String, File>>): Boolean {
                  if (additions.isEmpty()) return false
                  val tmp = File(zipFile.parentFile, zipFile.name + ".tmp_" + System.currentTimeMillis())
                  return try {
                      val existing = HashSet<String>()
                      ZipInputStream(zipFile.inputStream().buffered()).use { zin ->
                          ZipOutputStream(tmp.outputStream().buffered()).use { zout ->
                              val buffer = ByteArray(BUF_SIZE)
                              var entry = zin.nextEntry
                              while (entry != null) {
                                  val name = entry.name
                                  existing.add(name)
                                  val newEntry = ZipEntry(name).apply {
                                      if (entry.time != -1L) time = entry.time
                                  }
                                  zout.putNextEntry(newEntry)
                                  var len: Int
                                  while (zin.read(buffer).also { len = it } > 0) {
                                      zout.write(buffer, 0, len)
                                  }
                                  zout.closeEntry()
                                  zin.closeEntry()
                                  entry = zin.nextEntry
                              }
                              for ((inner, src) in additions) {
                                  if (inner in existing) continue
                                  if (src.isDirectory) continue
                                  val newEntry = ZipEntry(inner).apply { time = System.currentTimeMillis() }
                                  zout.putNextEntry(newEntry)
                                  src.inputStream().buffered().use { input ->
                                      var len: Int
                                      while (input.read(buffer).also { len = it } > 0) {
                                          zout.write(buffer, 0, len)
                                      }
                                  }
                                  zout.closeEntry()
                              }
                          }
                      }
                      replaceOriginal(zipFile, tmp)
                  } catch (e: Exception) {
                      try { tmp.delete() } catch (_: Exception) {}
                      false
                  }
              }

              private inline fun rebuild(
                  zipFile: File,
                  keep: (String) -> Boolean
              ): Boolean {
                  val tmp = File(zipFile.parentFile, zipFile.name + ".tmp_" + System.currentTimeMillis())
                  return try {
                      ZipInputStream(zipFile.inputStream().buffered()).use { zin ->
                          ZipOutputStream(tmp.outputStream().buffered()).use { zout ->
                              val buffer = ByteArray(BUF_SIZE)
                              var entry = zin.nextEntry
                              while (entry != null) {
                                  val name = entry.name
                                  if (keep(name)) {
                                      val newEntry = ZipEntry(name).apply {
                                          if (entry.time != -1L) time = entry.time
                                      }
                                      zout.putNextEntry(newEntry)
                                      var len: Int
                                      while (zin.read(buffer).also { len = it } > 0) {
                                          zout.write(buffer, 0, len)
                                      }
                                      zout.closeEntry()
                                  }
                                  zin.closeEntry()
                                  entry = zin.nextEntry
                              }
                          }
                      }
                      replaceOriginal(zipFile, tmp)
                  } catch (e: Exception) {
                      try { tmp.delete() } catch (_: Exception) {}
                      false
                  }
              }

              private fun replaceOriginal(zipFile: File, tmp: File): Boolean {
                  if (tmp.length() <= 0L) { tmp.delete(); return false }
                  val backup = File(zipFile.parentFile, zipFile.name + ".bak_" + System.currentTimeMillis())
                  return if (zipFile.renameTo(backup)) {
                      if (tmp.renameTo(zipFile)) {
                          backup.delete()
                          true
                      } else {
                          backup.renameTo(zipFile)
                          tmp.delete()
                          false
                      }
                  } else {
                      tmp.delete()
                      false
                  }
              }
          }

          // ============================================================
          // ViewModel
          // ============================================================
          enum class Tab { FILES, RECENT, STARRED, SETTINGS }
          enum class SortKey { NAME, SIZE, MTIME }
          enum class ClipMode { COPY, CUT }
          data class ClipData(val mode: ClipMode, val path: String)

          private data class DirSnapshot(
              val items: List<FileItem>, val dirMtime: Long,
              val sortKey: SortKey, val showHidden: Boolean
          )
          private data class ScanSnapshot(val items: List<FileItem>, val timestamp: Long)

          class FileManagerViewModel(app: Application) : AndroidViewModel(app) {
              private val prefs = app.getSharedPreferences("fm_md3", 0)
              private var searchJob: Job? = null
              private var refreshJob: Job? = null
              private var scanJob: Job? = null
              private val dirCache = ConcurrentHashMap<String, DirSnapshot>()
              private val categoryScanCache = ConcurrentHashMap<CategoryKind, ScanSnapshot>()
              private val maxCacheSize = 20
              private val maxScanResults = 2000
              private val scanCacheTTL = 60_000L

              var currentDir by mutableStateOf(resolveRoot(app))
                  private set
              var items by mutableStateOf<List<FileItem>>(emptyList())
                  private set
              var recentItems by mutableStateOf<List<FileItem>>(emptyList())
                  private set
              var starredItems by mutableStateOf<List<FileItem>>(emptyList())
                  private set
              var currentTab by mutableStateOf(Tab.FILES)
              var currentCategory by mutableStateOf(CategoryKind.ALL)
              var categoryItems by mutableStateOf<List<FileItem>>(emptyList())
                  private set
              var isScanning by mutableStateOf(false)
                  private set
              var gridMode by mutableStateOf(prefs.getBoolean("grid", false))
              var sortKey by mutableStateOf(
                  runCatching { SortKey.valueOf(prefs.getString("sort","NAME") ?: "NAME") }.getOrDefault(SortKey.NAME)
              )
              var showHidden by mutableStateOf(prefs.getBoolean("hidden", false))
              var preferredHz by mutableStateOf(prefs.getFloat("preferredHz", 0f))
              var uiStyle by mutableStateOf(
                  runCatching { UiStyle.valueOf(prefs.getString("uiStyle", "MATERIAL_YOU") ?: "MATERIAL_YOU") }
                      .getOrDefault(UiStyle.MATERIAL_YOU)
              )
              var searchQuery by mutableStateOf("")
              var searchMode by mutableStateOf(false)
              var globalSearchQuery by mutableStateOf("")
              var globalSearchMode by mutableStateOf(false)
              var globalSearchResults by mutableStateOf<List<FileItem>>(emptyList())
                  private set
              var isSearching by mutableStateOf(false)
                  private set
              var clipboard by mutableStateOf<ClipData?>(null)
              var starredPaths by mutableStateOf(prefs.getStringSet("starred", emptySet()) ?: emptySet())
                  private set
              var snackMessage by mutableStateOf<String?>(null)
              var isRefreshing by mutableStateOf(false)
                  private set

              init {
                  val lastDir = prefs.getString("lastDir", null)
                  if (lastDir != null) {
                      val f = File(lastDir)
                      if (f.exists() && f.isDirectory && f.canRead()) currentDir = f
                  }
                  refresh(force = false); refreshRecent(); refreshStarred()
              }

              private fun resolveRoot(app: Application): File {
                  val ext = Environment.getExternalStorageDirectory()
                  return if (ext.exists() && ext.canRead()) ext
                      else app.getExternalFilesDir(null) ?: app.filesDir
              }

              private fun sortList(list: List<FileItem>, key: SortKey): List<FileItem> {
                  val cmp = when (key) {
                      SortKey.NAME -> compareBy<FileItem> { !it.isDirectory }.thenBy(String.CASE_INSENSITIVE_ORDER) { it.name }
                      SortKey.SIZE -> compareBy<FileItem> { !it.isDirectory }.thenBy { it.size }
                      SortKey.MTIME -> compareBy<FileItem> { !it.isDirectory }.thenByDescending { it.lastModified }
                  }
                  return list.sortedWith(cmp)
              }

              fun refresh(force: Boolean = false) {
                  refreshJob?.cancel()
                  refreshJob = viewModelScope.launch { loadCurrentDir(force) }
              }

              fun pullToRefresh() {
                  refreshJob?.cancel()
                  refreshJob = viewModelScope.launch {
                      isRefreshing = true
                      try {
                          loadCurrentDir(force = true)
                          delay(300)
                      } finally { isRefreshing = false }
                  }
              }

              private suspend fun loadCurrentDir(force: Boolean) {
                  val dir = currentDir
                  val dirPath = dir.absolutePath
                  val key = sortKey
                  val hidden = showHidden
                  val cached = dirCache[dirPath]
                  if (!force && cached != null && cached.sortKey == key && cached.showHidden == hidden) {
                      items = cached.items
                  }
                  val nowMtime = withContext(Dispatchers.IO) {
                      try { dir.lastModified() } catch (e: Exception) { 0L }
                  }
                  if (!force && cached != null && cached.dirMtime == nowMtime &&
                      cached.sortKey == key && cached.showHidden == hidden) return
                  val computed = withContext(Dispatchers.IO) {
                      val list = try { dir.listFiles()?.toList() ?: emptyList() } catch (e: Exception) { emptyList() }
                      val filtered = list.filter { hidden || !it.name.startsWith(".") }.map { it.toItem() }
                      sortList(filtered, key)
                  }
                  if (dir == currentDir && key == sortKey && hidden == showHidden) {
                      if (dirCache.size > maxCacheSize) dirCache.clear()
                      dirCache[dirPath] = DirSnapshot(computed, nowMtime, key, hidden)
                      items = computed
                  }
              }

              fun selectCategory(cat: CategoryKind) {
                  currentCategory = cat
                  if (cat == CategoryKind.ALL) { categoryItems = emptyList(); return }
                  val cached = categoryScanCache[cat]
                  val now = System.currentTimeMillis()
                  if (cached != null && now - cached.timestamp < scanCacheTTL) {
                      categoryItems = sortList(cached.items, sortKey); return
                  }
                  scanCategory(cat)
              }

              fun scanCategory(cat: CategoryKind) {
                  scanJob?.cancel()
                  scanJob = viewModelScope.launch {
                      isScanning = true
                      try {
                          val root = resolveRoot(getApplication())
                          val currentSort = sortKey
                          val result = withContext(Dispatchers.IO) {
                              scanByCategory(root, cat, maxScanResults, currentSort)
                          }
                          if (cat == currentCategory) {
                              categoryScanCache[cat] = ScanSnapshot(result, System.currentTimeMillis())
                              categoryItems = result
                          }
                      } finally { isScanning = false }
                  }
              }

              fun globalSearch(q: String) {
                  globalSearchQuery = q
                  searchJob?.cancel()
                  if (q.isBlank()) { globalSearchResults = emptyList(); return }
                  searchJob = viewModelScope.launch {
                      isSearching = true
                      try {
                          delay(300)
                          val root = resolveRoot(getApplication())
                          val currentSort = sortKey
                          val result = withContext(Dispatchers.IO) {
                              searchGlobal(root, q, maxScanResults, currentSort)
                          }
                          if (q == globalSearchQuery) globalSearchResults = result
                      } finally { isSearching = false }
                  }
              }

              fun exitGlobalSearch() {
                  globalSearchQuery = ""
                  globalSearchResults = emptyList()
                  globalSearchMode = false
              }

              /** Android/data、Android/obb 为应用私有目录（海量小文件且用户价值低），自动扫描/搜索时跳过 */
              private fun isPrivateAppDir(f: File): Boolean =
                  (f.name == "data" || f.name == "obb") && f.parentFile?.name == "Android"

              private fun scanByCategory(root: File, cat: CategoryKind, max: Int, key: SortKey): List<FileItem> {
                  val res = ArrayList<FileItem>(64)
                  val stack = ArrayDeque<File>(); stack.add(root)
                  while (stack.isNotEmpty() && res.size < max) {
                      val dir = stack.removeFirst()
                      val children = try { dir.listFiles() } catch (_: Exception) { null } ?: continue
                      for (c in children) {
                          if (c.name.startsWith(".")) continue
                          if (c.isDirectory) { if (!isPrivateAppDir(c)) stack.add(c) }
                          else { val item = c.toItem(); if (cat.matches(item)) res.add(item) }
                      }
                  }
                  return sortList(res, key)
              }

              private fun searchGlobal(root: File, q: String, max: Int, key: SortKey): List<FileItem> {
                  if (q.isBlank()) return emptyList()
                  val lower = q.lowercase()
                  val res = ArrayList<FileItem>(64)
                  val stack = ArrayDeque<File>(); stack.add(root)
                  while (stack.isNotEmpty() && res.size < max) {
                      val dir = stack.removeFirst()
                      val children = try { dir.listFiles() } catch (_: Exception) { null } ?: continue
                      for (c in children) {
                          if (c.name.startsWith(".")) continue
                          if (c.name.lowercase().contains(lower)) res.add(c.toItem())
                          if (c.isDirectory) { if (!isPrivateAppDir(c)) stack.add(c) }
                      }
                  }
                  return sortList(res, key)
              }

              private fun invalidateAndRefresh() {
                  dirCache.remove(currentDir.absolutePath); refresh(force = true)
              }

              fun refreshRecent() {
                  viewModelScope.launch {
                      val recent = prefs.getString("recent", "")?.split('\n')?.filter { it.isNotBlank() } ?: emptyList()
                      recentItems = withContext(Dispatchers.IO) {
                          recent.mapNotNull { File(it).takeIf { f -> f.exists() }?.toItem() }
                      }
                  }
              }

              fun refreshStarred() {
                  viewModelScope.launch {
                      val paths = starredPaths
                      starredItems = withContext(Dispatchers.IO) {
                          paths.mapNotNull { File(it).takeIf { f -> f.exists() }?.toItem() }
                      }
                  }
              }

              fun recordRecent(item: FileItem) {
                  if (item.isDirectory) return
                  val list = (prefs.getString("recent","")?.split('\n')?.filter{it.isNotBlank()} ?: emptyList())
                      .toMutableList().apply { remove(item.path); add(0, item.path) }
                  prefs.edit().putString("recent", list.take(50).joinToString("\n")).apply()
                  refreshRecent()
              }

              fun open(item: FileItem) {
                  if (!item.isDirectory) return
                  if (!item.file.canRead()) { showSnack("无法访问"); return }
                  currentDir = item.file; searchQuery = ""; searchMode = false
                  prefs.edit().putString("lastDir", item.path).apply()
                  refresh(force = false)
              }

              fun navigateTo(dir: File) {
                  if (!dir.isDirectory || !dir.canRead()) { showSnack("无法访问"); return }
                  currentDir = dir; searchQuery = ""; searchMode = false
                  prefs.edit().putString("lastDir", dir.absolutePath).apply()
                  refresh(force = false)
              }

              fun goUp(): Boolean {
                  val p = currentDir.parentFile ?: return false
                  if (!p.canRead()) return false
                  navigateTo(p); return true
              }

              fun breadcrumbs(): List<File> {
                  val list = ArrayList<File>(8)
                  var f: File? = currentDir
                  while (f != null) { list.add(0, f); f = f.parentFile }
                  return list
              }

              fun doSearch(q: String) {
                  searchQuery = q
                  searchJob?.cancel()
                  if (q.isBlank()) { refresh(force = false); return }
                  val dir = currentDir
                  val key = sortKey
                  searchJob = viewModelScope.launch {
                      delay(250)
                      val results = withContext(Dispatchers.IO) {
                          val res = ArrayList<FileItem>()
                          val stack = ArrayDeque<File>().apply { add(dir) }
                          val lower = q.lowercase()
                          while (stack.isNotEmpty() && res.size < 300) {
                              val d = stack.removeFirst()
                              val children = try { d.listFiles() } catch (e: Exception) { null } ?: continue
                              for (c in children) {
                                  if (c.name.startsWith(".")) continue
                                  if (c.name.lowercase().contains(lower)) res.add(c.toItem())
                                  if (c.isDirectory) { if (!isPrivateAppDir(c)) stack.add(c) }
                              }
                          }
                          sortList(res, key)
                      }
                      if (q == searchQuery) items = results
                  }
              }

              fun exitSearch() { searchQuery = ""; searchMode = false; refresh(force = false) }

              fun createFolder(name: String) {
                  if (name.isBlank()) return
                  viewModelScope.launch {
                      val ok = withContext(Dispatchers.IO) { File(currentDir, name).mkdirs() }
                      if (ok) { invalidateAndRefresh(); showSnack("已创建「" + name + "」") } else showSnack("创建失败")
                  }
              }

              fun createFile(name: String) {
                  if (name.isBlank()) return
                  viewModelScope.launch {
                      val ok = withContext(Dispatchers.IO) {
                          try { File(currentDir, name).createNewFile() } catch (e: Exception) { false }
                      }
                      if (ok) { invalidateAndRefresh(); showSnack("已创建「" + name + "」") } else showSnack("创建失败")
                  }
              }

              fun rename(item: FileItem, newName: String) {
                  if (newName.isBlank() || newName == item.name) return
                  val dest = File(item.file.parentFile, newName)
                  if (dest.exists()) { showSnack("已存在同名项目"); return }
                  viewModelScope.launch {
                      val ok = withContext(Dispatchers.IO) { item.file.renameTo(dest) }
                      if (ok) {
                          if (starredPaths.contains(item.path)) {
                              starredPaths = starredPaths - item.path + dest.absolutePath
                              prefs.edit().putStringSet("starred", starredPaths).apply()
                          }
                          invalidateAndRefresh(); refreshStarred(); refreshRecent(); showSnack("已重命名")
                      } else showSnack("重命名失败")
                  }
              }

              fun delete(item: FileItem) {
                  viewModelScope.launch {
                      val ok = withContext(Dispatchers.IO) {
                          if (item.isDirectory) item.file.deleteRecursively() else item.file.delete()
                      }
                      if (ok) {
                          starredPaths = starredPaths - item.path
                          prefs.edit().putStringSet("starred", starredPaths).apply()
                          if (clipboard?.path == item.path) clipboard = null
                          invalidateAndRefresh(); refreshStarred(); refreshRecent(); showSnack("已删除")
                      } else showSnack("删除失败")
                  }
              }

              fun copy(item: FileItem) { clipboard = ClipData(ClipMode.COPY, item.path); showSnack("已复制") }
              fun cut(item: FileItem) { clipboard = ClipData(ClipMode.CUT, item.path); showSnack("已剪切") }

              fun pasteInto(target: File = currentDir) {
                  val cb = clipboard ?: return
                  val src = File(cb.path)
                  if (!src.exists()) { clipboard = null; showSnack("源文件不存在"); return }
                  if (src.isDirectory && target.absolutePath.startsWith(src.absolutePath + "/")) {
                      showSnack("不能移动到自身子目录"); return
                  }
                  viewModelScope.launch {
                      val ok = withContext(Dispatchers.IO) {
                          try {
                              val dest = uniqueFile(target, src.name)
                              if (cb.mode == ClipMode.CUT) {
                                  if (src.renameTo(dest)) true
                                  else { val c = copyRec(src, dest); if (c) src.deleteRecursively(); c }
                              } else copyRec(src, dest)
                          } catch (e: Exception) { false }
                      }
                      if (ok) {
                          clipboard = null
                          if (target.absolutePath == currentDir.absolutePath) invalidateAndRefresh()
                          refreshStarred(); refreshRecent(); showSnack("已粘贴")
                      } else showSnack("粘贴失败")
                  }
              }

              private fun copyRec(src: File, dest: File): Boolean = try {
                  if (src.isDirectory) src.copyRecursively(dest, overwrite = false)
                  else { dest.parentFile?.mkdirs(); src.copyTo(dest, overwrite = false) }
                  true
              } catch (e: Exception) { false }

              private fun uniqueFile(dir: File, name: String): File {
                  var f = File(dir, name)
                  if (!f.exists()) return f
                  val dot = name.lastIndexOf('.')
                  val stem = if (dot > 0) name.substring(0, dot) else name
                  val ext = if (dot > 0) name.substring(dot) else ""
                  var i = 1
                  while (f.exists()) { f = File(dir, stem + " (" + i + ")" + ext); i++ }
                  return f
              }

              fun toggleStar(item: FileItem) {
                  starredPaths = if (starredPaths.contains(item.path)) starredPaths - item.path else starredPaths + item.path
                  prefs.edit().putStringSet("starred", starredPaths).apply()
                  refreshStarred()
                  showSnack(if (starredPaths.contains(item.path)) "已收藏" else "已取消收藏")
              }

              fun isStarred(path: String) = starredPaths.contains(path)

              fun updateGrid(g: Boolean) { gridMode = g; prefs.edit().putBoolean("grid", g).apply() }
              fun updateSort(k: SortKey) {
                  sortKey = k; prefs.edit().putString("sort", k.name).apply()
                  dirCache.clear(); categoryScanCache.clear()
                  refresh(force = true)
                  if (currentCategory != CategoryKind.ALL) scanCategory(currentCategory)
              }
              fun updateShowHidden(s: Boolean) { showHidden = s; prefs.edit().putBoolean("hidden", s).apply(); dirCache.clear(); refresh(force = true) }
              fun updatePreferredHz(hz: Float) { preferredHz = hz; prefs.edit().putFloat("preferredHz", hz).apply() }
              fun updateUiStyle(style: UiStyle) { uiStyle = style; prefs.edit().putString("uiStyle", style.name).apply() }

              suspend fun saveTextFile(item: FileItem, content: String): Boolean {
                  val ok = withContext(Dispatchers.IO) {
                      try { item.file.writeText(content); true } catch (e: Exception) { false }
                  }
                  if (ok) invalidateAndRefresh()
                  return ok
              }

              fun extractZipEntry(zipFile: File, entryName: String, cacheDir: File): File? {
                  return try {
                      cacheDir.mkdirs()
                      val baseName = entryName.substringAfterLast('/')
                      if (baseName.isEmpty()) null
                      else {
                          val outFile = File(cacheDir, baseName)
                          var result: File? = null
                          ZipFile(zipFile).use { zip ->
                              val entry = zip.getEntry(entryName)
                              if (entry != null && !entry.isDirectory) {
                                  zip.getInputStream(entry).use { input ->
                                      outFile.outputStream().use { output -> input.copyTo(output) }
                                  }
                                  result = outFile
                              }
                          }
                          result
                      }
                  } catch (e: Exception) { null }
              }

              fun extractZipTo(zipFile: File, targetDir: File): Int {
                  var count = 0
                  try {
                      val basePath = targetDir.canonicalPath
                      val prefix = basePath + File.separator
                      ZipFile(zipFile).use { zip ->
                          val entries = zip.entries()
                          while (entries.hasMoreElements()) {
                              val entry = entries.nextElement()
                              val outFile = File(targetDir, entry.name)
                              val canon = outFile.canonicalPath
                              if (canon == basePath || canon.startsWith(prefix)) {
                                  if (entry.isDirectory) outFile.mkdirs()
                                  else {
                                      outFile.parentFile?.mkdirs()
                                      zip.getInputStream(entry).use { input ->
                                          outFile.outputStream().use { output -> input.copyTo(output) }
                                      }
                                      count++
                                  }
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  return count
              }

              fun extractZipSubset(zipFile: File, targetDir: File, prefixPath: String): Int {
                  var count = 0
                  try {
                      val basePath = targetDir.canonicalPath
                      val prefix = basePath + File.separator
                      ZipFile(zipFile).use { zip ->
                          val entries = zip.entries()
                          while (entries.hasMoreElements()) {
                              val entry = entries.nextElement()
                              if (prefixPath.isNotEmpty() && !(entry.name == prefixPath || entry.name.startsWith(prefixPath))) continue
                              val relative = if (prefixPath.isEmpty()) entry.name
                                  else entry.name.removePrefix(prefixPath)
                              if (relative.isEmpty()) continue
                              val outFile = File(targetDir, relative)
                              val canon = outFile.canonicalPath
                              if (canon == basePath || canon.startsWith(prefix)) {
                                  if (entry.isDirectory) outFile.mkdirs()
                                  else {
                                      outFile.parentFile?.mkdirs()
                                      zip.getInputStream(entry).use { input ->
                                          outFile.outputStream().use { output -> input.copyTo(output) }
                                      }
                                      count++
                                  }
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  return count
              }

              fun zipDeleteEntry(zipFile: File, entryName: String, isDirectory: Boolean): Boolean {
                  val ok = if (isDirectory) ZipEditor.removeEntries(zipFile, emptySet(), entryName)
                      else ZipEditor.removeEntries(zipFile, setOf(entryName), null)
                  if (ok) { refresh(force = true); if (currentCategory == CategoryKind.ARCHIVE) scanCategory(currentCategory) }
                  return ok
              }

              fun zipRenameEntry(zipFile: File, oldName: String, newName: String, isDirectory: Boolean): Boolean {
                  val ok = ZipEditor.renameEntry(zipFile, oldName, newName, isDirectory)
                  if (ok) { refresh(force = true); if (currentCategory == CategoryKind.ARCHIVE) scanCategory(currentCategory) }
                  return ok
              }

              fun zipAddFolder(zipFile: File, folderPath: String): Boolean {
                  val ok = ZipEditor.addEmptyFolder(zipFile, folderPath)
                  if (ok) { refresh(force = true); if (currentCategory == CategoryKind.ARCHIVE) scanCategory(currentCategory) }
                  return ok
              }

              fun zipAddFile(zipFile: File, srcFile: File, innerName: String): Boolean {
                  val ok = ZipEditor.addFiles(zipFile, listOf(innerName to srcFile))
                  if (ok) { refresh(force = true); if (currentCategory == CategoryKind.ARCHIVE) scanCategory(currentCategory) }
                  return ok
              }

              fun showSnack(m: String) { snackMessage = m }
              fun consumeSnack() { snackMessage = null }
          }

          // ============================================================
          // 图标 / 颜色
          // ============================================================
          private fun badgeColors(kind: FileKind, cs: ColorScheme): Pair<Color, Color> = when (kind) {
              FileKind.FOLDER -> cs.primaryContainer to cs.onPrimaryContainer
              FileKind.IMAGE -> cs.tertiaryContainer to cs.onTertiaryContainer
              FileKind.VIDEO -> cs.secondaryContainer to cs.onSecondaryContainer
              FileKind.AUDIO -> cs.primaryContainer to cs.onPrimaryContainer
              FileKind.ARCHIVE -> cs.secondaryContainer to cs.onSecondaryContainer
              FileKind.CODE -> cs.tertiaryContainer to cs.onTertiaryContainer
              FileKind.PDF -> cs.errorContainer to cs.onErrorContainer
              FileKind.DOCUMENT -> cs.secondaryContainer to cs.onSecondaryContainer
              FileKind.APK -> cs.primaryContainer to cs.onPrimaryContainer
              FileKind.FONT -> cs.tertiaryContainer to cs.onTertiaryContainer
              FileKind.DATABASE -> cs.secondaryContainer to cs.onSecondaryContainer
              FileKind.DISK_IMAGE -> cs.primaryContainer to cs.onPrimaryContainer
              FileKind.TORRENT -> cs.tertiaryContainer to cs.onTertiaryContainer
              FileKind.EXECUTABLE -> cs.errorContainer to cs.onErrorContainer
              FileKind.FILE -> cs.surfaceContainerHigh to cs.onSurfaceVariant
          }

