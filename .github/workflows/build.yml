name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build release APK
        run: |
          set +e
          ./gradlew :app:assembleRelease --no-daemon --stacktrace > build.log 2>&1
          code=$?
          echo "EXIT=$code" >> build.log
          exit $code

      - name: Push build log on failure
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-log
          cp build.log ci-build.log || true
          git add ci-build.log || true
          git commit -m "ci build log" || true
          git push -f origin ci-log

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/FileKeeper-${{ github.run_number }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileKeeper-apk
          path: out/*.apk

      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 文件管家 最新构建
          body: |
            自动构建 ${{ github.run_number }}
            提交：${{ github.sha }}
          files: out/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
