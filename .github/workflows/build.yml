          // ============================================================
          // PDF 查看器（PdfRenderer 内置渲染 · 滑动翻页）
          // ============================================================
          private val pdfRenderLock = Any()

          @Composable
          fun PdfViewerScreen(item: FileItem, onDismiss: () -> Unit) {
              var pageCount by remember { mutableIntStateOf(0) }
              var curPage by remember { mutableIntStateOf(0) }
              var bitmap by remember { mutableStateOf<Bitmap?>(null) }
              var errorMsg by remember { mutableStateOf<String?>(null) }
              var loading by remember { mutableStateOf(true) }
              val rendererRef = remember { mutableStateOf<PdfRenderer?>(null) }
              val pfdRef = remember { mutableStateOf<ParcelFileDescriptor?>(null) }

              DisposableEffect(item.path) {
                  val renderer = try {
                      val pfd = ParcelFileDescriptor.open(item.file, ParcelFileDescriptor.MODE_READ_ONLY)
                      pfdRef.value = pfd
                      PdfRenderer(pfd)
                  } catch (e: Exception) { null }
                  if (renderer == null) {
                      errorMsg = "无法打开 PDF（可能已加密或损坏）"
                      loading = false
                  } else {
                      rendererRef.value = renderer
                      pageCount = renderer.pageCount
                  }
                  onDispose {
                      try { rendererRef.value?.close() } catch (_: Exception) {}
                      try { pfdRef.value?.close() } catch (_: Exception) {}
                      rendererRef.value = null
                      pfdRef.value = null
                  }
              }

              LaunchedEffect(curPage, pageCount) {
                  val r = rendererRef.value ?: return@LaunchedEffect
                  if (pageCount <= 0) return@LaunchedEffect
                  loading = true
                  bitmap = withContext(Dispatchers.IO) {
                      synchronized(pdfRenderLock) {
                          try {
                              val page = r.openPage(curPage)
                              try {
                                  val targetW = 1440
                                  val scale = targetW.toFloat() / page.width
                                  val w = targetW
                                  val h = (page.height * scale).toInt().coerceAtLeast(1)
                                  val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                                  bmp.eraseColor(android.graphics.Color.WHITE)
                                  val matrix = android.graphics.Matrix()
                                  matrix.setScale(scale, scale)
                                  page.render(bmp, null, matrix, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY)
                                  bmp
                              } finally { page.close() }
                          } catch (e: Exception) { null }
                      }
                  }
                  loading = false
              }

              BackHandler { onDismiss() }

              Box(Modifier.fillMaxSize().background(Color.Black)) {
                  val b = bitmap
                  if (b != null) {
                      Image(
                          bitmap = b.asImageBitmap(),
                          contentDescription = item.name,
                          modifier = Modifier.fillMaxSize().pointerInput(curPage, pageCount) {
                              awaitEachGesture {
                                  val down = awaitFirstDown(requireUnconsumed = false)
                                  var acc = 0f
                                  var multi = false
                                  while (true) {
                                      val event = awaitPointerEvent()
                                      if (event.changes.size > 1) multi = true
                                      val change = event.changes.firstOrNull { c -> c.id == down.id } ?: break
                                      if (!multi) acc += change.position.x - change.previousPosition.x
                                      if (change.changedToUpIgnoreConsumed()) break
                                  }
                                  if (!multi && kotlin.math.abs(acc) > 120f) {
                                      if (acc > 0 && curPage > 0) curPage -= 1
                                      else if (acc < 0 && curPage < pageCount - 1) curPage += 1
                                  }
                              }
                          },
                          contentScale = ContentScale.Fit
                      )
                  }
                  if (loading) {
                      Text(if (bitmap == null) "正在加载…" else "渲染中…", color = Color.White,
                          modifier = Modifier.align(Alignment.Center))
                  } else if (errorMsg != null) {
                      Text(errorMsg ?: "", color = Color.White, modifier = Modifier.align(Alignment.Center))
                  }
                  IconButton(onClick = onDismiss,
                      modifier = Modifier.align(Alignment.TopStart).statusBarsPadding().padding(8.dp)) {
                      Icon(Icons.Filled.Close, "关闭", tint = Color.White)
                  }
                  Surface(
                      modifier = Modifier.align(Alignment.BottomCenter).fillMaxWidth().navigationBarsPadding(),
                      color = Color.Black.copy(alpha = 0.5f)
                  ) {
                      Row(Modifier.padding(horizontal = 8.dp, vertical = 4.dp), verticalAlignment = Alignment.CenterVertically) {
                          TextButton(onClick = { if (curPage > 0) curPage -= 1 }, enabled = curPage > 0) {
                              Text("上一页", color = Color.White)
                          }
                          Box(Modifier.weight(1f), contentAlignment = Alignment.Center) {
                              Text(item.name + "   " + (curPage + 1) + " / " + pageCount,
                                  color = Color.White, style = MaterialTheme.typography.labelMedium,
                                  maxLines = 1, overflow = TextOverflow.Ellipsis)
                          }
                          TextButton(onClick = { if (curPage < pageCount - 1) curPage += 1 },
                              enabled = curPage < pageCount - 1) {
                              Text("下一页", color = Color.White)
                          }
                      }
                  }
              }
          }

          // ============================================================
          // SQLite 查看器（只读 · 表列表 + 数据浏览）
          // ============================================================
          private fun loadSqliteTables(f: File): Pair<List<String>, String?> {
              return try {
                  val db = SQLiteDatabase.openDatabase(f.absolutePath, null, SQLiteDatabase.OPEN_READONLY)
                  val tables = ArrayList<String>(16)
                  db.rawQuery("SELECT name FROM sqlite_master WHERE type IN ('table','view') AND name NOT LIKE 'sqlite_%' ORDER BY name", null).use { c ->
                      while (c.moveToNext()) tables.add(c.getString(0))
                  }
                  db.close()
                  tables to null
              } catch (e: Exception) { emptyList<String>() to ("打开失败：" + (e.message ?: "")) }
          }

          private fun loadSqliteTable(f: File, table: String, limit: Int): Triple<List<String>, List<List<String>>, String?> {
              return try {
                  val db = SQLiteDatabase.openDatabase(f.absolutePath, null, SQLiteDatabase.OPEN_READONLY)
                  val cols = ArrayList<String>(16)
                  val rows = ArrayList<List<String>>(64)
                  db.rawQuery("SELECT * FROM \"" + table.replace("\"", "\"\"") + "\" LIMIT " + limit, null).use { c ->
                      cols.addAll(c.columnNames)
                      while (c.moveToNext()) {
                          val row = ArrayList<String>(cols.size)
                          for (i in cols.indices) row.add(c.getString(i) ?: "NULL")
                          rows.add(row)
                      }
                  }
                  db.close()
                  Triple(cols, rows, null)
              } catch (e: Exception) { Triple(emptyList(), emptyList(), "读取失败：" + (e.message ?: "")) }
          }

          @Composable
          fun SqliteViewerScreen(item: FileItem, onDismiss: () -> Unit) {
              var tables by remember { mutableStateOf<List<String>>(emptyList()) }
              var selected by remember { mutableStateOf<String?>(null) }
              var columns by remember { mutableStateOf<List<String>>(emptyList()) }
              var rows by remember { mutableStateOf<List<List<String>>>(emptyList()) }
              var errorMsg by remember { mutableStateOf<String?>(null) }
              var loading by remember { mutableStateOf(true) }

              LaunchedEffect(item.path) {
                  val (t, err) = withContext(Dispatchers.IO) { loadSqliteTables(item.file) }
                  tables = t
                  errorMsg = err
                  loading = false
              }
              LaunchedEffect(selected) {
                  val t = selected ?: return@LaunchedEffect
                  loading = true
                  val (cols, rws, err) = withContext(Dispatchers.IO) { loadSqliteTable(item.file, t, 200) }
                  columns = cols
                  rows = rws
                  errorMsg = err
                  loading = false
              }
              BackHandler { if (selected != null) selected = null else onDismiss() }

              Column(Modifier.fillMaxSize()) {
                  Surface(color = MaterialTheme.colorScheme.surfaceContainer) {
                      Row(modifier = Modifier.fillMaxWidth().statusBarsPadding().height(64.dp).padding(horizontal = 4.dp),
                          verticalAlignment = Alignment.CenterVertically) {
                          IconButton(onClick = { if (selected != null) selected = null else onDismiss() }) {
                              Icon(Icons.Filled.ArrowBack, "返回")
                          }
                          Column(Modifier.weight(1f).padding(horizontal = 4.dp)) {
                              Text(selected ?: "数据库", style = MaterialTheme.typography.titleLarge,
                                  maxLines = 1, overflow = TextOverflow.Ellipsis)
                              Text(if (selected == null) item.name + " · " + tables.size + " 张表"
                                  else "显示前 200 行 · " + columns.size + " 列",
                                  style = MaterialTheme.typography.labelSmall,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant, maxLines = 1)
                          }
                      }
                  }
                  when {
                      loading && selected == null && tables.isEmpty() -> Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Text("读取中…", color = MaterialTheme.colorScheme.onSurfaceVariant)
                      }
                      errorMsg != null -> Box(Modifier.fillMaxSize().padding(32.dp), contentAlignment = Alignment.Center) {
                          Text(errorMsg ?: "", color = MaterialTheme.colorScheme.error)
                      }
                      selected == null -> {
                          if (tables.isEmpty()) Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                              Text("没有表", color = MaterialTheme.colorScheme.onSurfaceVariant)
                          }
                          else LazyColumn(Modifier.fillMaxSize(), contentPadding = PaddingValues(vertical = 4.dp)) {
                              items(count = tables.size, key = { tables[it] }) { i ->
                                  Row(
                                      modifier = Modifier.fillMaxWidth().clickable { selected = tables[i] }
                                          .padding(horizontal = 20.dp, vertical = 12.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Icon(Icons.Filled.Storage, null, modifier = Modifier.size(20.dp),
                                          tint = MaterialTheme.colorScheme.primary)
                                      Spacer(Modifier.width(12.dp))
                                      Text(tables[i], style = MaterialTheme.typography.bodyMedium,
                                          fontFamily = FontFamily.Monospace, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                  }
                              }
                          }
                      }
                      else -> {
                          Box(Modifier.fillMaxSize().horizontalScroll(rememberScrollState())) {
                              Column(Modifier.width((columns.size * 140).dp.coerceAtLeast(280.dp)).fillMaxHeight()) {
                                  Row(Modifier.background(MaterialTheme.colorScheme.surfaceContainerHigh)) {
                                      columns.forEach { c ->
                                          Text(c, style = MaterialTheme.typography.labelMedium,
                                              fontWeight = FontWeight.SemiBold, maxLines = 1, overflow = TextOverflow.Ellipsis,
                                              modifier = Modifier.width(140.dp).padding(horizontal = 8.dp, vertical = 10.dp))
                                      }
                                  }
                                  LazyColumn(Modifier.weight(1f)) {
                                      items(count = rows.size) { i ->
                                          val r = rows[i]
                                          Row(Modifier.background(
                                              if (i % 2 == 0) MaterialTheme.colorScheme.surface
                                              else MaterialTheme.colorScheme.surfaceContainerLow)) {
                                              r.forEach { cell ->
