                                      if (vm.sortKey == v) MaterialTheme.colorScheme.secondaryContainer
                                      else MaterialTheme.colorScheme.outline, RoundedCornerShape(20.dp))
                                  .clickable { vm.updateSort(v) }
                          ) {
                              Text(label, style = MaterialTheme.typography.labelMedium,
                                  color = if (vm.sortKey == v) MaterialTheme.colorScheme.onSecondaryContainer
                                      else MaterialTheme.colorScheme.onSurface,
                                  modifier = Modifier.padding(horizontal = 16.dp, vertical = 8.dp))
                          }
                      }
                  }

                  Spacer(Modifier.height(20.dp))
                  Text("工具", style = MaterialTheme.typography.labelMedium,
                      color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.SemiBold,
                      modifier = Modifier.padding(vertical = 8.dp))
                  Box(
