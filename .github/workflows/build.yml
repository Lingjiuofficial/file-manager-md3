              NavEntry(Icons.Filled.Schedule, "最近"),
              NavEntry(Icons.Filled.Star, "收藏"),
              NavEntry(Icons.Filled.Settings, "设置")
          )

          private sealed interface UiSheet {
              data object NewMenu : UiSheet
              data class ItemMenu(val item: FileItem) : UiSheet
          }

          private sealed interface UiDialog {
              data object NewFolder : UiDialog
              data object NewFile : UiDialog
              data class Rename(val item: FileItem) : UiDialog
              data class Delete(val item: FileItem) : UiDialog
          }

          private fun hasPermission(): Boolean {
              return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) Environment.isExternalStorageManager() else true
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun FileManagerScreen(vm: FileManagerViewModel = viewModel()) {
              val ctx = LocalContext.current
              var granted by remember { mutableStateOf(hasPermission()) }
              val settingsLauncher = rememberLauncherForActivityResult(ActivityResultContracts.StartActivityForResult()) { granted = hasPermission() }
              LaunchedEffect(Unit) { granted = hasPermission() }

              if (!granted) {
                  Column(Modifier.fillMaxSize().padding(32.dp), horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.Center) {
                      Icon(Icons.Filled.Folder, null, modifier = Modifier.size(80.dp), tint = MaterialTheme.colorScheme.primary)
                      Spacer(Modifier.height(24.dp))
                      Text("需要存储访问权限", style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Medium)
                      Spacer(Modifier.height(8.dp))
                      Text("请授予「所有文件访问权限」以管理设备文件", style = MaterialTheme.typography.bodyMedium,
                          color = MaterialTheme.colorScheme.onSurfaceVariant)
                      Spacer(Modifier.height(24.dp))
                      Box(
                          modifier = Modifier
                              .clip(RoundedCornerShape(20.dp))
                              .background(MaterialTheme.colorScheme.primary)
                              .clickable {
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                                      try {
                                          settingsLauncher.launch(Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION)
                                              .setData(Uri.parse("package:" + ctx.packageName)))
                                      } catch (e: Exception) {
                                          settingsLauncher.launch(Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION))
                                      }
                                  }
                              }
                      ) {
                          Text("去授权", color = MaterialTheme.colorScheme.onPrimary,
                              style = MaterialTheme.typography.labelLarge,
                              modifier = Modifier.padding(horizontal = 24.dp, vertical = 12.dp))
                      }
                  }
                  return
              }

              val snackbar = remember { SnackbarHostState() }
              LaunchedEffect(vm.snackMessage) {
                  val msg = vm.snackMessage
                  if (msg != null) { snackbar.showSnackbar(msg); vm.consumeSnack() }
              }

              var sheet by remember { mutableStateOf<UiSheet?>(null) }
              var dialog by remember { mutableStateOf<UiDialog?>(null) }
              var previewItem by remember { mutableStateOf<FileItem?>(null) }

              val onOpenItem: (FileItem) -> Unit = { item ->
                  when {
                      item.isDirectory -> vm.open(item)
                      item.kind == FileKind.APK -> { openFileWithSystem(ctx, item); vm.recordRecent(item) }
                      else -> previewItem = item
                  }
              }

              Scaffold(
                  containerColor = MaterialTheme.colorScheme.background,
                  snackbarHost = { SnackbarHost(snackbar) },
                  topBar = {
                      Surface(color = MaterialTheme.colorScheme.background) {
                          Column(Modifier.statusBarsPadding()) {
                              Row(Modifier.fillMaxWidth().height(64.dp).padding(horizontal = 4.dp),
                                  verticalAlignment = Alignment.CenterVertically) {
                                  when (vm.currentTab) {
                                      Tab.FILES -> {
                                          if (vm.currentCategory != CategoryKind.ALL) {
                                              IconButton(onClick = { vm.selectCategory(CategoryKind.ALL) }) {
                                                  Icon(Icons.Filled.ArrowBack, "返回")
                                              }
                                              Text(vm.currentCategory.label, style = MaterialTheme.typography.titleLarge,
                                                  fontWeight = FontWeight.Medium,
                                                  modifier = Modifier.weight(1f).padding(horizontal = 4.dp))
                                              if (vm.isScanning) Text("扫描中…", style = MaterialTheme.typography.labelSmall,
                                                  color = MaterialTheme.colorScheme.primary)
                                              IconButton(onClick = { vm.scanCategory(vm.currentCategory) }, enabled = !vm.isScanning) {
                                                  Icon(Icons.Filled.Schedule, "重新扫描")
                                              }
                                          } else {
                                              if (vm.searchMode) {
                                                  IconButton(onClick = { vm.exitSearch() }) { Icon(Icons.Filled.ArrowBack, "返回") }
                                                  BasicTextField(value = vm.searchQuery, onValueChange = { vm.doSearch(it) },
                                                      modifier = Modifier.weight(1f),
                                                      textStyle = TextStyle(color = MaterialTheme.colorScheme.onSurface,
                                                          fontSize = MaterialTheme.typography.bodyLarge.fontSize),
                                                      singleLine = true, cursorBrush = SolidColor(MaterialTheme.colorScheme.primary),
                                                      keyboardOptions = KeyboardOptions(imeAction = ImeAction.Search),
                                                      decorationBox = { inner -> Box {
                                                          if (vm.searchQuery.isEmpty()) Text("搜索当前目录...",
                                                              color = MaterialTheme.colorScheme.onSurfaceVariant)
                                                          inner()
                                                      } })
                                                  IconButton(onClick = { vm.exitSearch() }) { Icon(Icons.Filled.Close, "关闭") }
                                              } else {
                                                  val canUp = vm.currentDir.parentFile != null
                                                  IconButton(onClick = { vm.goUp() }, enabled = canUp) {
                                                      Icon(Icons.Filled.ArrowBack, "返回",
                                                          tint = if (canUp) MaterialTheme.colorScheme.onSurface else MaterialTheme.colorScheme.onSurfaceVariant)
                                                  }
                                                  Text(vm.currentDir.name.ifEmpty { "存储" }, style = MaterialTheme.typography.titleLarge,
                                                      fontWeight = FontWeight.Medium, maxLines = 1, overflow = TextOverflow.Ellipsis,
                                                      modifier = Modifier.weight(1f).padding(horizontal = 4.dp))
                                                  IconButton(onClick = { vm.globalSearchMode = true }) {
                                                      Icon(Icons.Filled.Search, "全局搜索")
                                                  }
                                                  IconButton(onClick = { vm.updateGrid(!vm.gridMode) }) {
                                                      Icon(if (vm.gridMode) Icons.Filled.ViewList else Icons.Filled.GridView, "切换视图")
                                                  }
                                              }
                                          }
                                      }
                                      else -> Text(
                                          when (vm.currentTab) { Tab.RECENT -> "最近"; Tab.STARRED -> "收藏"; else -> "设置" },
                                          style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Medium,
                                          modifier = Modifier.weight(1f).padding(horizontal = 16.dp))
                                  }
                              }
                              if (vm.currentTab == Tab.FILES && vm.currentCategory == CategoryKind.ALL && !vm.searchMode) {
                                  val crumbs = remember(vm.currentDir.path) { vm.breadcrumbs() }
                                  Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState())
                                      .padding(horizontal = 12.dp, vertical = 4.dp),
                                      verticalAlignment = Alignment.CenterVertically) {
                                      crumbs.forEachIndexed { i, f ->
                                          val last = i == crumbs.lastIndex
                                          Box(
                                              modifier = Modifier
                                                  .clip(if (LocalUiStyle.current == UiStyle.MI_MINIX) RoundedCornerShape(50) else RoundedCornerShape(16.dp))
                                                  .background(if (last) MaterialTheme.colorScheme.secondaryContainer else MaterialTheme.colorScheme.surface)
                                                  .clickable { vm.navigateTo(f) }
                                          ) {
                                              Text(if (f.name.isEmpty()) "存储" else f.name, style = MaterialTheme.typography.labelMedium,
                                                  color = if (last) MaterialTheme.colorScheme.onSecondaryContainer else MaterialTheme.colorScheme.onSurfaceVariant,
                                                  modifier = Modifier.padding(horizontal = 10.dp, vertical = 6.dp))
                                          }
                                          if (!last) Icon(Icons.Filled.ChevronRight, null,
                                              tint = MaterialTheme.colorScheme.outline, modifier = Modifier.size(16.dp))
                                      }
                                  }
                                  CategoryBar(vm.currentCategory, vm::selectCategory)
                              }
                          }
                      }
                  },

              floatingActionButton = {
                  if (vm.currentTab != Tab.SETTINGS && vm.currentCategory == CategoryKind.ALL) {
                      FloatingActionButton(onClick = { sheet = UiSheet.NewMenu },
                          modifier = Modifier.padding(bottom = 96.dp, end = 8.dp),
                          containerColor = MaterialTheme.colorScheme.primaryContainer,
                          contentColor = MaterialTheme.colorScheme.onPrimaryContainer,
                          shape = if (LocalUiStyle.current == UiStyle.MI_MINIX) CircleShape else RoundedCornerShape(16.dp)) {
                          Icon(if (vm.clipboard != null) Icons.Filled.ContentPaste else Icons.Filled.Add, "新建")
                      }
                  }
              }
          ) { inner ->
              Box(Modifier.fillMaxSize().padding(inner)) {
                  if (vm.currentTab == Tab.SETTINGS) SettingsScreen(vm)
                  else if (vm.currentTab == Tab.FILES && vm.currentCategory != CategoryKind.ALL) {
                      if (vm.isScanning && vm.categoryItems.isEmpty()) {
                          Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                              Text("正在扫描整个设备…", color = MaterialTheme.colorScheme.onSurfaceVariant)
                          }
                      } else if (vm.categoryItems.isEmpty()) {
                          Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                              Text("未找到" + vm.currentCategory.label + "类文件",
                                  color = MaterialTheme.colorScheme.onSurfaceVariant)
                          }
                      } else {
                          FileList(vm.categoryItems, vm.starredPaths, onOpen = onOpenItem,
                              onMenu = { item -> sheet = UiSheet.ItemMenu(item) }, grid = vm.gridMode)
                      }
                  } else {
                      PullToRefreshBox(isRefreshing = vm.isRefreshing, onRefresh = { vm.pullToRefresh() },
                          modifier = Modifier.fillMaxSize()) {
                          when (vm.currentTab) {
                              Tab.FILES -> {
                                  if (vm.items.isEmpty()) {
                                      EmptyStateList(if (vm.searchQuery.isNotBlank()) "没有匹配项" else "这个文件夹是空的",
                                          if (vm.searchQuery.isNotBlank()) "试试其他关键词" else "下拉刷新，或点击右下角 + 新建")
                                  } else FileList(vm.items, vm.starredPaths, onOpen = onOpenItem,
                                      onMenu = { item -> sheet = UiSheet.ItemMenu(item) }, grid = vm.gridMode)
                              }
                              Tab.RECENT -> {
                                  if (vm.recentItems.isEmpty()) EmptyStateList("暂无最近文件", "打开过的文件会出现在这里")
                                  else FileList(vm.recentItems, vm.starredPaths, onOpen = onOpenItem,
                                      onMenu = { item -> sheet = UiSheet.ItemMenu(item) }, grid = vm.gridMode)
                              }
                              Tab.STARRED -> {
                                  if (vm.starredItems.isEmpty()) EmptyStateList("暂无收藏", "在菜单中点击收藏即可加入")
                                  else FileList(vm.starredItems, vm.starredPaths, onOpen = onOpenItem,
                                      onMenu = { item -> sheet = UiSheet.ItemMenu(item) }, grid = vm.gridMode)
                              }
                              Tab.SETTINGS -> {}
                          }
                      }
                  }
                  FloatingNavBar(items = navItems, selectedIndex = vm.currentTab.ordinal,
                      onSelect = { vm.currentTab = Tab.values()[it] },
                      modifier = Modifier.align(Alignment.BottomCenter).navigationBarsPadding().padding(bottom = 16.dp))
              }
          }

              if (vm.globalSearchMode) GlobalSearchScreen(vm = vm, onDismiss = { vm.exitGlobalSearch() })

              val p = previewItem
              if (p != null) FullScreenPreview(item = p, vm = vm, onDismiss = { vm.recordRecent(p); previewItem = null })

              when (val s = sheet) {
                  is UiSheet.ItemMenu -> {
                      val item = s.item
                      ActionSheet(title = item.name, subtitle = item.subtitle, actions = buildList {
                          add(SheetAction(
                              if (item.isDirectory) Icons.Filled.FolderOpen
                              else if (item.kind == FileKind.APK) Icons.Filled.Android
                              else if (item.kind == FileKind.EXECUTABLE) Icons.Filled.Terminal
                              else Icons.Filled.InsertDriveFile,
                              when {
                                  item.isDirectory -> "打开"
                                  item.kind == FileKind.APK -> "安装"
                                  item.kind == FileKind.EXECUTABLE -> "运行"
                                  item.kind == FileKind.VIDEO -> "播放"
                                  item.kind == FileKind.AUDIO -> "播放"
                                  else -> "打开"
                              }) {
                              when {
                                  item.isDirectory -> vm.open(item)
                                  item.kind == FileKind.APK -> { openFileWithSystem(ctx, item); vm.recordRecent(item) }
                                  item.kind == FileKind.EXECUTABLE -> { openFileWithSystem(ctx, item); vm.recordRecent(item) }
                                  else -> previewItem = item
                              }
                          })
                          if (!item.isDirectory && item.kind != FileKind.APK && item.kind != FileKind.EXECUTABLE) {
                              add(SheetAction(Icons.Filled.FolderOpen, "用其他应用打开") { openFileWithSystem(ctx, item); vm.recordRecent(item) })
                          }
                          add(SheetAction(if (vm.isStarred(item.path)) Icons.Filled.Star else Icons.Filled.StarBorder,
                              if (vm.isStarred(item.path)) "取消收藏" else "收藏") { vm.toggleStar(item) })
                          add(SheetAction(Icons.Filled.Edit, "重命名") { dialog = UiDialog.Rename(item) })
                          add(SheetAction(Icons.Filled.ContentCopy, "复制") { vm.copy(item) })
                          add(SheetAction(Icons.Filled.ContentCut, "剪切") { vm.cut(item) })
                          if (item.isDirectory) add(SheetAction(Icons.Filled.ContentPaste, "粘贴到此处",
                              enabled = vm.clipboard != null) { vm.pasteInto(item.file) })
                          add(SheetAction(Icons.Filled.Delete, "删除", destructive = true) { dialog = UiDialog.Delete(item) })
                      }, onDismiss = { sheet = null })
                  }
                  UiSheet.NewMenu -> {
                      ActionSheet(title = "新建", actions = buildList {
                          add(SheetAction(Icons.Filled.CreateNewFolder, "新建文件夹") { dialog = UiDialog.NewFolder })
                          add(SheetAction(Icons.Filled.InsertDriveFile, "新建文件") { dialog = UiDialog.NewFile })
                          if (vm.clipboard != null) add(SheetAction(Icons.Filled.ContentPaste, "粘贴到此处") { vm.pasteInto() })
                      }, onDismiss = { sheet = null })
                  }
                  null -> Unit
              }

              when (val d = dialog) {
                  UiDialog.NewFolder -> TextInputDialog(title = "新建文件夹", initial = "新建文件夹",
                      onConfirm = { vm.createFolder(it) }, onDismiss = { dialog = null })
                  UiDialog.NewFile -> TextInputDialog(title = "新建文件", initial = "新建文件.txt",
                      onConfirm = { vm.createFile(it) }, onDismiss = { dialog = null })
                  is UiDialog.Rename -> TextInputDialog(title = "重命名", initial = d.item.name,
                      onConfirm = { vm.rename(d.item, it) }, onDismiss = { dialog = null })
                  is UiDialog.Delete -> ConfirmDialog(title = "删除「" + d.item.name + "」？",
                      message = if (d.item.isDirectory) "该文件夹及其中所有内容都将被删除，此操作不可撤销。" else "此操作不可撤销。",
                      confirmText = "删除", destructive = true,
                      onConfirm = { vm.delete(d.item) }, onDismiss = { dialog = null })
                  null -> Unit
              }
          }

          @Composable
          fun EmptyStateList(title: String, subtitle: String) {
              LazyColumn(Modifier.fillMaxSize()) {
                  item {
                      Column(Modifier.fillParentMaxSize().padding(bottom = 120.dp),
                          horizontalAlignment = Alignment.CenterHorizontally,
                          verticalArrangement = Arrangement.Center) {
                          Icon(Icons.Filled.Folder, null, modifier = Modifier.size(64.dp),
                              tint = MaterialTheme.colorScheme.outlineVariant)
                          Spacer(Modifier.height(16.dp))
                          Text(title, style = MaterialTheme.typography.titleMedium)
                          Spacer(Modifier.height(4.dp))
                          Text(subtitle, style = MaterialTheme.typography.bodyMedium,
                              color = MaterialTheme.colorScheme.onSurfaceVariant)
                      }
                  }
              }
          }

          @Composable
          fun SettingsScreen(vm: FileManagerViewModel) {
              val ctx = LocalContext.current
              val activity = ctx as? Activity
              val refreshRates = remember { activity?.let { supportedRefreshRates(it) } ?: listOf(60f) }

              Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState())
                  .padding(horizontal = 16.dp).padding(bottom = 120.dp)) {

                  Spacer(Modifier.height(8.dp))
                  Text("外观", style = MaterialTheme.typography.labelMedium,
                      color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.SemiBold,
                      modifier = Modifier.padding(vertical = 8.dp))

                  Text("界面风格", style = MaterialTheme.typography.bodyLarge)
                  Spacer(Modifier.height(8.dp))
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      listOf(UiStyle.MATERIAL_YOU to "Material You",
                          UiStyle.MI_MINIX to "小米 Minix").forEach { pair ->
                          val (style, label) = pair
                          val selected = vm.uiStyle == style
                          Box(
                              modifier = Modifier
                                  .clip(RoundedCornerShape(20.dp))
                                  .background(if (selected) MaterialTheme.colorScheme.secondaryContainer
                                      else MaterialTheme.colorScheme.surface)
                                  .border(1.dp,
                                      if (selected) MaterialTheme.colorScheme.secondaryContainer
                                      else MaterialTheme.colorScheme.outline, RoundedCornerShape(20.dp))
                                  .clickable {
                                      vm.updateUiStyle(style)
                                      vm.showSnack("已切换到「" + label + "」风格")
                                  }
                          ) {
                              Text(label, style = MaterialTheme.typography.labelMedium,
                                  color = if (selected) MaterialTheme.colorScheme.onSecondaryContainer
                                      else MaterialTheme.colorScheme.onSurface,
                                  modifier = Modifier.padding(horizontal = 16.dp, vertical = 8.dp))
                          }
                      }
                  }
                  Spacer(Modifier.height(4.dp))
                  Text("两种风格都跟随壁纸动态取色；小米 Minix = 悬浮胶囊底栏 + 大圆角卡片",
                      style = MaterialTheme.typography.labelSmall,
                      color = MaterialTheme.colorScheme.onSurfaceVariant)

                  Spacer(Modifier.height(20.dp))
                  Text("屏幕刷新率", style = MaterialTheme.typography.bodyLarge)
                  Text("从系统支持的刷新率中选择", style = MaterialTheme.typography.labelMedium,
                      color = MaterialTheme.colorScheme.onSurfaceVariant)
                  Spacer(Modifier.height(8.dp))
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      refreshRates.forEach { hz ->
                          val label = hz.toInt().toString() + "Hz"
                          val selected = kotlin.math.abs(vm.preferredHz - hz) < 1f
                          Box(
                              modifier = Modifier
                                  .clip(RoundedCornerShape(20.dp))
                                  .background(if (selected) MaterialTheme.colorScheme.secondaryContainer
                                      else MaterialTheme.colorScheme.surface)
                                  .border(1.dp,
                                      if (selected) MaterialTheme.colorScheme.secondaryContainer
                                      else MaterialTheme.colorScheme.outline, RoundedCornerShape(20.dp))
                                  .clickable {
                                      vm.updatePreferredHz(hz)
                                      activity?.let { a -> applyRefreshRate(a, hz) }
                                  }
                          ) {
                              Text(label, style = MaterialTheme.typography.labelMedium,
                                  color = if (selected) MaterialTheme.colorScheme.onSecondaryContainer
                                      else MaterialTheme.colorScheme.onSurface,
                                  modifier = Modifier.padding(horizontal = 16.dp, vertical = 8.dp))
                          }
                      }
                  }

                  Spacer(Modifier.height(20.dp))
                  Text("浏览", style = MaterialTheme.typography.labelMedium,
                      color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.SemiBold,
                      modifier = Modifier.padding(vertical = 8.dp))
                  Row(Modifier.fillMaxWidth().padding(vertical = 12.dp),
                      verticalAlignment = Alignment.CenterVertically) {
                      Column(Modifier.weight(1f)) {
                          Text("显示隐藏文件", style = MaterialTheme.typography.bodyLarge)
                          Text("以 . 开头的文件与文件夹", style = MaterialTheme.typography.labelMedium,
                              color = MaterialTheme.colorScheme.onSurfaceVariant)
                      }
                      Switch(checked = vm.showHidden, onCheckedChange = vm::updateShowHidden)
                  }
                  Spacer(Modifier.height(12.dp))
                  Text("默认视图", style = MaterialTheme.typography.bodyLarge)
                  Spacer(Modifier.height(8.dp))
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      listOf("列表" to false, "网格" to true).forEach { pair ->
                          val (label, v) = pair
                          Box(
                              modifier = Modifier
                                  .clip(RoundedCornerShape(20.dp))
                                  .background(if (vm.gridMode == v) MaterialTheme.colorScheme.secondaryContainer
                                      else MaterialTheme.colorScheme.surface)
                                  .border(1.dp,
                                      if (vm.gridMode == v) MaterialTheme.colorScheme.secondaryContainer
                                      else MaterialTheme.colorScheme.outline, RoundedCornerShape(20.dp))
                                  .clickable { vm.updateGrid(v) }
                          ) {
                              Text(label, style = MaterialTheme.typography.labelMedium,
                                  color = if (vm.gridMode == v) MaterialTheme.colorScheme.onSecondaryContainer
                                      else MaterialTheme.colorScheme.onSurface,
                                  modifier = Modifier.padding(horizontal = 16.dp, vertical = 8.dp))
                          }
                      }
                  }
                  Spacer(Modifier.height(20.dp))
                  Text("排序方式", style = MaterialTheme.typography.bodyLarge)
                  Spacer(Modifier.height(8.dp))
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      listOf("名称" to SortKey.NAME, "大小" to SortKey.SIZE, "时间" to SortKey.MTIME).forEach { pair ->
                          val (label, v) = pair
                          Box(
                              modifier = Modifier
                                  .clip(RoundedCornerShape(20.dp))
                                  .background(if (vm.sortKey == v) MaterialTheme.colorScheme.secondaryContainer
                                      else MaterialTheme.colorScheme.surface)
                                  .border(1.dp,
                                      if (vm.sortKey == v) MaterialTheme.colorScheme.secondaryContainer
                                      else MaterialTheme.colorScheme.outline, RoundedCornerShape(20.dp))
                                  .clickable { vm.updateSort(v) }
                          ) {
                              Text(label, style = MaterialTheme.typography.labelMedium,
                                  color = if (vm.sortKey == v) MaterialTheme.colorScheme.onSecondaryContainer
                                      else MaterialTheme.colorScheme.onSurface,
                                  modifier = Modifier.padding(horizontal = 16.dp, vertical = 8.dp))
                          }
                      }
                  }

                  Spacer(Modifier.height(24.dp))
                  Text("关于", style = MaterialTheme.typography.labelMedium,
                      color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.SemiBold,
                      modifier = Modifier.padding(vertical = 8.dp))
                  Surface(color = MaterialTheme.colorScheme.surfaceContainerLow,
                      shape = RoundedCornerShape(16.dp), modifier = Modifier.fillMaxWidth()) {
                      Column(Modifier.padding(16.dp)) {
                          Text("Files · MD3  v3.5", style = MaterialTheme.typography.bodyMedium,
                              fontWeight = FontWeight.Medium)
                          Spacer(Modifier.height(4.dp))
                          Text("Minix 动态取色 · Zip 完整编辑 · 全屏播放器",
                              style = MaterialTheme.typography.labelSmall,
                              color = MaterialTheme.colorScheme.onSurfaceVariant)
                      }
                  }
              }
          }

          class MainActivity : ComponentActivity() {
              private val prefs by lazy { getSharedPreferences("fm_md3", 0) }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  val savedHz = prefs.getFloat("preferredHz", 0f)
                  window.decorView.post {
                      if (savedHz > 0f) applyRefreshRate(this, savedHz)
                  }
                  setContent {
                      val vm: FileManagerViewModel = viewModel()
                      MD3Theme(vm.uiStyle) {
                          FileManagerScreen(vm)
                      }
                  }
              }
          }
          KOTLIN_EOF

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: files-md3-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
