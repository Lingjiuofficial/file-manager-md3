          private val DATE_FORMATTER: DateTimeFormatter =
              DateTimeFormatter.ofPattern("yyyy-MM-dd HH:mm", Locale.getDefault())
          private val ZONE_ID: ZoneId = ZoneId.systemDefault()

          @Immutable
          data class FileItem(
              val path: String,
              val name: String,
              val isDirectory: Boolean,
              val size: Long,
              val lastModified: Long,
              val extension: String,
              val kind: FileKind,
              val subtitle: String
          ) {
              val file: File get() = File(path)
          }

          fun kindOf(extension: String, isDirectory: Boolean): FileKind {
              if (isDirectory) return FileKind.FOLDER
              return EXT_TO_KIND[extension] ?: FileKind.FILE
          }

          fun humanSize(bytes: Long): String {
              if (bytes < 1024L) return bytes.toString() + " B"
              val kb = bytes / 1024L
              if (kb < 1024L) return kb.toString() + " KB"
              val mb = kb / 1024L
              if (mb < 1024L) {
                  if (mb < 10L) {
                      val tenth = (kb % 1024L) * 10L / 1024L
                      if (tenth == 0L) return mb.toString() + " MB"
                      return mb.toString() + "." + tenth.toString() + " MB"
                  }
                  return mb.toString() + " MB"
              }
              val gb = mb / 1024L
              return gb.toString() + " GB"
          }

          fun formatDate(ts: Long): String =
              Instant.ofEpochMilli(ts).atZone(ZONE_ID).format(DATE_FORMATTER)

          fun kindLabel(k: FileKind): String = when (k) {
              FileKind.IMAGE -> "图片"
              FileKind.VIDEO -> "视频"
              FileKind.AUDIO -> "音频"
              FileKind.ARCHIVE -> "压缩包"
              FileKind.CODE -> "文本"
              FileKind.PDF -> "PDF"
              FileKind.DOCUMENT -> "文档"
              FileKind.APK -> "安装包"
              FileKind.FONT -> "字体"
              FileKind.DATABASE -> "数据库"
              FileKind.DISK_IMAGE -> "磁盘镜像"
              FileKind.TORRENT -> "种子"
              FileKind.EXECUTABLE -> "可执行"
              FileKind.FOLDER -> "文件夹"
              FileKind.FILE -> "文件"
          }

          fun File.toItem(): FileItem {
              // 单次 statx 读取目录/大小/时间，替代 isDirectory()+length()+lastModified() 三次独立 stat
              val attr = try { Files.readAttributes(toPath(), BasicFileAttributes::class.java) } catch (_: Exception) { null }
              val isDir: Boolean
              val sz: Long
              val lm: Long
              if (attr != null) {
                  isDir = attr.isDirectory
                  sz = if (isDir) 0L else attr.size()
                  lm = attr.lastModifiedTime().toMillis()
              } else {
                  isDir = isDirectory
                  sz = if (isDir) 0L else length()
                  lm = lastModified()
              }
              val ext = if (isDir || !name.contains('.')) ""
                  else name.substringAfterLast('.').lowercase(Locale.ROOT)
              val k = kindOf(ext, isDir)
              val sub = if (isDir) "文件夹 - " + formatDate(lm)
                  else kindLabel(k) + " - " + humanSize(sz) + " - " + formatDate(lm)
              return FileItem(absolutePath, name, isDir, sz, lm, ext, k, sub)
          }

          fun mimeOf(extension: String): String {
              return when (extension) {
                  "apk", "apks", "xapk", "apkm", "aab" -> "application/vnd.android.package-archive"
                  "ipa" -> "application/octet-stream"
                  "dmg" -> "application/x-apple-diskimage"
                  "vhd", "vhdx" -> "application/x-vhd"
