          private val DATE_FORMATTER: DateTimeFormatter =
              DateTimeFormatter.ofPattern("yyyy-MM-dd HH:mm", Locale.getDefault())
          private val ZONE_ID: ZoneId = ZoneId.systemDefault()

          @Immutable
          data class FileItem(
              val path: String,
              val name: String,
              val isDirectory: Boolean,
              val size: Long,
              val lastModified: Long,
              val extension: String,
              val kind: FileKind,
              val subtitle: String
          ) {
              val file: File get() = File(path)
          }

          fun kindOf(extension: String, isDirectory: Boolean): FileKind {
              if (isDirectory) return FileKind.FOLDER
              return EXT_TO_KIND[extension] ?: FileKind.FILE
          }

          fun humanSize(bytes: Long): String {
              if (bytes < 1024L) return bytes.toString() + " B"
              val kb = bytes / 1024L
              if (kb < 1024L) return kb.toString() + " KB"
              val mb = kb / 1024L
              if (mb < 1024L) {
                  if (mb < 10L) {
                      val tenth = (kb % 1024L) * 10L / 1024L
                      if (tenth == 0L) return mb.toString() + " MB"
                      return mb.toString() + "." + tenth.toString() + " MB"
                  }
                  return mb.toString() + " MB"
              }
              val gb = mb / 1024L
              return gb.toString() + " GB"
          }

          fun formatDate(ts: Long): String =
              Instant.ofEpochMilli(ts).atZone(ZONE_ID).format(DATE_FORMATTER)

          fun kindLabel(k: FileKind): String = when (k) {
              FileKind.IMAGE -> "图片"
              FileKind.VIDEO -> "视频"
              FileKind.AUDIO -> "音频"
              FileKind.ARCHIVE -> "压缩包"
              FileKind.CODE -> "文本"
              FileKind.PDF -> "PDF"
              FileKind.DOCUMENT -> "文档"
              FileKind.APK -> "安装包"
              FileKind.FONT -> "字体"
              FileKind.DATABASE -> "数据库"
              FileKind.DISK_IMAGE -> "磁盘镜像"
              FileKind.TORRENT -> "种子"
              FileKind.EXECUTABLE -> "可执行"
              FileKind.FOLDER -> "文件夹"
              FileKind.FILE -> "文件"
          }

          fun File.toItem(): FileItem {
              // 单次 statx 读取目录/大小/时间，替代 isDirectory()+length()+lastModified() 三次独立 stat
              val attr = try { Files.readAttributes(toPath(), BasicFileAttributes::class.java) } catch (_: Exception) { null }
              val isDir: Boolean
              val sz: Long
              val lm: Long
              if (attr != null) {
                  isDir = attr.isDirectory
                  sz = if (isDir) 0L else attr.size()
                  lm = attr.lastModifiedTime().toMillis()
              } else {
                  isDir = isDirectory
                  sz = if (isDir) 0L else length()
                  lm = lastModified()
              }
              val ext = if (isDir || !name.contains('.')) ""
                  else name.substringAfterLast('.').lowercase(Locale.ROOT)
              val k = kindOf(ext, isDir)
              val sub = if (isDir) "文件夹 - " + formatDate(lm)
                  else kindLabel(k) + " - " + humanSize(sz) + " - " + formatDate(lm)
              return FileItem(absolutePath, name, isDir, sz, lm, ext, k, sub)
          }

          fun mimeOf(extension: String): String {
              return when (extension) {
                  "apk", "apks", "xapk", "apkm", "aab" -> "application/vnd.android.package-archive"
                  "ipa" -> "application/octet-stream"
                  "dmg" -> "application/x-apple-diskimage"
                  "vhd", "vhdx" -> "application/x-vhd"
                  "vmdk" -> "application/x-vmdk"
                  "vdi" -> "application/x-virtualbox-vdi"
                  "qcow", "qcow2" -> "application/x-qemu-disk"
                  "torrent" -> "application/x-bittorrent"
                  "magnet" -> "application/x-magnet"
                  "ttf", "otf", "ttc", "otc" -> "font/*"
                  "woff" -> "font/woff"
                  "woff2" -> "font/woff2"
                  "eot" -> "application/vnd.ms-fontobject"
                  "sqlite", "sqlite3", "sqlitedb" -> "application/x-sqlite3"
                  "mdb", "accdb" -> "application/x-msaccess"
                  "dbf" -> "application/x-dbf"
                  "exe", "com", "scr", "pif" -> "application/x-msdownload"
                  "msi", "msp", "msu" -> "application/x-msi"
                  "deb" -> "application/vnd.debian.binary-package"
                  "rpm" -> "application/x-rpm"
                  "iso" -> "application/x-iso9660-image"
                  "jar" -> "application/java-archive"
                  "war", "ear" -> "application/java-archive"
                  "class" -> "application/java-vm"
                  "psd", "psb" -> "image/vnd.adobe.photoshop"
                  "ai", "eps" -> "application/postscript"
                  "xcf" -> "image/x-xcf"
                  "epub" -> "application/epub+zip"
                  "mobi" -> "application/x-mobipocket-ebook"
                  "azw", "azw3", "azw4" -> "application/vnd.amazon.ebook"
                  "fb2", "fb3" -> "application/x-fictionbook+xml"
                  "djvu", "djv" -> "image/vnd.djvu"
                  "cbr" -> "application/x-cbr"
                  "cbz" -> "application/x-cbz"
                  "chm" -> "application/vnd.ms-htmlhelp"
                  "xps", "oxps" -> "application/oxps"
                  "caj" -> "application/caj"
                  "pages" -> "application/x-iwork-pages-sffpages"
                  "numbers" -> "application/x-iwork-numbers-sffnumbers"
                  "key" -> "application/x-iwork-keynote-sffkey"
                  else -> {
                      val m = MimeTypeMap.getSingleton().getMimeTypeFromExtension(extension)
                      m ?: "*/*"
                  }
              }
          }

          fun openFileWithSystem(context: Context, item: FileItem) {
              if (item.isDirectory) return
              val type = mimeOf(item.extension)
              try {
                  val uri = FileProvider.getUriForFile(
                      context, context.packageName + ".fileprovider", item.file
                  )
                  val intent = Intent(Intent.ACTION_VIEW).apply {
                      setDataAndType(uri, type)
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
                  context.startActivity(intent)
              } catch (e: Exception) {
                  Toast.makeText(context, "没有应用可以打开此文件", Toast.LENGTH_SHORT).show()
              }
          }

          fun applyRefreshRate(activity: Activity, targetHz: Float) {
              try {
                  val display = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) activity.display
                      else @Suppress("DEPRECATION") activity.windowManager.defaultDisplay
                  if (display == null) return
                  val modes = display.supportedModes ?: return
                  if (modes.isEmpty()) return
                  val target = modes.minByOrNull { kotlin.math.abs(it.refreshRate - targetHz) } ?: return
                  val attrs = activity.window.attributes
                  attrs.preferredDisplayModeId = target.modeId
                  activity.window.attributes = attrs
              } catch (_: Exception) {}
          }

          fun supportedRefreshRates(activity: Activity): List<Float> {
              return try {
                  val display = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) activity.display
                      else @Suppress("DEPRECATION") activity.windowManager.defaultDisplay
                  val modes = display?.supportedModes ?: return listOf(60f)
                  modes.map { it.refreshRate }.distinct().sortedDescending()
              } catch (_: Exception) { listOf(60f) }
          }

          // ============================================================
          // Zip 编辑器（流式重建）
          // ============================================================
          object ZipEditor {
              private const val BUF_SIZE = 16 * 1024

              /** 删除条目：entriesToRemove 精确匹配；prefixToRemove 若不为 null 则删除以此开头的所有条目 */
              fun removeEntries(zipFile: File, entriesToRemove: Set<String>, prefixToRemove: String?): Boolean {
                  return rebuild(zipFile) { name ->
                      val shouldRemove = entriesToRemove.contains(name) ||
                          (prefixToRemove != null && (name == prefixToRemove || name.startsWith(prefixToRemove)))
                      !shouldRemove
                  }
              }

              /** 重命名条目（支持目录：会同时重命名目录下的所有条目） */
              fun renameEntry(zipFile: File, oldName: String, newName: String, isDirectory: Boolean): Boolean {
                  val tmp = File(zipFile.parentFile, zipFile.name + ".tmp_" + System.currentTimeMillis())
                  return try {
                      ZipInputStream(zipFile.inputStream().buffered()).use { zin ->
                          ZipOutputStream(tmp.outputStream().buffered()).use { zout ->
                              val buffer = ByteArray(BUF_SIZE)
                              var entry = zin.nextEntry
                              while (entry != null) {
                                  val name = entry.name
                                  val renamed = if (isDirectory) {
                                      if (name == oldName || name.startsWith(oldName)) {
                                          newName + name.removePrefix(oldName)
                                      } else name
                                  } else {
                                      if (name == oldName) newName else name
                                  }
                                  val newEntry = ZipEntry(renamed).apply {
                                      if (entry.time != -1L) time = entry.time
                                  }
                                  zout.putNextEntry(newEntry)
                                  var len: Int
                                  while (zin.read(buffer).also { len = it } > 0) {
                                      zout.write(buffer, 0, len)
                                  }
                                  zout.closeEntry()
                                  zin.closeEntry()
                                  entry = zin.nextEntry
                              }
                          }
                      }
                      replaceOriginal(zipFile, tmp)
                  } catch (e: Exception) {
                      try { tmp.delete() } catch (_: Exception) {}
                      false
                  }
              }

              /** 添加空文件夹（末尾带 / 的 ZipEntry） */
              fun addEmptyFolder(zipFile: File, folderPath: String): Boolean {
                  val normalized = if (folderPath.endsWith("/")) folderPath else "$folderPath/"
                  val tmp = File(zipFile.parentFile, zipFile.name + ".tmp_" + System.currentTimeMillis())
                  return try {
                      var exists = false
                      ZipInputStream(zipFile.inputStream().buffered()).use { zin ->
                          ZipOutputStream(tmp.outputStream().buffered()).use { zout ->
                              val buffer = ByteArray(BUF_SIZE)
                              var entry = zin.nextEntry
                              while (entry != null) {
                                  val name = entry.name
                                  if (name == normalized) exists = true
                                  val newEntry = ZipEntry(name).apply {
                                      if (entry.time != -1L) time = entry.time
                                  }
                                  zout.putNextEntry(newEntry)
                                  var len: Int
                                  while (zin.read(buffer).also { len = it } > 0) {
                                      zout.write(buffer, 0, len)
                                  }
                                  zout.closeEntry()
                                  zin.closeEntry()
                                  entry = zin.nextEntry
                              }
                              if (!exists) {
                                  val newEntry = ZipEntry(normalized).apply { time = System.currentTimeMillis() }
                                  zout.putNextEntry(newEntry)
                                  zout.closeEntry()
                              }
                          }
                      }
                      replaceOriginal(zipFile, tmp)
                  } catch (e: Exception) {
                      try { tmp.delete() } catch (_: Exception) {}
                      false
                  }
              }

              /** 添加一组文件（innerPath -> sourceFile） */
              fun addFiles(zipFile: File, additions: List<Pair<String, File>>): Boolean {
                  if (additions.isEmpty()) return false
                  val tmp = File(zipFile.parentFile, zipFile.name + ".tmp_" + System.currentTimeMillis())
                  return try {
                      val existing = HashSet<String>()
                      ZipInputStream(zipFile.inputStream().buffered()).use { zin ->
                          ZipOutputStream(tmp.outputStream().buffered()).use { zout ->
                              val buffer = ByteArray(BUF_SIZE)
                              var entry = zin.nextEntry
                              while (entry != null) {
                                  val name = entry.name
                                  existing.add(name)
                                  val newEntry = ZipEntry(name).apply {
                                      if (entry.time != -1L) time = entry.time
                                  }
                                  zout.putNextEntry(newEntry)
                                  var len: Int
                                  while (zin.read(buffer).also { len = it } > 0) {
                                      zout.write(buffer, 0, len)
                                  }
                                  zout.closeEntry()
                                  zin.closeEntry()
                                  entry = zin.nextEntry
                              }
                              for ((inner, src) in additions) {
                                  if (inner in existing) continue
                                  if (src.isDirectory) continue
                                  val newEntry = ZipEntry(inner).apply { time = System.currentTimeMillis() }
                                  zout.putNextEntry(newEntry)
                                  src.inputStream().buffered().use { input ->
                                      var len: Int
                                      while (input.read(buffer).also { len = it } > 0) {
                                          zout.write(buffer, 0, len)
                                      }
                                  }
                                  zout.closeEntry()
                              }
                          }
                      }
                      replaceOriginal(zipFile, tmp)
                  } catch (e: Exception) {
                      try { tmp.delete() } catch (_: Exception) {}
                      false
                  }
              }

              private inline fun rebuild(
                  zipFile: File,
                  keep: (String) -> Boolean
              ): Boolean {
                  val tmp = File(zipFile.parentFile, zipFile.name + ".tmp_" + System.currentTimeMillis())
                  return try {
                      ZipInputStream(zipFile.inputStream().buffered()).use { zin ->
                          ZipOutputStream(tmp.outputStream().buffered()).use { zout ->
                              val buffer = ByteArray(BUF_SIZE)
                              var entry = zin.nextEntry
                              while (entry != null) {
                                  val name = entry.name
                                  if (keep(name)) {
                                      val newEntry = ZipEntry(name).apply {
                                          if (entry.time != -1L) time = entry.time
                                      }
                                      zout.putNextEntry(newEntry)
                                      var len: Int
                                      while (zin.read(buffer).also { len = it } > 0) {
                                          zout.write(buffer, 0, len)
                                      }
                                      zout.closeEntry()
                                  }
                                  zin.closeEntry()
                                  entry = zin.nextEntry
                              }
                          }
                      }
                      replaceOriginal(zipFile, tmp)
                  } catch (e: Exception) {
                      try { tmp.delete() } catch (_: Exception) {}
                      false
                  }
              }

              private fun replaceOriginal(zipFile: File, tmp: File): Boolean {
                  if (tmp.length() <= 0L) { tmp.delete(); return false }
                  val backup = File(zipFile.parentFile, zipFile.name + ".bak_" + System.currentTimeMillis())
                  return if (zipFile.renameTo(backup)) {
                      if (tmp.renameTo(zipFile)) {
                          backup.delete()
                          true
                      } else {
                          backup.renameTo(zipFile)
                          tmp.delete()
                          false
                      }
                  } else {
                      tmp.delete()
                      false
                  }
              }
          }

          // ============================================================
          // 归档引擎：zip / jar / rar / 7z / tar / tgz 统一入口
          // （列条目 / 提取单条目 / 前缀解压；压缩包内编辑仅 zip / jar）
          // ============================================================
          private object ArchiveEngine {
              fun isSupported(ext: String): Boolean =
                  ext == "zip" || ext == "jar" || ext == "rar" || ext == "7z" || ext == "tar" || ext == "tgz" || ext == "tar.gz"

              fun isEditable(ext: String): Boolean = ext == "zip" || ext == "jar"

              private fun openTar(f: File, ext: String, body: (TarArchiveInputStream) -> Unit) {
                  f.inputStream().buffered().use { raw ->
                      if (ext == "tgz" || ext == "tar.gz") {
                          GzipCompressorInputStream(raw).use { gz -> TarArchiveInputStream(gz).use(body) }
                      } else {
                          TarArchiveInputStream(raw).use(body)
                      }
                  }
              }

              fun listEntries(f: File, ext: String): Pair<List<ZipEntryInfo>, String?> {
                  val res = ArrayList<ZipEntryInfo>(256)
                  return try {
                      when (ext) {
                          "zip", "jar" -> ZipFile(f).use { zip ->
                              val e = zip.entries()
                              while (e.hasMoreElements() && res.size < 5000) {
                                  val en = e.nextElement()
                                  res.add(ZipEntryInfo(en.name, en.size, en.isDirectory))
                              }
                          }
                          "rar" -> {
                              val arc = Archive(f)
                              try {
                                  var h = arc.nextFileHeader()
                                  while (h != null && res.size < 5000) {
                                      res.add(ZipEntryInfo(h.fileName.replace('\\', '/'), h.fullUnpackSize, h.isDirectory))
                                      h = arc.nextFileHeader()
                                  }
                              } finally { try { arc.close() } catch (_: Exception) {} }
                          }
                          "7z" -> {
                              SevenZFile.builder().setFile(f).get().use { zf ->
                                  var en = zf.nextEntry
                                  while (en != null && res.size < 5000) {
                                      res.add(ZipEntryInfo(en.name, en.size, en.isDirectory))
                                      en = zf.nextEntry
                                  }
                              }
                          }
                          "tar", "tgz", "tar.gz" -> openTar(f, ext) { tin ->
                              var en = tin.nextEntry
                              while (en != null && res.size < 5000) {
                                  res.add(ZipEntryInfo(en.name, en.size, en.isDirectory))
                                  en = tin.nextEntry
                              }
                          }
                          else -> return emptyList<ZipEntryInfo>() to ("暂不支持 ." + ext + " 内浏览")
                      }
                      res to null
                  } catch (e: Exception) { emptyList<ZipEntryInfo>() to ("读取失败：" + (e.message ?: "")) }
              }

              fun extractEntry(f: File, ext: String, entryName: String, cacheDir: File): File? {
                  return try {
                      cacheDir.mkdirs()
                      val baseName = entryName.substringAfterLast('/')
                      if (baseName.isEmpty()) null
                      else {
                          val outFile = File(cacheDir, baseName)
                          when (ext) {
                              "zip", "jar" -> {
                                  ZipFile(f).use { zip ->
                                      val en = zip.getEntry(entryName)
                                      if (en == null || en.isDirectory) return null
                                      zip.getInputStream(en).use { input -> outFile.outputStream().use { input.copyTo(it) } }
                                  }
                                  outFile
                              }
                              "rar" -> {
                                  val arc = Archive(f)
                                  try {
                                      var found: FileHeader? = null
                                      var h = arc.nextFileHeader()
                                      while (h != null) {
                                          if (!h.isDirectory && h.fileName.replace('\\', '/') == entryName) { found = h; break }
                                          h = arc.nextFileHeader()
                                      }
                                      val t = found ?: return null
                                      outFile.outputStream().buffered().use { out -> arc.extractFile(t, out) }
                                      outFile
                                  } finally { try { arc.close() } catch (_: Exception) {} }
                              }
                              "7z" -> {
                                  SevenZFile.builder().setFile(f).get().use { zf ->
                                      var en = zf.nextEntry
                                      var hit = false
                                      while (en != null) {
                                          if (en.name == entryName && !en.isDirectory) { hit = true; break }
                                          en = zf.nextEntry
                                      }
                                      if (!hit) return null
                                      outFile.outputStream().buffered().use { out ->
                                          val buf = ByteArray(64 * 1024)
                                          var r: Int
                                          while (zf.read(buf).also { r = it } > 0) out.write(buf, 0, r)
                                      }
                                      outFile
                                  }
                              }
                              "tar", "tgz", "tar.gz" -> {
                                  var hit = false
                                  openTar(f, ext) { tin ->
                                      var en = tin.nextEntry
                                      while (en != null) {
                                          if (en.name == entryName && !en.isDirectory) {
                                              hit = true
                                              outFile.outputStream().buffered().use { out ->
                                                  val buf = ByteArray(64 * 1024)
                                                  var r: Int
                                                  while (tin.read(buf).also { r = it } > 0) out.write(buf, 0, r)
                                              }
                                              break
                                          }
                                          en = tin.nextEntry
                                      }
                                  }
                                  if (hit) outFile else null
                              }
                              else -> null
                          }
                      }
                  } catch (_: Exception) { null }
              }

              fun extractAll(f: File, ext: String, target: File, prefix: String): Int {
                  var count = 0
                  val basePath = target.canonicalPath
                  val prefixPath = basePath + File.separator

                  fun included(name: String): Boolean =
                      prefix.isEmpty() || name == prefix.trimEnd('/') || name.startsWith(prefix)

                  fun outFor(name: String, isDir: Boolean): File? {
                      var relative = if (prefix.isEmpty()) name else name.removePrefix(prefix)
                      if (relative.isEmpty()) {
                          if (isDir) return null // 目录条目自身
                          relative = prefix.trimEnd('/').substringAfterLast('/') // 单文件：落到 basename
                          if (relative.isEmpty()) return null
                      } else if (relative == name && prefix.isNotEmpty()) {
                          return null // 无尾斜杠的目录条目自身
                      }
                      val outFile = File(target, relative)
                      val canon = outFile.canonicalPath
                      return if (canon == basePath || canon.startsWith(prefixPath)) outFile else null
                  }

                  try {
                      when (ext) {
                          "zip", "jar" -> ZipFile(f).use { zip ->
                              val e = zip.entries()
                              while (e.hasMoreElements()) {
                                  val en = e.nextElement()
                                  if (!included(en.name)) continue
                                  val out = outFor(en.name, en.isDirectory) ?: continue
                                  if (en.isDirectory) out.mkdirs()
                                  else {
                                      out.parentFile?.mkdirs()
                                      zip.getInputStream(en).use { input -> out.outputStream().buffered().use { input.copyTo(it) } }
                                      count++
                                  }
                              }
                          }
                          "rar" -> {
                              val arc = Archive(f)
                              try {
                                  var h = arc.nextFileHeader()
                                  while (h != null) {
                                      val name = h.fileName.replace('\\', '/')
                                      if (included(name)) {
                                          val out = outFor(name, h.isDirectory)
                                          if (out != null) {
                                              if (h.isDirectory) out.mkdirs()
                                              else {
                                                  out.parentFile?.mkdirs()
                                                  out.outputStream().buffered().use { o -> arc.extractFile(h, o) }
                                                  count++
                                              }
                                          }
                                      }
                                      h = arc.nextFileHeader()
                                  }
                              } finally { try { arc.close() } catch (_: Exception) {} }
                          }
                          "7z" -> {
                              SevenZFile.builder().setFile(f).get().use { zf ->
                                  val buf = ByteArray(64 * 1024)
                                  var en = zf.nextEntry
                                  while (en != null) {
                                      if (included(en.name)) {
                                          val out = outFor(en.name, en.isDirectory)
                                          if (out != null) {
                                              if (en.isDirectory) out.mkdirs()
                                              else {
                                                  out.parentFile?.mkdirs()
                                                  out.outputStream().buffered().use { o ->
                                                      var r: Int
                                                      while (zf.read(buf).also { r = it } > 0) o.write(buf, 0, r)
                                                  }
                                                  count++
                                              }
                                          }
                                      }
                                      en = zf.nextEntry
                                  }
                              }
                          }
                          "tar", "tgz", "tar.gz" -> openTar(f, ext) { tin ->
                              val buf = ByteArray(64 * 1024)
                              var en = tin.nextEntry
                              while (en != null) {
                                  if (included(en.name)) {
                                      val out = outFor(en.name, en.isDirectory)
                                      if (out != null) {
                                          if (en.isDirectory) out.mkdirs()
                                          else {
                                              out.parentFile?.mkdirs()
                                              out.outputStream().buffered().use { o ->
                                                  var r: Int
                                                  while (tin.read(buf).also { r = it } > 0) o.write(buf, 0, r)
                                              }
                                              count++
                                          }
                                      }
                                  }
                                  en = tin.nextEntry
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  return count
              }
          }

          // ============================================================
          // Root 文件管理（su -c · ls 解析降级链）
          // ============================================================

          data class RootEntry(
              val name: String, val path: String,
              val isDirectory: Boolean, val isLink: Boolean,
              val size: Long, val perm: String
          )

          /** su -c 命令执行器。所有拼入命令的路径必须经 [q] 转义。 */
          object RootShell {
              /** 只读快命令（ls / head / test） */
              const val TIMEOUT_MS = 15_000L
              /** 写操作（mkdir / mv / 小文件 cp） */
              const val TIMEOUT_WRITE_MS = 60_000L
              /** 重操作（rm -rf 大目录 / 大文件 cp） */
              const val TIMEOUT_LONG_MS = 120_000L

              fun available(): Boolean = try {
                  val (code, out, _) = run("id", 30_000L)
                  code == 0 && out.contains("uid=0")
              } catch (_: Exception) { false }

              /** 返回 退出码 to stdout to stderr；超时 force destroy 并以 -1 标记 */
              fun run(cmd: String, timeoutMs: Long = TIMEOUT_MS): Triple<Int, String, String> {
                  val proc = try {
                      ProcessBuilder("su", "-c", cmd).start()
                  } catch (e: Exception) {
                      return Triple(-1, "", "无法执行 su：" + (e.message ?: ""))
                  }
                  val out = StringBuilder(); val err = StringBuilder()
                  val tOut = Thread { try { proc.inputStream.bufferedReader().forEachLine { out.append(it).append('\n') } } catch (_: Exception) {} }
                  val tErr = Thread { try { proc.errorStream.bufferedReader().forEachLine { err.append(it).append('\n') } } catch (_: Exception) {} }
                  tOut.start(); tErr.start()
                  val finished = proc.waitFor(timeoutMs, TimeUnit.MILLISECONDS)
                  if (!finished) proc.destroyForcibly()
                  tOut.join(2000); tErr.join(2000)
                  return Triple(if (finished) proc.exitValue() else -1, out.toString(),
                      if (finished) err.toString() else "命令超时，请刷新确认结果")
              }

              /** 单引号包裹防注入（内部 ' → '\''） */
              fun q(path: String): String = "'" + path.replace("'", "'\\''") + "'"
          }

          /** rm -rf 禁区：这些顶层路径删除会造成系统/数据层灾难，一律拦截（其子路径不受影响） */
          private val PROTECTED_ROOTS = setOf(
              "/", "/system", "/vendor", "/product", "/system_ext", "/odm", "/oem",
              "/system_dlkm", "/vendor_dlkm", "/odm_dlkm", "/data", "/data_mirror",
              "/metadata", "/cache", "/persist", "/boot", "/dev", "/proc", "/sys",
              "/sdcard", "/storage", "/mnt", "/apex", "/linkerconfig", "/debug_ramdisk",
              "/bin", "/etc", "/sbin", "/bugreports", "/postinstall", "/second_stage_resources",
              "/init", "/acct", "/config", "/efs", "/root"
          )

          /** 归一化（去首尾斜杠）后判断是否为受保护的顶层路径；空串按 "/" 处理 */
          fun isProtectedRoot(path: String): Boolean = ("/" + path.trim().trim('/')) in PROTECTED_ROOTS

          private val LS_PERM_PATTERN = "[dlbcps-][rwxstST-]{9}[.+@]?"
          private val LS_ISO_RE = Regex("^($LS_PERM_PATTERN)\\s+\\d+\\s+\\S+\\s+\\S+\\s+(\\d+)\\s+\\d{4}-\\d{2}-\\d{2}\\s+\\d{2}:\\d{2}(?::\\d{2})?\\s+(.+)$")
          private val LS_CLASSIC_RE = Regex("^($LS_PERM_PATTERN)\\s+\\d+\\s+\\S+\\s+\\S+\\s+(\\d+)\\s+[A-Za-z]{3}\\s+\\d{1,2}\\s+(?:\\d{2}:\\d{2}|\\d{4})\\s+(.+)$")

          /** 解析 `ls -la` 行：ISO 日期 → 经典日期 → 宽松兜底；跳过 total/. /..；链接剥离 -> 目标 */
          fun parseLsLine(line: String, parent: String): RootEntry? {
              val t = line.trim()
              if (t.isEmpty() || t.startsWith("total")) return null
              val m = LS_ISO_RE.find(t) ?: LS_CLASSIC_RE.find(t)
              val perm: String; val size: Long; var name: String
              if (m != null) {
                  perm = m.groupValues[1]; size = m.groupValues[2].toLongOrNull() ?: 0L; name = m.groupValues[3]
              } else {
                  val parts = t.split(Regex("\\s+"))
                  if (parts.size < 7 || !parts[0].matches(Regex("^[dlbcps-][rwxstST-]{9}.*"))) return null
                  perm = parts[0]; size = parts[4].toLongOrNull() ?: 0L; name = parts.last()
              }
              name = name.trim().substringBefore(" -> ").trim()
              if (name.isEmpty() || name == "." || name == "..") return null
              val full = (if (parent == "/") "" else parent.trimEnd('/')) + "/" + name
              return RootEntry(name, full, perm.startsWith("d"), perm.startsWith("l"), size, perm.take(10))
          }

