          @Composable
          fun FloatingNavBar(items: List<NavEntry>, selectedIndex: Int, onSelect: (Int) -> Unit, modifier: Modifier = Modifier) {
              val minix = LocalUiStyle.current == UiStyle.MI_MINIX
              val cs = MaterialTheme.colorScheme
              // Material You：着色底栏 + 选中胶囊；小米 Minix：悬浮胶囊条 + 选中项变主题色（无胶囊底）
              val containerColor = if (minix) cs.surface else cs.surfaceContainer
              val activeBg = if (minix) Color.Transparent else cs.secondaryContainer
              val activeFg = if (minix) cs.primary else cs.onSecondaryContainer
              val inactiveFg = cs.onSurfaceVariant
              val labelActive = if (minix) cs.primary else cs.onSurface
              val labelInactive = cs.onSurfaceVariant
              val shape = if (minix) RoundedCornerShape(50) else RoundedCornerShape(28.dp)

              Surface(
                  modifier = modifier,
                  shape = shape,
                  color = containerColor,
                  tonalElevation = if (minix) 0.dp else 3.dp,
                  shadowElevation = if (minix) 6.dp else 8.dp,
                  border = if (minix) BorderStroke(1.dp, cs.outlineVariant) else null
              ) {
                  Row(Modifier.padding(horizontal = if (minix) 12.dp else 8.dp, vertical = 8.dp),
                      horizontalArrangement = Arrangement.spacedBy(if (minix) 4.dp else 2.dp),
                      verticalAlignment = Alignment.CenterVertically) {
                      items.forEachIndexed { i, it ->
                          val sel = i == selectedIndex
                          Column(
                              modifier = Modifier.clip(RoundedCornerShape(20.dp))
                                  .clickable { onSelect(i) }
                                  .padding(horizontal = if (minix) 6.dp else 4.dp, vertical = 4.dp),
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              Box(
                                  modifier = Modifier
                                      .width(if (minix) 52.dp else if (sel) 60.dp else 44.dp)
                                      .height(30.dp)
                                      .clip(RoundedCornerShape(15.dp))
                                      .background(if (sel) activeBg else Color.Transparent),
                                  contentAlignment = Alignment.Center
                              ) {
                                  Icon(it.icon, it.label,
                                      tint = if (sel) activeFg else inactiveFg,
                                      modifier = Modifier.size(if (minix && sel) 24.dp else 22.dp))
                              }
                              Spacer(Modifier.height(2.dp))
                              Text(it.label, style = MaterialTheme.typography.labelSmall,
                                  color = if (sel) labelActive else labelInactive)
                          }
                      }
                  }
              }
          }

