                              add(SheetAction(Icons.Filled.Android, "安装") { openFileWithSystem(ctx, item); vm.recordRecent(item) })
                          }
                          if (!item.isDirectory && item.kind != FileKind.APK && item.kind != FileKind.EXECUTABLE) {
