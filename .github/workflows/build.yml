          // ============================================================
          // 内置预览
          // ============================================================
          sealed interface PreviewState {
              data object Loading : PreviewState
              data class Text(val content: String) : PreviewState
              data class Image(val bitmap: Bitmap) : PreviewState
              data class Archive(val entries: List<String>) : PreviewState
              data class Unsupported(val reason: String) : PreviewState
          }

          @Composable
          fun PreviewSheet(item: FileItem, onDismiss: () -> Unit) {
              val context = LocalContext.current
              var state by remember(item.path) { mutableStateOf<PreviewState>(PreviewState.Loading) }

              LaunchedEffect(item.path) {
                  val s = withContext(Dispatchers.IO) {
                      try {
                          when (item.kind) {
                              FileKind.CODE -> {
                                  if (item.size > 2_000_000L) {
                                      PreviewState.Text("文件过大（" + humanSize(item.size) + "），不支持内联预览")
                                  } else {
                                      PreviewState.Text(item.file.readText())
                                  }
                              }
                              FileKind.IMAGE -> {
                                  val opts = BitmapFactory.Options().apply {
                                      inJustDecodeBounds = true
                                  }
                                  BitmapFactory.decodeFile(item.path, opts)
                                  var sample = 1
                                  while (opts.outWidth / sample > 2048 ||
                                         opts.outHeight / sample > 2048) {
                                      sample *= 2
                                  }
                                  val decodeOpts = BitmapFactory.Options().apply {
                                      inSampleSize = sample
                                  }
                                  val bmp = BitmapFactory.decodeFile(item.path, decodeOpts)
                                  if (bmp != null) PreviewState.Image(bmp)
                                  else PreviewState.Unsupported("无法解码图片")
                              }
                              FileKind.ARCHIVE -> {
                                  if (item.extension != "zip") {
                                      PreviewState.Unsupported("暂不支持 ." + item.extension + " 压缩包内预览")
                                  } else {
                                      val list = ArrayList<String>(64)
                                      ZipFile(item.file).use { zip ->
                                          val it = zip.entries()
                                          while (it.hasMoreElements() && list.size < 500) {
                                              list.add(it.nextElement().name)
                                          }
                                      }
                                      PreviewState.Archive(list)
                                  }
                              }
                              else -> PreviewState.Unsupported("该格式暂不支持内置预览")
                          }
                      } catch (e: Exception) {
                          PreviewState.Unsupported("读取失败：" + (e.message ?: "未知错误"))
                      }
                  }
                  state = s
              }

              val sheetState = rememberModalBottomSheetState(skipPartiallyExpanded = true)
              ModalBottomSheet(onDismissRequest = onDismiss, sheetState = sheetState,
                  containerColor = MaterialTheme.colorScheme.surfaceContainerLow) {
                  Column(Modifier.fillMaxWidth().padding(bottom = 24.dp)) {
                      Column(Modifier.padding(horizontal = 24.dp, vertical = 8.dp)) {
                          Text(item.name, style = MaterialTheme.typography.titleMedium,
                              maxLines = 2, overflow = TextOverflow.Ellipsis)
                          Spacer(Modifier.height(2.dp))
                          Text(item.subtitle, style = MaterialTheme.typography.bodyMedium,
                              color = MaterialTheme.colorScheme.onSurfaceVariant)
                      }
                      Spacer(Modifier.height(8.dp))
                      when (val s = state) {
                          PreviewState.Loading -> {
                              Box(Modifier.fillMaxWidth().height(200.dp),
                                  contentAlignment = Alignment.Center) {
                                  Text("加载中...", color = MaterialTheme.colorScheme.onSurfaceVariant)
                              }
                          }
                          is PreviewState.Text -> {
                              Column(
                                  Modifier.fillMaxWidth().height(520.dp)
                                      .verticalScroll(rememberScrollState())
                                      .padding(horizontal = 24.dp)
                              ) {
                                  Text(s.content,
                                      fontFamily = FontFamily.Monospace,
                                      fontSize = 13.sp,
                                      lineHeight = 20.sp,
                                      color = MaterialTheme.colorScheme.onSurface)
                              }
                          }
                          is PreviewState.Image -> {
                              Box(Modifier.fillMaxWidth().height(520.dp),
                                  contentAlignment = Alignment.Center) {
                                  Image(bitmap = s.bitmap.asImageBitmap(),
                                      contentDescription = item.name,
                                      modifier = Modifier.fillMaxSize(),
                                      contentScale = ContentScale.Fit)
                              }
                          }
                          is PreviewState.Archive -> {
                              Column(
                                  Modifier.fillMaxWidth().height(520.dp)
                                      .verticalScroll(rememberScrollState())
                                      .padding(horizontal = 24.dp)
                              ) {
                                  Text("共 " + s.entries.size + " 个条目",
                                      style = MaterialTheme.typography.labelMedium,
                                      color = MaterialTheme.colorScheme.primary)
                                  Spacer(Modifier.height(8.dp))
                                  s.entries.forEach { name ->
                                      Text(name,
                                          fontFamily = FontFamily.Monospace,
                                          fontSize = 12.sp,
                                          color = MaterialTheme.colorScheme.onSurface,
                                          modifier = Modifier.padding(vertical = 3.dp))
                                  }
                              }
                          }
                          is PreviewState.Unsupported -> {
                              Column(Modifier.fillMaxWidth().padding(32.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally) {
                                  Text(s.reason, color = MaterialTheme.colorScheme.onSurfaceVariant)
                                  Spacer(Modifier.height(16.dp))
                                  Surface(onClick = {
                                      openFileWithSystem(context, item)
                                      onDismiss()
                                  }, shape = RoundedCornerShape(20.dp),
                                      color = MaterialTheme.colorScheme.primary) {
                                      Text("用其他应用打开",
                                          color = MaterialTheme.colorScheme.onPrimary,
                                          style = MaterialTheme.typography.labelLarge,
                                          modifier = Modifier.padding(horizontal = 20.dp, vertical = 10.dp))
                                  }
                              }
                          }
                      }
                  }
              }
          }

          private val navItems = listOf(
              NavEntry(Icons.Filled.Folder, "文件"),
              NavEntry(Icons.Filled.Schedule, "最近"),
              NavEntry(Icons.Filled.Star, "收藏"),
              NavEntry(Icons.Filled.Settings, "设置")
          )

          private sealed interface UiSheet {
              data object NewMenu : UiSheet
              data class ItemMenu(val item: FileItem) : UiSheet
          }

          private sealed interface UiDialog {
              data object NewFolder : UiDialog
              data object NewFile : UiDialog
              data class Rename(val item: FileItem) : UiDialog
              data class Delete(val item: FileItem) : UiDialog
          }

          private fun hasPermission(): Boolean {
              return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                  Environment.isExternalStorageManager()
              } else true
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun FileManagerScreen(vm: FileManagerViewModel = viewModel()) {
              val ctx = LocalContext.current
              var granted by remember { mutableStateOf(hasPermission()) }

              val settingsLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { granted = hasPermission() }

              LaunchedEffect(Unit) { granted = hasPermission() }

              if (!granted) {
                  Column(Modifier.fillMaxSize().padding(32.dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.Center) {
                      Icon(Icons.Filled.Folder, null,
                          modifier = Modifier.size(80.dp),
                          tint = MaterialTheme.colorScheme.primary)
                      Spacer(Modifier.height(24.dp))
                      Text("需要存储访问权限", style = MaterialTheme.typography.titleLarge,
                          fontWeight = FontWeight.Medium)
                      Spacer(Modifier.height(8.dp))
                      Text("请授予「所有文件访问权限」以管理设备文件",
                          style = MaterialTheme.typography.bodyMedium,
                          color = MaterialTheme.colorScheme.onSurfaceVariant)
                      Spacer(Modifier.height(24.dp))
                      Surface(onClick = {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                              try {
                                  settingsLauncher.launch(
                                      Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION)
                                          .setData(Uri.parse("package:" + ctx.packageName))
                                  )
                              } catch (e: Exception) {
                                  settingsLauncher.launch(
                                      Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION)
                                  )
                              }
                          }
                      }, shape = RoundedCornerShape(20.dp),
                          color = MaterialTheme.colorScheme.primary) {
                          Text("去授权",
                              color = MaterialTheme.colorScheme.onPrimary,
                              style = MaterialTheme.typography.labelLarge,
                              modifier = Modifier.padding(horizontal = 24.dp, vertical = 12.dp))
                      }
                  }
                  return
              }

              val snackbar = remember { SnackbarHostState() }
              LaunchedEffect(vm.snackMessage) {
                  val msg = vm.snackMessage
                  if (msg != null) {
                      snackbar.showSnackbar(msg)
                      vm.consumeSnack()
                  }
              }

              var sheet by remember { mutableStateOf<UiSheet?>(null) }
              var dialog by remember { mutableStateOf<UiDialog?>(null) }
              var previewItem by remember { mutableStateOf<FileItem?>(null) }

              Scaffold(
                  containerColor = MaterialTheme.colorScheme.background,
                  snackbarHost = { SnackbarHost(snackbar) },
                  topBar = {
                      Surface(color = MaterialTheme.colorScheme.background) {
                          Column(Modifier.statusBarsPadding()) {
                              Row(Modifier.fillMaxWidth().height(64.dp).padding(horizontal = 4.dp),
                                  verticalAlignment = Alignment.CenterVertically) {
                                  when (vm.currentTab) {
                                      Tab.FILES -> {
                                          if (vm.searchMode) {
                                              IconButton(onClick = { vm.exitSearch() }) {
                                                  Icon(Icons.Filled.ArrowBack, "返回")
                                              }
                                              BasicTextField(
                                                  value = vm.searchQuery,
                                                  onValueChange = { vm.doSearch(it) },
                                                  modifier = Modifier.weight(1f),
                                                  textStyle = TextStyle(
                                                      color = MaterialTheme.colorScheme.onSurface,
                                                      fontSize = MaterialTheme.typography.bodyLarge.fontSize),
                                                  singleLine = true,
                                                  cursorBrush = SolidColor(MaterialTheme.colorScheme.primary),
                                                  keyboardOptions = KeyboardOptions(imeAction = ImeAction.Search),
                                                  decorationBox = { inner ->
                                                      Box {
                                                          if (vm.searchQuery.isEmpty()) Text("搜索当前目录...",
                                                              color = MaterialTheme.colorScheme.onSurfaceVariant)
                                                          inner()
                                                      }
                                                  }
                                              )
                                              IconButton(onClick = { vm.exitSearch() }) {
                                                  Icon(Icons.Filled.Close, "关闭")
                                              }
                                          } else {
                                              val canUp = vm.currentDir.parentFile != null
                                              IconButton(onClick = { vm.goUp() }, enabled = canUp) {
                                                  Icon(Icons.Filled.ArrowBack, "返回",
                                                      tint = if (canUp) MaterialTheme.colorScheme.onSurface
                                                          else MaterialTheme.colorScheme.onSurfaceVariant)
                                              }
                                              Text(vm.currentDir.name.ifEmpty { "存储" },
                                                  style = MaterialTheme.typography.titleLarge,
                                                  fontWeight = FontWeight.Medium,
                                                  maxLines = 1, overflow = TextOverflow.Ellipsis,
                                                  modifier = Modifier.weight(1f).padding(horizontal = 4.dp))
                                              IconButton(onClick = { vm.searchMode = true }) {
                                                  Icon(Icons.Filled.Search, "搜索")
                                              }
                                              IconButton(onClick = { vm.updateGrid(!vm.gridMode) }) {
                                                  Icon(if (vm.gridMode) Icons.Filled.ViewList else Icons.Filled.GridView, "切换视图")
                                              }
                                          }
                                      }
                                      else -> Text(
                                          when (vm.currentTab) {
                                              Tab.RECENT -> "最近"
                                              Tab.STARRED -> "收藏"
                                              else -> "设置"
                                          },
                                          style = MaterialTheme.typography.titleLarge,
                                          fontWeight = FontWeight.Medium,
                                          modifier = Modifier.weight(1f).padding(horizontal = 16.dp))
                                  }
                              }
                              if (vm.currentTab == Tab.FILES && !vm.searchMode) {
                                  val crumbs = remember(vm.currentDir.path) { vm.breadcrumbs() }
                                  Row(Modifier.fillMaxWidth()
                                      .horizontalScroll(rememberScrollState())
                                      .padding(horizontal = 12.dp, vertical = 4.dp),
                                      verticalAlignment = Alignment.CenterVertically) {
                                      crumbs.forEachIndexed { i, f ->
                                          val last = i == crumbs.lastIndex
                                          Surface(onClick = { vm.navigateTo(f) },
                                              shape = RoundedCornerShape(16.dp),
                                              color = if (last) MaterialTheme.colorScheme.secondaryContainer
                                                  else MaterialTheme.colorScheme.surface) {
                                              Text(if (f.name.isEmpty()) "存储" else f.name,
                                                  style = MaterialTheme.typography.labelMedium,
                                                  color = if (last) MaterialTheme.colorScheme.onSecondaryContainer
                                                      else MaterialTheme.colorScheme.onSurfaceVariant,
                                                  modifier = Modifier.padding(horizontal = 10.dp, vertical = 6.dp))
                                          }
                                          if (!last) Icon(Icons.Filled.ChevronRight, null,
                                              tint = MaterialTheme.colorScheme.outline,
                                              modifier = Modifier.size(16.dp))
                                      }
                                  }
                              }
                          }
                      }
                  },
                  floatingActionButton = {
                      if (vm.currentTab != Tab.SETTINGS) {
                          FloatingActionButton(onClick = { sheet = UiSheet.NewMenu },
                              modifier = Modifier.padding(bottom = 96.dp, end = 8.dp),
                              containerColor = MaterialTheme.colorScheme.primaryContainer,
                              contentColor = MaterialTheme.colorScheme.onPrimaryContainer,
                              shape = RoundedCornerShape(16.dp)) {
                              Icon(if (vm.clipboard != null) Icons.Filled.ContentPaste else Icons.Filled.Add, "新建")
                          }
                      }
                  }
              ) { inner ->
                  Box(Modifier.fillMaxSize().padding(inner)) {
                      if (vm.currentTab != Tab.SETTINGS) {
                          PullToRefreshBox(
                              isRefreshing = vm.isRefreshing,
                              onRefresh = { vm.pullToRefresh() },
                              modifier = Modifier.fillMaxSize()
                          ) {
                              when (vm.currentTab) {
                                  Tab.FILES -> {
                                      if (vm.items.isEmpty()) {
                                          EmptyStateList(
                                              if (vm.searchQuery.isNotBlank()) "没有匹配项" else "这个文件夹是空的",
                                              if (vm.searchQuery.isNotBlank()) "试试其他关键词" else "下拉刷新，或点击右下角 + 新建"
                                          )
                                      } else {
                                          FileList(vm.items, vm.starredPaths,
                                              onOpen = { item ->
                                                  if (item.isDirectory) vm.open(item)
                                                  else previewItem = item
                                              },
                                              onMenu = { item -> sheet = UiSheet.ItemMenu(item) },
                                              grid = vm.gridMode)
                                      }
                                  }
                                  Tab.RECENT -> {
                                      if (vm.recentItems.isEmpty()) {
                                          EmptyStateList("暂无最近文件", "打开过的文件会出现在这里")
                                      } else {
                                          FileList(vm.recentItems, vm.starredPaths,
                                              onOpen = { item ->
                                                  if (item.isDirectory) vm.open(item)
                                                  else previewItem = item
                                              },
                                              onMenu = { item -> sheet = UiSheet.ItemMenu(item) },
                                              grid = vm.gridMode)
                                      }
                                  }
                                  Tab.STARRED -> {
                                      if (vm.starredItems.isEmpty()) {
                                          EmptyStateList("暂无收藏", "在菜单中点击收藏即可加入")
                                      } else {
                                          FileList(vm.starredItems, vm.starredPaths,
                                              onOpen = { item ->
                                                  if (item.isDirectory) vm.open(item)
                                                  else previewItem = item
                                              },
                                              onMenu = { item -> sheet = UiSheet.ItemMenu(item) },
                                              grid = vm.gridMode)
                                      }
                                  }
                                  Tab.SETTINGS -> {}
                              }
                          }
                      } else {
                          SettingsScreen(vm)
                      }

                      FloatingNavBar(
                          items = navItems,
                          selectedIndex = vm.currentTab.ordinal,
                          onSelect = { vm.currentTab = Tab.values()[it] },
                          modifier = Modifier.align(Alignment.BottomCenter)
                              .navigationBarsPadding().padding(bottom = 16.dp)
                      )
                  }
              }

              // 预览
              val p = previewItem
              if (p != null) {
                  PreviewSheet(item = p, onDismiss = {
                      vm.recordRecent(p)
                      previewItem = null
                  })
              }

              when (val s = sheet) {
                  is UiSheet.ItemMenu -> {
                      val item = s.item
                      ActionSheet(
                          title = item.name,
                          subtitle = item.subtitle,
                          actions = buildList {
                              add(SheetAction(
                                  if (item.isDirectory) Icons.Filled.FolderOpen else Icons.Filled.InsertDriveFile,
                                  if (item.isDirectory) "打开" else "预览") {
                                  if (item.isDirectory) vm.open(item)
                                  else previewItem = item
                              })
                              if (!item.isDirectory) {
                                  add(SheetAction(Icons.Filled.FolderOpen, "用其他应用打开") {
                                      openFileWithSystem(ctx, item)
                                      vm.recordRecent(item)
                                  })
                              }
                              add(SheetAction(
                                  if (vm.isStarred(item.path)) Icons.Filled.Star else Icons.Filled.StarBorder,
                                  if (vm.isStarred(item.path)) "取消收藏" else "收藏") { vm.toggleStar(item) })
                              add(SheetAction(Icons.Filled.Edit, "重命名") { dialog = UiDialog.Rename(item) })
                              add(SheetAction(Icons.Filled.ContentCopy, "复制") { vm.copy(item) })
                              add(SheetAction(Icons.Filled.ContentCut, "剪切") { vm.cut(item) })
                              if (item.isDirectory) {
                                  add(SheetAction(Icons.Filled.ContentPaste, "粘贴到此处",
                                      enabled = vm.clipboard != null) { vm.pasteInto(item.file) })
                              }
                              add(SheetAction(Icons.Filled.Delete, "删除", destructive = true) {
                                  dialog = UiDialog.Delete(item)
                              })
                          },
                          onDismiss = { sheet = null }
                      )
                  }
                  UiSheet.NewMenu -> {
                      ActionSheet(
                          title = "新建",
                          actions = buildList {
                              add(SheetAction(Icons.Filled.CreateNewFolder, "新建文件夹") {
                                  dialog = UiDialog.NewFolder
                              })
                              add(SheetAction(Icons.Filled.InsertDriveFile, "新建文件") {
                                  dialog = UiDialog.NewFile
                              })
                              if (vm.clipboard != null) {
                                  add(SheetAction(Icons.Filled.ContentPaste, "粘贴到此处") { vm.pasteInto() })
                              }
                          },
                          onDismiss = { sheet = null }
                      )
                  }
                  null -> Unit
              }

              when (val d = dialog) {
                  UiDialog.NewFolder -> TextInputDialog(
                      title = "新建文件夹", initial = "新建文件夹",
                      onConfirm = { vm.createFolder(it) }, onDismiss = { dialog = null }
                  )
                  UiDialog.NewFile -> TextInputDialog(
                      title = "新建文件", initial = "新建文件.txt",
                      onConfirm = { vm.createFile(it) }, onDismiss = { dialog = null }
                  )
                  is UiDialog.Rename -> TextInputDialog(
                      title = "重命名", initial = d.item.name,
                      onConfirm = { vm.rename(d.item, it) }, onDismiss = { dialog = null }
                  )
                  is UiDialog.Delete -> ConfirmDialog(
                      title = "删除「" + d.item.name + "」？",
                      message = if (d.item.isDirectory)
                          "该文件夹及其中所有内容都将被删除，此操作不可撤销。"
                      else "此操作不可撤销。",
                      confirmText = "删除", destructive = true,
                      onConfirm = { vm.delete(d.item) }, onDismiss = { dialog = null }
                  )
                  null -> Unit
              }
          }

          @Composable
          fun EmptyStateList(title: String, subtitle: String) {
              LazyColumn(Modifier.fillMaxSize()) {
                  item {
                      Column(
                          Modifier.fillParentMaxSize().padding(bottom = 120.dp),
                          horizontalAlignment = Alignment.CenterHorizontally,
                          verticalArrangement = Arrangement.Center
                      ) {
                          Icon(Icons.Filled.Folder, null,
                              modifier = Modifier.size(64.dp),
                              tint = MaterialTheme.colorScheme.outlineVariant)
                          Spacer(Modifier.height(16.dp))
                          Text(title, style = MaterialTheme.typography.titleMedium)
                          Spacer(Modifier.height(4.dp))
                          Text(subtitle, style = MaterialTheme.typography.bodyMedium,
                              color = MaterialTheme.colorScheme.onSurfaceVariant)
                      }
                  }
              }
          }

          @Composable
          fun SettingsScreen(vm: FileManagerViewModel) {
              Column(Modifier.fillMaxSize().padding(horizontal = 16.dp).padding(bottom = 120.dp)) {
                  Spacer(Modifier.height(8.dp))
                  Text("浏览", style = MaterialTheme.typography.labelMedium,
                      color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.SemiBold,
                      modifier = Modifier.padding(vertical = 8.dp))
                  Row(Modifier.fillMaxWidth().padding(vertical = 12.dp),
                      verticalAlignment = Alignment.CenterVertically) {
                      Column(Modifier.weight(1f)) {
                          Text("显示隐藏文件", style = MaterialTheme.typography.bodyLarge)
                          Text("以 . 开头的文件与文件夹",
                              style = MaterialTheme.typography.labelMedium,
                              color = MaterialTheme.colorScheme.onSurfaceVariant)
                      }
                      Switch(checked = vm.showHidden, onCheckedChange = vm::updateShowHidden)
                  }
                  Spacer(Modifier.height(12.dp))
                  Text("默认视图", style = MaterialTheme.typography.bodyLarge)
                  Spacer(Modifier.height(8.dp))
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      listOf("列表" to false, "网格" to true).forEach { pair ->
                          val label = pair.first
                          val v = pair.second
                          Surface(onClick = { vm.updateGrid(v) },
                              shape = RoundedCornerShape(20.dp),
                              color = if (vm.gridMode == v) MaterialTheme.colorScheme.secondaryContainer
                                  else MaterialTheme.colorScheme.surface,
                              border = androidx.compose.foundation.BorderStroke(1.dp,
                                  if (vm.gridMode == v) MaterialTheme.colorScheme.secondaryContainer
                                  else MaterialTheme.colorScheme.outline)) {
                              Text(label, style = MaterialTheme.typography.labelMedium,
                                  color = if (vm.gridMode == v) MaterialTheme.colorScheme.onSecondaryContainer
                                      else MaterialTheme.colorScheme.onSurface,
                                  modifier = Modifier.padding(horizontal = 16.dp, vertical = 8.dp))
                          }
                      }
                  }
                  Spacer(Modifier.height(20.dp))
                  Text("排序方式", style = MaterialTheme.typography.bodyLarge)
                  Spacer(Modifier.height(8.dp))
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      listOf("名称" to SortKey.NAME, "大小" to SortKey.SIZE, "时间" to SortKey.MTIME).forEach { pair ->
                          val label = pair.first
                          val v = pair.second
                          Surface(onClick = { vm.updateSort(v) },
                              shape = RoundedCornerShape(20.dp),
                              color = if (vm.sortKey == v) MaterialTheme.colorScheme.secondaryContainer
                                  else MaterialTheme.colorScheme.surface,
                              border = androidx.compose.foundation.BorderStroke(1.dp,
                                  if (vm.sortKey == v) MaterialTheme.colorScheme.secondaryContainer
                                  else MaterialTheme.colorScheme.outline)) {
                              Text(label, style = MaterialTheme.typography.labelMedium,
                                  color = if (vm.sortKey == v) MaterialTheme.colorScheme.onSecondaryContainer
                                      else MaterialTheme.colorScheme.onSurface,
                                  modifier = Modifier.padding(horizontal = 16.dp, vertical = 8.dp))
                          }
                      }
                  }
                  Spacer(Modifier.height(32.dp))
                  Text("Files - MD3 v2.0 - 内置预览 + Release 优化",
                      style = MaterialTheme.typography.labelSmall,
                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                      modifier = Modifier.fillMaxWidth())
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  setContent {
                      MD3Theme {
                          FileManagerScreen()
                      }
                  }
              }
          }
          KOTLIN_EOF

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
