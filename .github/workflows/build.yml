name: Build APK
# — 优化版说明（相对原版）—
# 1. 固定签名 keystore：所有构建使用同一签名，APK 可直接覆盖安装升级
# 2. versionCode 自动跟随 CI 构建号递增（FM_VERSION_CODE，见下方 env）
# 3. 移除 13 处 heredoc 之后无效的 `| sed` 管道（空跑进程）
# 4. Kotlin：NIO 单次 stat / 扫描跳过 Android/data|obb / 目录刷新逻辑去重
# 5. R8 不再全量保留 Compose 符号（减小 APK）；upload-artifact v7 直传 APK 免解压
# 6. 修复原版 MainActivity.kt 缺失的一个右花括号（语法错误 → 构建必然失败）

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FM_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

