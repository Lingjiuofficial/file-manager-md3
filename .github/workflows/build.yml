          // ============================================================
          // 存储分析（目录占用排行 · 遍历统计 · 可取消）
          // ============================================================

          private data class StorageEntry(val name: String, val path: String, val isDirectory: Boolean, val size: Long)

          /** 符号链接判定（遍历跳过用：防目录环 + 对齐 du/统计语义） */
          private fun isSymlinkSafe(f: File): Boolean = try { Files.isSymbolicLink(f.toPath()) } catch (_: Exception) { false }

          /** 统计目录总大小（文件字节和）。不跟符号链接；每 4096 文件回报并可取消；50 万文件 + 20 万目录双封顶防失控 */
          private suspend fun dirTotalSize(dir: File, onCount: (Int) -> Unit): Long {
              var total = 0L; var count = 0; var dirs = 0
              val stack = ArrayDeque<File>()
              stack.addLast(dir)
              while (stack.isNotEmpty()) {
                  yield()
                  if (++dirs > 200_000) return total
                  val d = stack.removeLast()
                  val fs = d.listFiles() ?: continue
                  for (f in fs) {
                      if (f.isDirectory) { if (!isSymlinkSafe(f)) stack.addLast(f) }
                      else {
                          total += f.length(); count++
                          if (count >= 500_000) return total
                          if (count % 4096 == 0) { onCount(count); yield() }
                      }
                  }
              }
              return total
          }

          @Composable
          fun StorageAnalysisScreen(onDismiss: () -> Unit) {
              var path by remember { mutableStateOf(Environment.getExternalStorageDirectory().absolutePath) }
              var entries by remember { mutableStateOf<List<StorageEntry>>(emptyList()) }
              var loading by remember { mutableStateOf(true) }
              var scanned by remember { mutableIntStateOf(0) }
              var errorMsg by remember { mutableStateOf<String?>(null) }
              var reloadKey by remember { mutableIntStateOf(0) }

              LaunchedEffect(path, reloadKey) {
                  loading = true; errorMsg = null; scanned = 0
                  val res = try {
                      withContext(Dispatchers.IO) {
                          val dir = File(path)
                          if (!dir.isDirectory) return@withContext emptyList<StorageEntry>() to "无法读取该目录"
                          val children = dir.listFiles() ?: return@withContext emptyList<StorageEntry>() to "无法列出目录内容"
                          val list = ArrayList<StorageEntry>(children.size)
                          for (f in children) {
                              val size = if (f.isDirectory) dirTotalSize(f) { n -> scanned = n } else f.length()
                              list.add(StorageEntry(f.name, f.absolutePath, f.isDirectory, size))
                          }
                          list.sortByDescending { it.size }
                          list to null
                      }
                  } catch (e: Exception) {
                      if (e is kotlinx.coroutines.CancellationException) throw e
                      emptyList<StorageEntry>() to ("分析失败：" + (e.message ?: ""))
                  }
                  entries = res.first; errorMsg = res.second; loading = false
              }

              BackHandler {
                  val parent = File(path).parentFile
                  if (parent != null && path.length > 1) path = parent.absolutePath else onDismiss()
              }

              val totalSize = remember(entries) { entries.sumOf { it.size } }
              val maxSize = remember(entries) { (entries.maxOfOrNull { it.size } ?: 1L).coerceAtLeast(1L) }

              Column(Modifier.fillMaxSize()) {
                  Surface(color = MaterialTheme.colorScheme.surfaceContainer) {
                      Row(Modifier.fillMaxWidth().statusBarsPadding().height(64.dp).padding(horizontal = 4.dp),
                          verticalAlignment = Alignment.CenterVertically) {
                          IconButton(onClick = onDismiss) { Icon(Icons.Filled.ArrowBack, "返回") }
                          Column(Modifier.weight(1f).padding(horizontal = 4.dp)) {
                              Text("存储分析", style = MaterialTheme.typography.titleLarge,
                                  maxLines = 1, overflow = TextOverflow.Ellipsis)
                              Text(path, style = MaterialTheme.typography.labelSmall,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  maxLines = 1, overflow = TextOverflow.Ellipsis)
                          }
                          IconButton(onClick = { reloadKey++ }, enabled = !loading) {
                              Icon(Icons.Filled.Refresh, "刷新")
                          }
                      }
                  }
                  when {
                      loading -> Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              CircularProgressIndicator(modifier = Modifier.size(28.dp), strokeWidth = 3.dp)
                              Spacer(Modifier.height(12.dp))
                              Text(if (scanned > 0) "正在分析… 已扫描 " + scanned + " 个文件" else "正在分析…",
                                  style = MaterialTheme.typography.bodyMedium,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant)
                              Spacer(Modifier.height(4.dp))
                              Text("大目录可能需要一些时间；返回即可取消",
                                  style = MaterialTheme.typography.labelSmall,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant)
                          }
                      }
                      errorMsg != null -> Box(Modifier.fillMaxSize().padding(32.dp), contentAlignment = Alignment.Center) {
                          Text(errorMsg ?: "", style = MaterialTheme.typography.bodyMedium,
                              color = MaterialTheme.colorScheme.error, textAlign = TextAlign.Center)
                      }
                      entries.isEmpty() -> Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Text("空目录", color = MaterialTheme.colorScheme.onSurfaceVariant)
                      }
                      else -> LazyColumn(Modifier.fillMaxSize(), contentPadding = PaddingValues(top = 2.dp, bottom = 24.dp)) {
                          item {
                              Text("共 " + entries.size + " 项 · " + humanSize(totalSize),
                                  style = MaterialTheme.typography.labelMedium,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  modifier = Modifier.padding(horizontal = 20.dp, vertical = 8.dp))
                          }
                          items(count = entries.size, key = { entries[it].path }) { idx ->
                              val e = entries[idx]
                              Row(
                                  modifier = Modifier.fillMaxWidth()
                                      .clickable(enabled = e.isDirectory) { path = e.path }
                                      .padding(horizontal = 20.dp, vertical = 10.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Icon(if (e.isDirectory) Icons.Filled.Folder else Icons.Filled.InsertDriveFile, null,
                                      modifier = Modifier.size(22.dp),
                                      tint = MaterialTheme.colorScheme.onSurfaceVariant)
                                  Spacer(Modifier.width(12.dp))
                                  Column(Modifier.weight(1f)) {
                                      Text(e.name, maxLines = 1, overflow = TextOverflow.Ellipsis,
                                          style = MaterialTheme.typography.bodyMedium)
                                      Spacer(Modifier.height(4.dp))
                                      Box(Modifier.fillMaxWidth().height(5.dp).clip(RoundedCornerShape(3.dp))
                                          .background(MaterialTheme.colorScheme.surfaceVariant)) {
                                          Box(Modifier.fillMaxWidth(e.size.toFloat() / maxSize)
                                              .height(5.dp).background(MaterialTheme.colorScheme.primary))
                                      }
                                  }
                                  Spacer(Modifier.width(12.dp))
                                  Text(humanSize(e.size), style = MaterialTheme.typography.labelMedium,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant)
                                  if (e.isDirectory) {
                                      Icon(Icons.Filled.ChevronRight, null,
                                          tint = MaterialTheme.colorScheme.outline, modifier = Modifier.size(20.dp))
                                  }
                              }
                          }
                      }
                  }
              }
          }

