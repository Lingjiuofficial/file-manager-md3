          @Composable
          fun RootBrowserScreen(onDismiss: () -> Unit) {
              val scope = rememberCoroutineScope()
              var rootOk by remember { mutableStateOf<Boolean?>(null) }
              var checkKey by remember { mutableIntStateOf(0) }
              var path by remember { mutableStateOf("/") }
              var entries by remember { mutableStateOf<List<RootEntry>>(emptyList()) }
              var loading by remember { mutableStateOf(false) }
              var errorMsg by remember { mutableStateOf<String?>(null) }
              var reloadKey by remember { mutableIntStateOf(0) }
              var menuTarget by remember { mutableStateOf<RootEntry?>(null) }
              var renameTarget by remember { mutableStateOf<RootEntry?>(null) }
              var deleteTarget by remember { mutableStateOf<RootEntry?>(null) }
              var showMkdir by remember { mutableStateOf(false) }
              var status by remember { mutableStateOf<String?>(null) }
              var textTarget by remember { mutableStateOf<RootEntry?>(null) }

              fun childPath(child: String) = (if (path == "/") "" else path.trimEnd('/')) + "/" + child
              fun parentPath() = path.trimEnd('/').substringBeforeLast('/', "").ifEmpty { "/" }

              LaunchedEffect(checkKey) {
                  if (rootOk == null) rootOk = withContext(Dispatchers.IO) { RootShell.available() }
              }
              LaunchedEffect(path, reloadKey, rootOk) {
                  if (rootOk != true) return@LaunchedEffect
                  loading = true; errorMsg = null
                  val res = withContext(Dispatchers.IO) {
                      val (code, out, err) = RootShell.run("ls -la " + RootShell.q(path))
                      if (code != 0) Pair<List<RootEntry>, String?>(emptyList(), err.trim().ifBlank { "无法列出该目录" })
                      else Pair(out.lineSequence().mapNotNull { parseLsLine(it, path) }.toList(), null)
                  }
                  entries = res.first; errorMsg = res.second; loading = false
              }
              LaunchedEffect(status) {
                  if (status != null) { delay(2500); status = null }
              }

              fun runOp(okMsg: String, cmd: String, timeoutMs: Long = RootShell.TIMEOUT_MS) {
                  scope.launch {
                      loading = true
                      val msg = withContext(Dispatchers.IO) {
                          val (c, _, err) = RootShell.run(cmd, timeoutMs)
                          if (c == 0) okMsg else err.trim().ifBlank { okMsg + "失败" }
                      }
                      loading = false; status = msg; reloadKey++
                  }
              }

              /** 原子守护执行：目标已存在（含断链）→ existMsg；动作成功 → okMsg */
              fun runGuarded(okMsg: String, existMsg: String, dstPath: String, action: String) {
                  scope.launch {
                      loading = true
                      val msg = withContext(Dispatchers.IO) {
                          val qd = RootShell.q(dstPath)
                          val (_, out, err) = RootShell.run(
                              "if [ -e $qd ] || [ -L $qd ]; then echo __EXIST__; else $action && echo __OK__; fi",
                              RootShell.TIMEOUT_WRITE_MS)
                          when {
                              out.contains("__OK__") -> okMsg
                              out.contains("__EXIST__") -> existMsg
                              else -> err.trim().ifBlank { "操作失败" }
                          }
                      }
                      loading = false; status = msg; reloadKey++
                  }
              }

              fun exportEntry(e: RootEntry) {
                  scope.launch {
                      loading = true
                      val msg = withContext(Dispatchers.IO) {
                          val dir = "/sdcard/Download"
                          RootShell.run("mkdir -p " + RootShell.q(dir))
                          var target: String? = null
                          var i = 0
                          while (i <= 20) {
                              val cand = if (i == 0) dir + "/" + e.name
                              else {
                                  val dot = e.name.lastIndexOf('.')
                                  if (dot > 0) dir + "/" + e.name.substring(0, dot) + " (" + i + ")" + e.name.substring(dot)
                                  else dir + "/" + e.name + " (" + i + ")"
                              }
                              val (c, out, _) = RootShell.run("if [ -e " + RootShell.q(cand) + " ] || [ -L " + RootShell.q(cand) + " ]; then echo Y; else echo N; fi")
                              if (c != 0) break                              // su 异常：放弃
                              if (out.trim() == "N") { target = cand; break } // 找到空闲名
                              i++
                          }
                          val t = target
                          if (t == null) "导出失败：无法获取目标路径"
                          else {
                              val qt = RootShell.q(t)
                              val (_, out2, err2) = RootShell.run(
                                  "if [ -e $qt ] || [ -L $qt ]; then echo __EXIST__; else cp " + RootShell.q(e.path) + " $qt && echo __OK__; fi",
                                  RootShell.TIMEOUT_LONG_MS)
                              when {
                                  out2.contains("__OK__") -> "已导出到 Download/" + t.substringAfterLast('/')
                                  out2.contains("__EXIST__") -> "目标已存在，请重试"
                                  else -> err2.trim().ifBlank { "导出失败" }
                              }
                          }
                      }
                      loading = false
                      status = msg
                  }
              }

              BackHandler { if (path == "/") onDismiss() else path = parentPath() }

              Box(Modifier.fillMaxSize()) {
                  Column(Modifier.fillMaxSize()) {
                      Surface(color = MaterialTheme.colorScheme.surfaceContainer) {
                          Row(Modifier.fillMaxWidth().statusBarsPadding().height(64.dp).padding(horizontal = 4.dp),
                              verticalAlignment = Alignment.CenterVertically) {
                              IconButton(onClick = onDismiss) { Icon(Icons.Filled.ArrowBack, "返回") }
                              Column(Modifier.weight(1f).padding(horizontal = 4.dp)) {
                                  Text("Root 文件管理", style = MaterialTheme.typography.titleLarge,
                                      maxLines = 1, overflow = TextOverflow.Ellipsis)
                                  Text(path, style = MaterialTheme.typography.labelSmall,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                                      maxLines = 1, overflow = TextOverflow.Ellipsis)
                              }
                              IconButton(onClick = { if (path != "/") path = parentPath() }, enabled = path != "/") {
                                  Icon(Icons.Filled.ArrowUpward, "上级")
                              }
                              IconButton(onClick = { reloadKey++ }, enabled = rootOk == true && !loading) {
                                  Icon(Icons.Filled.Refresh, "刷新")
                              }
                              IconButton(onClick = { showMkdir = true }, enabled = rootOk == true) {
                                  Icon(Icons.Filled.CreateNewFolder, "新建文件夹")
                              }
                          }
                      }

                      when (rootOk) {
                          null -> Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                  CircularProgressIndicator(modifier = Modifier.size(28.dp), strokeWidth = 3.dp)
                                  Spacer(Modifier.height(12.dp))
                                  Text("正在请求 Root 权限…", style = MaterialTheme.typography.bodyMedium,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant)
                                  Spacer(Modifier.height(4.dp))
                                  Text("首次使用需在 KernelSU / Magisk 管理器中允许本应用",
                                      style = MaterialTheme.typography.labelSmall,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant)
                              }
                          }
                          false -> Box(Modifier.fillMaxSize().padding(32.dp), contentAlignment = Alignment.Center) {
                              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                  Icon(Icons.Filled.AdminPanelSettings, null, modifier = Modifier.size(56.dp),
                                      tint = MaterialTheme.colorScheme.outlineVariant)
                                  Spacer(Modifier.height(12.dp))
                                  Text("未获得 Root 权限", style = MaterialTheme.typography.titleMedium)
                                  Spacer(Modifier.height(4.dp))
                                  Text("请在 KernelSU / Magisk 管理器中授权本应用，然后重试",
                                      style = MaterialTheme.typography.bodyMedium,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant, textAlign = TextAlign.Center)
                                  Spacer(Modifier.height(16.dp))
                                  Box(
                                      modifier = Modifier
                                          .clip(RoundedCornerShape(20.dp))
                                          .background(MaterialTheme.colorScheme.primary)
                                          .clickable { rootOk = null; checkKey++ }
                                  ) {
                                      Text("重试", color = MaterialTheme.colorScheme.onPrimary,
                                          style = MaterialTheme.typography.labelLarge,
                                          modifier = Modifier.padding(horizontal = 24.dp, vertical = 10.dp))
                                  }
                              }
                          }
                          else -> when {
                              errorMsg != null -> Box(Modifier.fillMaxSize().padding(32.dp), contentAlignment = Alignment.Center) {
                                  Text(errorMsg ?: "", style = MaterialTheme.typography.bodyMedium,
                                      color = MaterialTheme.colorScheme.error, textAlign = TextAlign.Center)
                              }
                              entries.isEmpty() && loading -> Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                  Text("读取中…", color = MaterialTheme.colorScheme.onSurfaceVariant)
                              }
                              entries.isEmpty() -> Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                  Text("空目录", color = MaterialTheme.colorScheme.onSurfaceVariant)
                              }
                              else -> LazyColumn(Modifier.fillMaxSize(), contentPadding = PaddingValues(top = 2.dp, bottom = 24.dp)) {
                                  items(count = entries.size, key = { entries[it].path }) { idx ->
                                      val e = entries[idx]
                                      Row(
                                          modifier = Modifier.fillMaxWidth()
                                              .clickable(enabled = !loading) { if (e.isDirectory) path = childPath(e.name) else menuTarget = e }
                                              .padding(horizontal = 20.dp, vertical = 10.dp),
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Icon(
                                              if (e.isDirectory) Icons.Filled.Folder else Icons.Filled.InsertDriveFile, null,
                                              modifier = Modifier.size(22.dp),
                                              tint = if (e.isLink) MaterialTheme.colorScheme.tertiary
                                                  else MaterialTheme.colorScheme.onSurfaceVariant
                                          )
                                          Spacer(Modifier.width(12.dp))
                                          Column(Modifier.weight(1f)) {
                                              Text(e.name, maxLines = 1, overflow = TextOverflow.Ellipsis,
                                                  style = MaterialTheme.typography.bodyMedium)
                                              Text(e.perm + (if (e.isDirectory) " · 目录" else " · " + humanSize(e.size)),
                                                  style = MaterialTheme.typography.labelSmall,
                                                  color = MaterialTheme.colorScheme.onSurfaceVariant)
                                          }
                                          if (e.isDirectory) {
                                              Icon(Icons.Filled.ChevronRight, null,
                                                  tint = MaterialTheme.colorScheme.outline, modifier = Modifier.size(20.dp))
                                          } else {
                                              IconButton(onClick = { menuTarget = e }, enabled = !loading) {
                                                  Icon(Icons.Filled.MoreVert, "更多",
                                                      tint = MaterialTheme.colorScheme.onSurfaceVariant)
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
                  val st = status
                  if (st != null) {
                      Surface(
                          modifier = Modifier.align(Alignment.BottomCenter).padding(bottom = 32.dp),
                          shape = RoundedCornerShape(16.dp),
                          color = MaterialTheme.colorScheme.inverseSurface,
                          shadowElevation = 6.dp
                      ) {
                          Text(st, color = MaterialTheme.colorScheme.inverseOnSurface,
                              style = MaterialTheme.typography.bodyMedium,
                              modifier = Modifier.padding(horizontal = 20.dp, vertical = 12.dp))
                      }
                  }
              }

              val mt = menuTarget
              if (mt != null) {
                  ActionSheet(
                      title = mt.name,
                      subtitle = mt.perm + " · " + (if (mt.isDirectory) "目录" else humanSize(mt.size)) + (if (mt.isLink) " · 链接" else ""),
                      actions = buildList {
                          if (!mt.isDirectory) {
                              add(SheetAction(Icons.Filled.Description, "查看文本") { textTarget = mt })
                              add(SheetAction(Icons.Filled.Save, "导出到 Download") { exportEntry(mt) })
                          }
                          add(SheetAction(Icons.Filled.Edit, "重命名") { renameTarget = mt })
                          add(SheetAction(Icons.Filled.Delete, "删除", destructive = true) {
                              if (isProtectedRoot(mt.path)) status = "系统关键路径，已阻止删除：" + mt.path
                              else deleteTarget = mt
                          })
                      },
                      onDismiss = { menuTarget = null }
                  )
              }
              val rt = renameTarget
              if (rt != null) {
                  TextInputDialog(title = "重命名", initial = rt.name, label = "新名称",
                      onConfirm = { nn ->
                          when {
                              nn.isBlank() || nn == "." || nn == ".." || nn.contains('/') ->
                                  status = "名称无效（不能为空、不能含 / 、不能是 . 或 ..）"
                              nn != rt.name -> {
                                  val dst = rt.path.substringBeforeLast('/', "") + "/" + nn
                                  runGuarded("已重命名", "目标已存在：" + nn, dst,
                                      "mv " + RootShell.q(rt.path) + " " + RootShell.q(dst))
                              }
                          }
                      },
                      onDismiss = { renameTarget = null })
              }
              val dt = deleteTarget
              if (dt != null) {
                  ConfirmDialog(title = "删除「" + dt.name + "」？",
                      message = "路径：" + dt.path + "\n" +
                          (if (dt.isDirectory) "该目录（含全部内容）将被递归删除，此操作不可撤销。" else "此操作不可撤销。"),
                      confirmText = "删除", destructive = true,
                      onConfirm = { runOp("已删除", "rm -rf " + RootShell.q(dt.path), RootShell.TIMEOUT_LONG_MS) },
                      onDismiss = { deleteTarget = null })
              }
              if (showMkdir) {
                  TextInputDialog(title = "新建文件夹", initial = "新建文件夹", label = "文件夹名",
                      onConfirm = { nn ->
                          when {
                              nn.isBlank() || nn == "." || nn == ".." || nn.contains('/') ->
                                  status = "名称无效（不能为空、不能含 / 、不能是 . 或 ..）"
                              else -> runOp("已创建文件夹", "mkdir " + RootShell.q(childPath(nn)), RootShell.TIMEOUT_WRITE_MS)
                          }
                      },
                      onDismiss = { showMkdir = false })
              }
              val tt = textTarget
              if (tt != null) {
                  RootTextViewOverlay(entry = tt, onDismiss = { textTarget = null })
              }
          }

          /** Root 文本查看层：head -c 截断读取 + 按行虚拟化渲染 */
          @Composable
          fun RootTextViewOverlay(entry: RootEntry, onDismiss: () -> Unit) {
              var content by remember(entry.path) { mutableStateOf<String?>(null) }
              var errorMsg by remember(entry.path) { mutableStateOf<String?>(null) }
              var truncated by remember(entry.path) { mutableStateOf(false) }

              LaunchedEffect(entry.path) {
                  val res = withContext(Dispatchers.IO) {
                      val (code, out, err) = RootShell.run("head -c 524288 " + RootShell.q(entry.path))
                      Triple(if (code == 0) out else "", if (code == 0) null else err.trim().ifBlank { "读取失败" },
                          out.length >= 524288)
                  }
                  content = res.first; errorMsg = res.second; truncated = res.third
              }

              BackHandler { onDismiss() }

              Surface(Modifier.fillMaxSize().consumeAllPointerInput(), color = MaterialTheme.colorScheme.background) {
                  Column(Modifier.fillMaxSize()) {
                      Surface(color = MaterialTheme.colorScheme.surfaceContainer) {
                          Row(Modifier.fillMaxWidth().statusBarsPadding().height(64.dp).padding(horizontal = 4.dp),
                              verticalAlignment = Alignment.CenterVertically) {
                              IconButton(onClick = onDismiss) { Icon(Icons.Filled.ArrowBack, "返回") }
                              Column(Modifier.weight(1f).padding(horizontal = 4.dp)) {
                                  Text(entry.name, style = MaterialTheme.typography.titleLarge,
                                      maxLines = 1, overflow = TextOverflow.Ellipsis)
                                  Text(if (truncated) "已截断 · 仅显示前 512 KB" else humanSize(entry.size),
                                      style = MaterialTheme.typography.labelSmall,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant)
                              }
                          }
                      }
                      val c = content
                      when {
                          errorMsg != null -> Box(Modifier.fillMaxSize().padding(24.dp), contentAlignment = Alignment.Center) {
                              Text(errorMsg ?: "", color = MaterialTheme.colorScheme.error,
                                  style = MaterialTheme.typography.bodyMedium, textAlign = TextAlign.Center)
                          }
                          c == null -> Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                              Text("读取中…", color = MaterialTheme.colorScheme.onSurfaceVariant)
                          }
                          else -> {
                              val lines = remember(c) { c.lines() }
                              LazyColumn(Modifier.fillMaxSize(),
                                  contentPadding = PaddingValues(horizontal = 14.dp, vertical = 10.dp)) {
                                  items(count = lines.size) { i ->
                                      Text(lines[i], fontFamily = FontFamily.Monospace, fontSize = 12.sp,
                                          lineHeight = 16.sp, color = MaterialTheme.colorScheme.onSurface)
                                  }
                              }
                          }
                      }
                  }
              }
          }

          // ============================================================
          // FTP 客户端（commons-net · 被动模式 · UTF-8 / GBK）
          // ============================================================
          data class FtpProfile(
              val name: String, val host: String, val port: Int,
              val user: String, val pass: String, val encoding: String,
              val secure: Boolean = false
          )

          private fun loadFtpProfiles(prefs: android.content.SharedPreferences): List<FtpProfile> {
              val raw: String = prefs.getString("ftpProfiles", null) ?: return emptyList()
              return try {
                  val arr = JSONArray(raw)
                  (0 until arr.length()).map { i ->
                      val o = arr.getJSONObject(i)
                      FtpProfile(o.optString("name"), o.optString("host"), o.optInt("port", 21),
                          o.optString("user"), o.optString("pass"), o.optString("encoding", "UTF-8"),
                          o.optBoolean("secure", false))
                  }
              } catch (_: Exception) { emptyList() }
          }

          private fun saveFtpProfiles(prefs: android.content.SharedPreferences, list: List<FtpProfile>) {
              val arr = JSONArray()
              list.forEach { p ->
                  arr.put(JSONObject().apply {
                      put("name", p.name); put("host", p.host); put("port", p.port)
                      put("user", p.user); put("pass", p.pass); put("encoding", p.encoding)
                      put("secure", p.secure)
                  })
              }
              prefs.edit().putString("ftpProfiles", arr.toString()).apply()
          }

          /** 传输进度回调：仅百分比变化时上报（≤101 次），未知流大小时用期望值兜底 */
          private fun progressListener(expected: Long, onPct: (Int) -> Unit): CopyStreamListener {
              var last = -1
              return object : CopyStreamListener {
                  override fun bytesTransferred(event: CopyStreamEvent) {
                      bytesTransferred(event.totalBytesTransferred, event.bytesTransferred, event.streamSize)
                  }
                  override fun bytesTransferred(totalBytesTransferred: Long, bytesTransferred: Int, streamSize: Long) {
                      val base = if (streamSize > 0) streamSize else expected
                      if (base <= 0) return
                      val pct = (totalBytesTransferred * 100 / base).toInt().coerceIn(0, 100)
                      if (pct != last) { last = pct; onPct(pct) }
                  }
              }
          }

          @Composable
