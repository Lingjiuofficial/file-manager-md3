                  title = { Text(title) },
                  text = { Text(message) },
                  confirmButton = { TextButton(onClick = { onConfirm(); onDismiss() }) {
                      Text(confirmText, color = if (destructive) MaterialTheme.colorScheme.error else MaterialTheme.colorScheme.primary) } },
                  dismissButton = { TextButton(onClick = onDismiss) { Text("取消") } }
              )
          }

          /** 常用目录（仅列出真实存在的） */
          private fun commonDirs(): List<Pair<String, File>> {
              val ext = Environment.getExternalStorageDirectory()
              return listOf(
                  "内部存储" to ext,
                  "下载" to Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS),
                  "文档" to Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOCUMENTS),
                  "相机" to Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DCIM),
                  "图片" to Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_PICTURES),
                  "音乐" to Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MUSIC),
                  "视频" to Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MOVIES),
                  "Android/data" to File(ext, "Android/data"),
                  "Android/obb" to File(ext, "Android/obb")
              ).filter { it.second.isDirectory }
          }

          /** 文本读取：自动识别 UTF-8（含 BOM）/ GBK，返回 内容（失败为 null）to 编码标记 to 错误 */
          private fun decodeTextSmart(f: File): Triple<String?, String, String?> {
              return try {
                  val bytes = f.readBytes()
                  if (bytes.size >= 3 && bytes[0] == 0xEF.toByte() && bytes[1] == 0xBB.toByte() && bytes[2] == 0xBF.toByte()) {
                      Triple(String(bytes, 3, bytes.size - 3, Charsets.UTF_8), "UTF-8-BOM", null)
                  } else {
                      val utf8 = String(bytes, Charsets.UTF_8)
                      if (utf8.indexOf('\uFFFD') < 0) Triple(utf8, "UTF-8", null)
                      else {
                          val gbk = try { String(bytes, charset("GBK")) } catch (_: Exception) { null }
                          if (gbk != null && gbk.indexOf('\uFFFD') < 0) Triple(gbk, "GBK", null)
                          else Triple(utf8, "UTF-8", null)
                      }
                  }
              } catch (e: Exception) { Triple(null, "UTF-8", "读取失败：" + (e.message ?: "")) }
          }

          @Composable
          fun JumpDialog(vm: FileManagerViewModel, onDismiss: () -> Unit) {
              var path by remember { mutableStateOf(vm.currentDir.absolutePath) }
              val places = remember { commonDirs() }
              val doJump: (File) -> Unit = { f -> if (vm.navigateTo(f)) onDismiss() }
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text("跳转到目录") },
                  text = {
                      Column(Modifier.verticalScroll(rememberScrollState())) {
                          places.forEach { pair ->
                              Row(
                                  modifier = Modifier.fillMaxWidth()
                                      .clip(RoundedCornerShape(12.dp))
                                      .clickable { doJump(pair.second) }
                                      .padding(horizontal = 10.dp, vertical = 8.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Icon(Icons.Filled.Folder, null, modifier = Modifier.size(18.dp),
                                      tint = MaterialTheme.colorScheme.primary)
                                  Spacer(Modifier.width(10.dp))
                                  Column(Modifier.weight(1f)) {
                                      Text(pair.first, style = MaterialTheme.typography.bodyMedium)
                                      Text(pair.second.absolutePath, style = MaterialTheme.typography.labelSmall,
                                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                                          maxLines = 1, overflow = TextOverflow.Ellipsis)
                                  }
                              }
                          }
                          Spacer(Modifier.height(8.dp))
                          OutlinedTextField(value = path, onValueChange = { path = it },
                              label = { Text("或输入绝对路径") }, singleLine = true,
                              modifier = Modifier.fillMaxWidth(),
                              keyboardOptions = KeyboardOptions(imeAction = ImeAction.Go),
                              keyboardActions = KeyboardActions(onGo = { doJump(File(path.trim())) }))
                      }
                  },
                  confirmButton = { TextButton(onClick = { doJump(File(path.trim())) }) { Text("跳转") } },
                  dismissButton = { TextButton(onClick = onDismiss) { Text("取消") } }
              )
          }

          // ============================================================
          // 全屏预览容器
          // ============================================================
          /** 叠加页面层触摸拦截：命中本层后，事件不再穿透到下层界面 */
          private fun Modifier.consumeAllPointerInput(): Modifier = pointerInput(Unit) {
              awaitPointerEventScope {
                  while (true) {
                      awaitPointerEvent().changes.forEach { it.consume() }
                  }
              }
          }

          @Composable
          fun FullScreenPreview(item: FileItem, vm: FileManagerViewModel, onDismiss: () -> Unit) {
              Surface(modifier = Modifier.fillMaxSize().consumeAllPointerInput(), color = MaterialTheme.colorScheme.background) {
                  when (item.kind) {
                      FileKind.CODE -> key(item.path) {
                          if (item.extension in HTML_EXTS) HtmlViewerScreen(item, onDismiss)
                          else TextEditorScreen(item, vm, onDismiss)
                      }
                      FileKind.IMAGE -> key(item.path) { ImageViewerScreen(item, onDismiss) }
                      FileKind.VIDEO -> key(item.path) { VideoPlayerScreen(item, vm, onDismiss) }
                      FileKind.AUDIO -> key(item.path) { AudioPlayerScreen(item, vm, onDismiss) }
                      FileKind.ARCHIVE -> key(item.path) { ArchiveBrowserScreen(item, vm, onDismiss) }
                      FileKind.FONT -> key(item.path) { FontPreviewScreen(item, onDismiss) }
                      FileKind.PDF -> key(item.path) { PdfViewerScreen(item, onDismiss) }
                      FileKind.DATABASE -> key(item.path) { SqliteViewerScreen(item, onDismiss) }
                      FileKind.APK -> key(item.path) { ApkInfoScreen(item, vm, onDismiss) }
                      else -> key(item.path) {
                          var hexMode by remember { mutableStateOf(false) }
                          if (hexMode) HexViewerScreen(item, onDismiss)
                          else UnsupportedScreen(item, onDismiss, onOpenHex = { hexMode = true })
                      }
                  }
              }
          }

          // ============================================================
          // 全屏文本编辑器
          // ============================================================
          @Composable
          fun TextEditorScreen(item: FileItem, vm: FileManagerViewModel, onDismiss: () -> Unit) {
              val scope = rememberCoroutineScope()
              val clipboard = LocalClipboardManager.current
              var loading by remember { mutableStateOf(true) }
              var text by remember { mutableStateOf("") }
              var editing by remember { mutableStateOf(false) }
              var errorMsg by remember { mutableStateOf<String?>(null) }
              var showReplace by remember { mutableStateOf(false) }
              var encoding by remember { mutableStateOf("UTF-8") }
              val tooBig = text.length > 300_000
              val lineCount = remember(text) { if (text.isEmpty()) 0 else text.count { it == '\n' } + 1 }
              val scrollState = rememberScrollState()
              val bigListState = rememberLazyListState()
              val bigLines = remember(text) { if (text.length > 300_000) text.lines() else emptyList() }
              var layoutResult by remember { mutableStateOf<TextLayoutResult?>(null) }
              var findMode by remember { mutableStateOf(false) }
              var findQuery by remember { mutableStateOf("") }
              var findOffsets by remember { mutableStateOf<List<Int>>(emptyList()) }
              var findIdx by remember { mutableIntStateOf(0) }

              LaunchedEffect(item.path) {
                  val (loaded, enc, err) = withContext(Dispatchers.IO) {
                      if (item.size > 8_000_000L) Triple<String?, String, String?>(null, "UTF-8", "文件过大（" + humanSize(item.size) + "），无法内联编辑")
                      else decodeTextSmart(item.file)
                  }
                  if (loaded != null) text = loaded
                  encoding = enc
                  errorMsg = err
                  loading = false
              }

              LaunchedEffect(findQuery, text, findMode) {
                  if (!findMode || findQuery.isEmpty()) {
                      findOffsets = emptyList(); findIdx = 0; return@LaunchedEffect
                  }
                  val res = withContext(Dispatchers.Default) {
                      val out = ArrayList<Int>()
                      var i = text.indexOf(findQuery)
                      while (i >= 0 && out.size < 1000) {
                          out.add(i)
                          i = text.indexOf(findQuery, i + findQuery.length)
                      }
                      out
                  }
                  findOffsets = res
                  findIdx = 0
              }

              /** 滚动到字符 offset 所在位置（小文本按布局盒，大文本按行号） */
              fun gotoOffset(offset: Int) {
                  if (tooBig) {
                      var line = 0
                      val end = offset.coerceAtMost(text.length)
                      for (i in 0 until end) if (text[i] == '\n') line++
                      scope.launch { bigListState.scrollToItem(line.coerceAtLeast(0)) }
                  } else {
                      val lr = layoutResult ?: return
                      val off = offset.coerceIn(0, (text.length - 1).coerceAtLeast(0))
                      val box = lr.getBoundingBox(off)
                      scope.launch { scrollState.animateScrollTo((box.top.toInt() - 240).coerceAtLeast(0)) }
                  }
              }

              fun findNext(dir: Int) {
                  if (findOffsets.isEmpty()) return
                  findIdx = (findIdx + dir + findOffsets.size) % findOffsets.size
                  gotoOffset(findOffsets[findIdx])
              }

              BackHandler { onDismiss() }

              if (showReplace) {
                  ReplaceDialog(text = text, onConfirm = { findText, repText ->
                      if (findText.isNotEmpty()) {
                          text = text.replace(findText, repText)
                          editing = true
                      }
                  }, onDismiss = { showReplace = false })
              }

              Column(Modifier.fillMaxSize()) {
                  Surface(color = MaterialTheme.colorScheme.surfaceContainer) {
                      Row(
                          modifier = Modifier.fillMaxWidth().statusBarsPadding()
                              .height(64.dp).padding(horizontal = 4.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          IconButton(onClick = onDismiss) { Icon(Icons.Filled.ArrowBack, "返回") }
                          Column(Modifier.weight(1f).padding(horizontal = 4.dp)) {
                              Text(item.name, style = MaterialTheme.typography.titleLarge, maxLines = 1, overflow = TextOverflow.Ellipsis)
                              Text(
                                  if (loading || errorMsg != null) item.subtitle
                                  else item.subtitle + " · " + encoding + (if (lineCount > 0) " · " + lineCount + " 行" else ""),
                                  style = MaterialTheme.typography.labelSmall,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant, maxLines = 1, overflow = TextOverflow.Ellipsis)
                          }
                          if (!loading && errorMsg == null) {
                              IconButton(onClick = { clipboard.setText(AnnotatedString(text)) }) {
                                  Icon(Icons.Filled.ContentCopy, "复制全部")
                              }
                              IconButton(onClick = {
                                  if (editing) showReplace = true
                                  else findMode = !findMode
                              }) {
                                  Icon(Icons.Filled.Search, if (editing) "查找替换" else "查找")
                              }
                              IconButton(onClick = {
                                  if (editing) editing = false
                                  else if (tooBig) vm.showSnack("文本过大（约 " + (text.length / 1000) + " 千字符），仅支持预览")
                                  else { editing = true; findMode = false }
                              }) {
                                  Icon(Icons.Filled.Edit, if (editing) "预览" else "编辑")
                              }
                              if (editing) {
                                  IconButton(onClick = {
                                      scope.launch {
                                          val ok = vm.saveTextFile(item, text, encoding)
                                          if (ok) { vm.showSnack("已保存"); editing = false }
                                          else vm.showSnack("保存失败")
                                      }
                                  }) { Icon(Icons.Filled.Save, "保存") }
                              }
                          }
                      }
                  }
                  if (findMode && !editing && !loading && errorMsg == null) {
                      Surface(color = MaterialTheme.colorScheme.surfaceContainerLow) {
                          Row(Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 6.dp),
                              verticalAlignment = Alignment.CenterVertically) {
                              Icon(Icons.Filled.Search, null, modifier = Modifier.size(16.dp),
                                  tint = MaterialTheme.colorScheme.onSurfaceVariant)
                              Spacer(Modifier.width(8.dp))
                              BasicTextField(value = findQuery, onValueChange = { findQuery = it },
                                  modifier = Modifier.weight(1f),
                                  textStyle = TextStyle(color = MaterialTheme.colorScheme.onSurface, fontSize = 14.sp),
                                  singleLine = true, cursorBrush = SolidColor(MaterialTheme.colorScheme.primary),
                                  keyboardOptions = KeyboardOptions(imeAction = ImeAction.Search),
                                  keyboardActions = KeyboardActions(onSearch = { findNext(1) }),
                                  decorationBox = { inner -> Box {
                                      if (findQuery.isEmpty()) Text("查找…",
                                          color = MaterialTheme.colorScheme.onSurfaceVariant, fontSize = 14.sp)
                                      inner()
                                  } })
                              if (findQuery.isNotEmpty()) {
                                  Text(
                                      if (findOffsets.isEmpty()) "无匹配"
                                      else (findIdx + 1).toString() + "/" + findOffsets.size,
                                      style = MaterialTheme.typography.labelSmall,
                                      color = if (findOffsets.isEmpty()) MaterialTheme.colorScheme.error
                                          else MaterialTheme.colorScheme.onSurfaceVariant,
                                      modifier = Modifier.padding(horizontal = 6.dp))
                              }
                              IconButton(onClick = { findNext(-1) }, enabled = findOffsets.isNotEmpty(),
                                  modifier = Modifier.size(32.dp)) {
                                  Icon(Icons.Filled.ArrowUpward, "上一个", modifier = Modifier.size(18.dp))
                              }
                              IconButton(onClick = { findNext(1) }, enabled = findOffsets.isNotEmpty(),
                                  modifier = Modifier.size(32.dp)) {
                                  Icon(Icons.Filled.ArrowDownward, "下一个", modifier = Modifier.size(18.dp))
                              }
                              IconButton(onClick = { findMode = false; findQuery = ""; findOffsets = emptyList() },
                                  modifier = Modifier.size(32.dp)) {
                                  Icon(Icons.Filled.Close, "关闭查找", modifier = Modifier.size(18.dp))
                              }
                          }
                      }
                  }
                  Box(Modifier.fillMaxSize()) {
                      when {
                          loading -> Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                              Text("正在加载…", color = MaterialTheme.colorScheme.onSurfaceVariant)
                          }
                          errorMsg != null -> Box(Modifier.fillMaxSize().padding(32.dp), contentAlignment = Alignment.Center) {
                              Text(errorMsg ?: "", color = MaterialTheme.colorScheme.error)
                          }
                          editing -> BasicTextField(
                              value = text, onValueChange = { text = it },
                              modifier = Modifier.fillMaxSize()
                                  .padding(horizontal = 16.dp, vertical = 12.dp)
                                  .navigationBarsPadding(),
                              textStyle = TextStyle(fontFamily = FontFamily.Monospace, fontSize = 14.sp,
                                  lineHeight = 22.sp, color = MaterialTheme.colorScheme.onSurface),
                              cursorBrush = SolidColor(MaterialTheme.colorScheme.primary)
                          )
                          tooBig -> Box(Modifier.fillMaxSize()) {
                              LazyColumn(state = bigListState, modifier = Modifier.fillMaxSize(),
                                  contentPadding = PaddingValues(start = 16.dp, end = 32.dp, top = 12.dp, bottom = 12.dp)) {
                                  items(count = bigLines.size) { i ->
                                      Text(bigLines[i], fontFamily = FontFamily.Monospace, fontSize = 14.sp,
                                          lineHeight = 22.sp, color = MaterialTheme.colorScheme.onSurface)
                                  }
                              }
                              FastScrollbar(
                                  fractionProvider = {
                                      if (bigLines.size <= 1) 0f
                                      else bigListState.firstVisibleItemIndex.toFloat() / (bigLines.size - 1)
                                  },
                                  onScrub = { f ->
                                      val idx = (f * (bigLines.size - 1)).toInt().coerceIn(0, bigLines.size - 1)
                                      scope.launch { bigListState.scrollToItem(idx) }
                                  },
                                  modifier = Modifier.align(Alignment.CenterEnd).padding(vertical = 4.dp).navigationBarsPadding()
                              )
                          }
                          else -> {
                              Box(Modifier.fillMaxSize()) {
                                  SelectionContainer {
                                      Column(Modifier.fillMaxSize().verticalScroll(scrollState)
                                          .padding(start = 16.dp, end = 32.dp, top = 12.dp, bottom = 12.dp).navigationBarsPadding()) {
                                          Text(text, fontFamily = FontFamily.Monospace, fontSize = 14.sp,
                                              lineHeight = 22.sp, color = MaterialTheme.colorScheme.onSurface,
                                              onTextLayout = { layoutResult = it })
                                      }
                                  }
                                  if (scrollState.maxValue > 0) {
                                      FastScrollbar(
                                          fractionProvider = { scrollState.value.toFloat() / scrollState.maxValue },
                                          onScrub = { f -> scope.launch { scrollState.scrollTo((f * scrollState.maxValue).toInt()) } },
                                          modifier = Modifier.align(Alignment.CenterEnd).padding(vertical = 4.dp).navigationBarsPadding()
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }

          // ============================================================
          // 全屏图片查看器
          // ============================================================
          @Composable
          fun ImageViewerScreen(item: FileItem, onDismiss: () -> Unit) {
              var siblings by remember { mutableStateOf<List<File>>(emptyList()) }
              var curIndex by remember { mutableIntStateOf(0) }
              var bitmap by remember { mutableStateOf<Bitmap?>(null) }
              var errorMsg by remember { mutableStateOf<String?>(null) }
              var scale by remember { mutableStateOf(1f) }
              var offset by remember { mutableStateOf(Offset.Zero) }
              var originalBitmap by remember { mutableStateOf<Bitmap?>(null) }
              var quarter by remember { mutableIntStateOf(0) }
              var rotating by remember { mutableStateOf(false) }
              var settingWallpaper by remember { mutableStateOf(false) }
              val scope = rememberCoroutineScope()
              val ctx = LocalContext.current

              LaunchedEffect(item.path) {
                  val list = withContext(Dispatchers.IO) {
                      try {
                          val all = item.file.parentFile?.listFiles()?.filter { f2 ->
                              f2.isFile && IMAGE_EXTS.contains(f2.name.substringAfterLast('.', "").lowercase(Locale.ROOT))
                          }?.sortedBy { f2 -> f2.name.lowercase(Locale.ROOT) } ?: emptyList()
                          if (all.isEmpty()) listOf(item.file) else all
                      } catch (_: Exception) { listOf(item.file) }
                  }
                  siblings = list
                  curIndex = list.indexOfFirst { f2 -> f2.absolutePath == item.path }.coerceAtLeast(0)
              }

              val currentPath = siblings.getOrNull(curIndex)?.absolutePath ?: item.path

              LaunchedEffect(currentPath) {
                  bitmap = null
                  originalBitmap = null
                  quarter = 0
                  errorMsg = null
                  scale = 1f
                  offset = Offset.Zero
                  val (bmp, err) = withContext(Dispatchers.IO) {
                      try {
                          val opts = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                          BitmapFactory.decodeFile(currentPath, opts)
                          var sample = 1
                          while (opts.outWidth / sample > 3072 || opts.outHeight / sample > 3072) sample *= 2
                          val decodeOpts = BitmapFactory.Options().apply { inSampleSize = sample }
                          val b = BitmapFactory.decodeFile(currentPath, decodeOpts)
                          Pair(b, if (b == null) "无法解码图片" else null)
                      } catch (e: Exception) { Pair<Bitmap?, String?>(null, "读取失败：" + (e.message ?: "")) }
                  }
                  bitmap = bmp
                  originalBitmap = bmp
                  quarter = 0
                  errorMsg = err
              }

              BackHandler { onDismiss() }

              Box(Modifier.fillMaxSize().background(Color.Black)) {
                  val b = bitmap
                  if (b != null) {
                      val transformState = rememberTransformableState { zoomChange, panChange, _ ->
                          scale = (scale * zoomChange).coerceIn(1f, 6f)
                          if (scale <= 1f) offset = Offset.Zero
                          else offset = offset + panChange
                      }
                      val swipeModifier = if (scale <= 1.01f) Modifier.pointerInput(currentPath) {
                          awaitEachGesture {
                              val down = awaitFirstDown(requireUnconsumed = false)
                              var acc = 0f
                              var multi = false
                              while (true) {
                                  val event = awaitPointerEvent()
                                  if (event.changes.size > 1) multi = true
                                  val change = event.changes.firstOrNull { c -> c.id == down.id } ?: break
                                  if (!multi) acc += change.position.x - change.previousPosition.x
                                  if (change.changedToUpIgnoreConsumed()) break
                              }
                              if (!multi && kotlin.math.abs(acc) > 120f) {
                                  if (acc > 0 && curIndex > 0) curIndex -= 1
                                  else if (acc < 0 && curIndex < siblings.size - 1) curIndex += 1
                              }
                          }
                      } else Modifier
                      Image(
                          bitmap = b.asImageBitmap(), contentDescription = currentPath,
                          modifier = Modifier
                              .fillMaxSize()
                              .graphicsLayer(scaleX = scale, scaleY = scale, translationX = offset.x, translationY = offset.y)
                              .transformable(state = transformState)
                              .then(swipeModifier)
                              .pointerInput(currentPath) {
                                  detectTapGestures(onDoubleTap = { scale = 1f; offset = Offset.Zero })
                              },
                          contentScale = ContentScale.Fit
                      )
                  } else if (errorMsg != null) {
                      Text(errorMsg ?: "", color = Color.White, modifier = Modifier.align(Alignment.Center))
                  } else {
                      Text("正在加载…", color = Color.White, modifier = Modifier.align(Alignment.Center))
                  }
                  IconButton(onClick = onDismiss,
                      modifier = Modifier.align(Alignment.TopStart).statusBarsPadding().padding(8.dp)) {
                      Icon(Icons.Filled.Close, "关闭", tint = Color.White)
                  }
                  Row(modifier = Modifier.align(Alignment.TopEnd).statusBarsPadding().padding(8.dp)) {
                      IconButton(
                          enabled = !rotating,
                          onClick = {
                              if (rotating) return@IconButton
                              val orig = originalBitmap ?: return@IconButton
                              val next = (quarter + 1) % 4
                              rotating = true
                              scope.launch {
                                  val rotated = withContext(Dispatchers.Default) {
                                      try {
                                          if (next == 0) orig else Bitmap.createBitmap(orig, 0, 0, orig.width, orig.height,
                                              Matrix().apply { postRotate(90f * next) }, true)
                                      } catch (_: Exception) { null }
                                  }
                                  if (rotated != null) {
                                      quarter = next; bitmap = rotated; scale = 1f; offset = Offset.Zero
                                  }
                                  rotating = false
                              }
                          }
                      ) { Icon(Icons.Filled.RotateRight, "旋转 90°", tint = Color.White) }
                      IconButton(
                          enabled = !settingWallpaper && bitmap != null,
                          onClick = {
                              val b = bitmap ?: return@IconButton
                              settingWallpaper = true
                              scope.launch {
                                  val ok = withContext(Dispatchers.IO) {
                                      try {
                                          WallpaperManager.getInstance(ctx).setBitmap(b)
                                          true
                                      } catch (_: Exception) { false }
                                  }
                                  settingWallpaper = false
                                  Toast.makeText(ctx, if (ok) "已设为壁纸" else "设置壁纸失败", Toast.LENGTH_SHORT).show()
                              }
                          }
                      ) { Icon(Icons.Filled.Wallpaper, "设为壁纸", tint = Color.White) }
                  }
                  Surface(
                      modifier = Modifier.align(Alignment.BottomCenter).fillMaxWidth().navigationBarsPadding(),
                      color = Color.Black.copy(alpha = 0.5f)
                  ) {
                      Column(Modifier.padding(16.dp)) {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Text(File(currentPath).name, color = Color.White, maxLines = 1,
                                  overflow = TextOverflow.Ellipsis, modifier = Modifier.weight(1f))
                              if (siblings.size > 1) {
                                  Text((curIndex + 1).toString() + " / " + siblings.size,
                                      color = Color.White.copy(alpha = 0.85f), style = MaterialTheme.typography.labelMedium)
                              }
                          }
                          Spacer(Modifier.height(4.dp))
                          Text(item.subtitle, color = Color.White.copy(alpha = 0.7f),
                              style = MaterialTheme.typography.labelSmall, maxLines = 1, overflow = TextOverflow.Ellipsis)
                      }
                  }
              }
          }

          // ============================================================
          // 全屏字体预览
          // ============================================================
          @Composable
          fun FontPreviewScreen(item: FileItem, onDismiss: () -> Unit) {
              var typeface by remember { mutableStateOf<Typeface?>(null) }
              var errorMsg by remember { mutableStateOf<String?>(null) }
              LaunchedEffect(item.path) {
                  val tf = withContext(Dispatchers.IO) {
                      try { Typeface.createFromFile(item.path) } catch (_: Exception) { null }
                  }
                  if (tf != null) typeface = tf else errorMsg = "无法加载字体"
              }
              BackHandler { onDismiss() }
              Column(Modifier.fillMaxSize()) {
                  Surface(color = MaterialTheme.colorScheme.surfaceContainer) {
                      Row(modifier = Modifier.fillMaxWidth().statusBarsPadding().height(64.dp).padding(horizontal = 4.dp),
                          verticalAlignment = Alignment.CenterVertically) {
                          IconButton(onClick = onDismiss) { Icon(Icons.Filled.ArrowBack, "返回") }
                          Column(Modifier.weight(1f).padding(horizontal = 4.dp)) {
                              Text(item.name, style = MaterialTheme.typography.titleLarge, maxLines = 1, overflow = TextOverflow.Ellipsis)
                              Text(item.subtitle, style = MaterialTheme.typography.labelSmall,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant, maxLines = 1, overflow = TextOverflow.Ellipsis)
                          }
                      }
                  }
                  val tf = typeface
                  when {
                      errorMsg != null -> Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Text(errorMsg ?: "", color = MaterialTheme.colorScheme.error)
                      }
                      tf == null -> Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Text("正在加载…", color = MaterialTheme.colorScheme.onSurfaceVariant)
                      }
                      else -> {
                          val ff = FontFamily(tf)
                          Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(20.dp).navigationBarsPadding()) {
                              listOf(14, 18, 24, 32, 44).forEach { sz ->
                                  Text(sz.toString() + "sp", style = MaterialTheme.typography.labelSmall,
                                      color = MaterialTheme.colorScheme.primary)
                                  Text("永字八法 AaBbCc 汉字排版 12345", fontFamily = ff, fontSize = sz.sp,
                                      lineHeight = (sz + 8).sp, color = MaterialTheme.colorScheme.onSurface,
                                      modifier = Modifier.padding(vertical = 6.dp))
                                  Spacer(Modifier.height(10.dp))
                              }
                          }
                      }
                  }
              }
          }

          // ============================================================
          // 全屏视频播放器
          // ============================================================
          @Composable
          fun VideoPlayerScreen(item: FileItem, vm: FileManagerViewModel, onDismiss: () -> Unit) {
              val lifecycleOwner = LocalLifecycleOwner.current
              val configuration = LocalConfiguration.current
              var videoViewRef by remember { mutableStateOf<VideoView?>(null) }
              var isPlaying by remember { mutableStateOf(false) }
              var duration by remember { mutableIntStateOf(0) }
              var position by remember { mutableIntStateOf(0) }
              var controlsVisible by remember { mutableStateOf(true) }
              var errorMsg by remember { mutableStateOf<String?>(null) }

              DisposableEffect(lifecycleOwner, item.path) {
                  val observer = LifecycleEventObserver { _, event ->
                      if (event == Lifecycle.Event.ON_PAUSE) {
                          try { videoViewRef?.let { if (it.isPlaying) { it.pause(); isPlaying = false } } } catch (_: Exception) {}
                      }
                  }
                  lifecycleOwner.lifecycle.addObserver(observer)
                  onDispose {
                      lifecycleOwner.lifecycle.removeObserver(observer)
                      try { videoViewRef?.let { if (it.isPlaying) it.stopPlayback() } } catch (_: Exception) {}
                      videoViewRef = null
                  }
              }

              LaunchedEffect(isPlaying) {
                  while (isPlaying) {
                      try { videoViewRef?.let { position = it.currentPosition } } catch (_: Exception) {}
                      delay(500)
                  }
              }

              BackHandler { onDismiss() }

              Box(Modifier.fillMaxSize().background(Color.Black)) {
                  AndroidView(
                      factory = { ctx ->
                          VideoView(ctx).apply {
                              setVideoPath(item.path)
                              setOnPreparedListener { mp -> duration = mp.duration; start(); isPlaying = true }
                              setOnCompletionListener { isPlaying = false }
                              setOnErrorListener { _, _, _ -> errorMsg = "无法播放此视频"; isPlaying = false; true }
                          }
                      },
                      update = { view -> videoViewRef = view },
                      modifier = Modifier.fillMaxSize().clickable { controlsVisible = !controlsVisible }
                  )

                  if (errorMsg != null) {
                      Text(errorMsg ?: "", color = Color.White, modifier = Modifier.align(Alignment.Center))
                  }

                  if (controlsVisible) {
                      Surface(
                          modifier = Modifier.align(Alignment.TopCenter).fillMaxWidth().statusBarsPadding(),
                          color = Color.Black.copy(alpha = 0.4f)
                      ) {
                          Row(Modifier.fillMaxWidth().height(56.dp).padding(horizontal = 8.dp),
                              verticalAlignment = Alignment.CenterVertically) {
                              IconButton(onClick = onDismiss) { Icon(Icons.Filled.ArrowBack, "返回", tint = Color.White) }
                              Column(Modifier.weight(1f)) {
                                  Text(item.name, color = Color.White, maxLines = 1, overflow = TextOverflow.Ellipsis)
                              }
                              if (configuration.orientation == Configuration.ORIENTATION_LANDSCAPE) {
                                  Text("横屏", color = Color.White.copy(alpha = 0.7f),
                                      style = MaterialTheme.typography.labelSmall)
                              }
                          }
                      }
                      Surface(
                          modifier = Modifier.align(Alignment.BottomCenter).fillMaxWidth().navigationBarsPadding(),
                          color = Color.Black.copy(alpha = 0.4f)
                      ) {
                          Column(Modifier.padding(12.dp)) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Text(fmtTime(position), color = Color.White, style = MaterialTheme.typography.labelSmall)
                                  Slider(
                                      value = if (duration > 0) (position.toFloat() / duration).coerceIn(0f, 1f) else 0f,
                                      onValueChange = { frac ->
                                          val v = videoViewRef ?: return@Slider
                                          try { v.seekTo((frac * duration).toInt()) } catch (_: Exception) {}
                                      },
                                      modifier = Modifier.weight(1f).padding(horizontal = 8.dp)
                                  )
                                  Text(fmtTime(duration), color = Color.White, style = MaterialTheme.typography.labelSmall)
                              }
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.Center) {
                                  IconButton(onClick = {
                                      val v = videoViewRef ?: return@IconButton
                                      try {
                                          if (v.isPlaying) { v.pause(); isPlaying = false }
                                          else { v.start(); isPlaying = true }
                                      } catch (_: Exception) {}
                                  }, modifier = Modifier.size(56.dp)) {
                                      Icon(if (isPlaying) Icons.Filled.Pause else Icons.Filled.PlayArrow,
                                          "播放/暂停", tint = Color.White, modifier = Modifier.size(36.dp))
                                  }
                              }
                          }
                      }
                  }
              }
          }

          // ============================================================
          // 全屏音频播放器
          // ============================================================
          @Composable
          fun AudioPlayerScreen(item: FileItem, vm: FileManagerViewModel, onDismiss: () -> Unit) {
              val lifecycleOwner = LocalLifecycleOwner.current
              val cs = MaterialTheme.colorScheme
              var player by remember { mutableStateOf<MediaPlayer?>(null) }
              var isPlaying by remember { mutableStateOf(false) }
              var duration by remember { mutableIntStateOf(0) }
              var position by remember { mutableIntStateOf(0) }
              var errorMsg by remember { mutableStateOf<String?>(null) }
              var prepared by remember { mutableStateOf(false) }

              DisposableEffect(lifecycleOwner, item.path) {
                  val mp = MediaPlayer()
                  try {
                      mp.setDataSource(item.path)
                      mp.setOnPreparedListener { p -> duration = p.duration; player = p; prepared = true }
                      mp.setOnCompletionListener { isPlaying = false }
                      mp.setOnErrorListener { _, _, _ -> errorMsg = "播放失败"; true }
                      mp.prepareAsync()
                  } catch (e: Exception) {
                      errorMsg = e.message ?: "无法播放"
                      try { mp.release() } catch (_: Exception) {}
                  }
                  val observer = LifecycleEventObserver { _, event ->
                      if (event == Lifecycle.Event.ON_PAUSE) {
                          try { if (mp.isPlaying) { mp.pause(); isPlaying = false } } catch (_: Exception) {}
                      }
                  }
                  lifecycleOwner.lifecycle.addObserver(observer)
                  onDispose {
                      lifecycleOwner.lifecycle.removeObserver(observer)
                      try {
                          mp.setOnPreparedListener(null); mp.setOnCompletionListener(null); mp.setOnErrorListener(null)
                          if (mp.isPlaying) mp.stop(); mp.release()
                      } catch (_: Exception) {}
                      player = null
                  }
              }

              LaunchedEffect(isPlaying) {
                  while (isPlaying) {
                      try { player?.let { position = it.currentPosition } } catch (_: Exception) {}
                      delay(500)
                  }
              }

              BackHandler { onDismiss() }

              val gradient = Brush.verticalGradient(listOf(cs.primaryContainer, cs.background))

              Box(Modifier.fillMaxSize().background(gradient)) {
                  Column(modifier = Modifier.fillMaxSize().statusBarsPadding().navigationBarsPadding(),
                      horizontalAlignment = Alignment.CenterHorizontally) {
                      Row(modifier = Modifier.fillMaxWidth().height(64.dp).padding(horizontal = 8.dp),
                          verticalAlignment = Alignment.CenterVertically) {
                          IconButton(onClick = onDismiss) {
                              Icon(Icons.Filled.ArrowBack, "返回", tint = cs.onPrimaryContainer)
                          }
                          Column(Modifier.weight(1f)) {
                              Text(item.name, color = cs.onPrimaryContainer, maxLines = 1,
                                  overflow = TextOverflow.Ellipsis, style = MaterialTheme.typography.titleMedium)
                              Text(item.subtitle, color = cs.onPrimaryContainer.copy(alpha = 0.7f),
                                  maxLines = 1, overflow = TextOverflow.Ellipsis, style = MaterialTheme.typography.labelSmall)
                          }
                      }
                      Spacer(Modifier.weight(1f))
                      Box(modifier = Modifier.size(240.dp).clip(CircleShape).background(cs.primary),
                          contentAlignment = Alignment.Center) {
                          Icon(Icons.Filled.MusicNote, null, modifier = Modifier.size(120.dp), tint = cs.onPrimary)
                      }
                      Spacer(Modifier.height(48.dp))
                      Column(Modifier.fillMaxWidth().padding(horizontal = 32.dp)) {
                          Slider(
                              value = if (duration > 0) (position.toFloat() / duration).coerceIn(0f, 1f) else 0f,
                              onValueChange = { frac ->
                                  val p = player ?: return@Slider
                                  try { p.seekTo((frac * duration).toInt()) } catch (_: Exception) {}
                              },
                              enabled = prepared
                          )
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                              Text(fmtTime(position), color = cs.onPrimaryContainer, style = MaterialTheme.typography.labelSmall)
                              Text(fmtTime(duration), color = cs.onPrimaryContainer, style = MaterialTheme.typography.labelSmall)
                          }
                      }
                      Spacer(Modifier.height(16.dp))
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.Center,
                          verticalAlignment = Alignment.CenterVertically) {
                          IconButton(
                              onClick = {
                                  val p = player ?: return@IconButton
                                  try {
                                      if (p.isPlaying) { p.pause(); isPlaying = false }
                                      else { p.start(); isPlaying = true }
                                  } catch (_: Exception) {}
                              },
                              modifier = Modifier.size(96.dp).clip(CircleShape).background(cs.primary),
                              enabled = prepared
                          ) {
                              Icon(if (isPlaying) Icons.Filled.Pause else Icons.Filled.PlayArrow,
                                  "播放/暂停", tint = cs.onPrimary, modifier = Modifier.size(56.dp))
                          }
                      }
                      Spacer(Modifier.weight(1f))
                      if (errorMsg != null) Text(errorMsg ?: "", color = cs.error, modifier = Modifier.padding(16.dp))
                      else if (!prepared) Text("正在准备…", color = cs.onPrimaryContainer.copy(alpha = 0.7f),
                          modifier = Modifier.padding(16.dp))
                  }
              }
          }

          // ============================================================
          // 全屏压缩包浏览器（子目录 + 完整编辑）
          // ============================================================
          @OptIn(ExperimentalFoundationApi::class)
          @Composable
          fun ArchiveBrowserScreen(item: FileItem, vm: FileManagerViewModel, onDismiss: () -> Unit) {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              var allEntries by remember { mutableStateOf<List<ZipEntryInfo>>(emptyList()) }
              var currentPath by remember { mutableStateOf("") }
              var loading by remember { mutableStateOf(true) }
              var errorMsg by remember { mutableStateOf<String?>(null) }
              var editTarget by remember { mutableStateOf<ZipEntryInfo?>(null) }
              var renameTarget by remember { mutableStateOf<ZipEntryInfo?>(null) }
              var showNewFolder by remember { mutableStateOf(false) }
              var busy by remember { mutableStateOf(false) }
              var reloadKey by remember { mutableIntStateOf(0) }
              val editable = ArchiveEngine.isEditable(item.extension)

              LaunchedEffect(item.path, reloadKey) {
                  loading = true
                  val (list, err) = withContext(Dispatchers.IO) {
                      if (!ArchiveEngine.isSupported(item.extension)) {
                          Pair<List<ZipEntryInfo>, String?>(emptyList(), "暂不支持 ." + item.extension + " 内浏览（支持 zip / jar / rar / 7z / tar / tgz）")
                      } else ArchiveEngine.listEntries(item.file, item.extension)
                  }
                  allEntries = list; errorMsg = err; loading = false
              }

              val displayItems = remember(allEntries, currentPath) {
                  buildZipDisplayItems(allEntries, currentPath)
              }

              BackHandler {
                  if (currentPath.isEmpty()) onDismiss()
                  else {
                      val trimmed = currentPath.trimEnd('/')
                      val idx = trimmed.lastIndexOf('/')
                      currentPath = if (idx < 0) "" else trimmed.substring(0, idx + 1)
                  }
              }

              Column(Modifier.fillMaxSize()) {
                  Surface(color = MaterialTheme.colorScheme.surfaceContainer) {
                      Column(Modifier.fillMaxWidth().statusBarsPadding()) {
                          Row(modifier = Modifier.fillMaxWidth().height(64.dp).padding(horizontal = 4.dp),
                              verticalAlignment = Alignment.CenterVertically) {
                              IconButton(onClick = onDismiss) { Icon(Icons.Filled.ArrowBack, "返回") }
                              Column(Modifier.weight(1f).padding(horizontal = 4.dp)) {
                                  Text(item.name, style = MaterialTheme.typography.titleLarge, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                  Text(
                                      if (loading) "读取中…"
                                      else if (busy) "处理中…"
                                      else "共 " + allEntries.size + " 项 · 当前 " + displayItems.size + " 项",
                                      style = MaterialTheme.typography.labelSmall,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant
                                  )
                              }
                              IconButton(onClick = { showNewFolder = true }, enabled = !loading && !busy && editable) {
                                  Icon(Icons.Filled.CreateNewFolder, "新建文件夹")
                              }
                              IconButton(
                                  onClick = {
                                      val cb = vm.clipboard
                                      if (cb == null) { vm.showSnack("请先复制一个文件"); return@IconButton }
                                      val srcPath = cb.paths.firstOrNull() ?: return@IconButton
                                      val src = File(srcPath)
                                      if (!src.exists()) { vm.showSnack("源文件不存在"); return@IconButton }
                                      val inner = currentPath + src.name
                                      scope.launch {
                                          busy = true
                                          val ok = withContext(Dispatchers.IO) {
                                              vm.zipAddFile(item.file, src, inner)
                                          }
                                          busy = false
                                          if (ok) { vm.showSnack("已粘贴到压缩包"); reloadKey++ }
                                          else vm.showSnack("粘贴失败")
                                      }
                                  },
                                  enabled = !loading && !busy && editable
                              ) { Icon(Icons.Filled.ContentPaste, "粘贴到此处") }
                              IconButton(
                                  onClick = {
                                      scope.launch {
                                          busy = true
                                          val target = item.file.parentFile ?: return@launch
                                          val count = withContext(Dispatchers.IO) {
                                              ArchiveEngine.extractAll(item.file, item.extension, target, currentPath)
                                          }
                                          busy = false
                                          vm.showSnack("已解压 " + count + " 个文件到 " + target.name)
                                          vm.pullToRefresh()
                                      }
                                  },
                                  enabled = !loading && !busy
                              ) {
                                  Icon(Icons.Filled.Save,
                                      if (currentPath.isEmpty()) "解压全部到当前目录" else "解压此目录到当前目录")
                              }
                          }

                          if (currentPath.isNotEmpty()) {
                              Row(modifier = Modifier.fillMaxWidth().horizontalScroll(rememberScrollState())
                                  .padding(horizontal = 12.dp, vertical = 6.dp),
                                  verticalAlignment = Alignment.CenterVertically) {
                                  Box(
                                      modifier = Modifier
                                          .clip(RoundedCornerShape(16.dp))
                                          .background(MaterialTheme.colorScheme.secondaryContainer)
                                          .clickable { currentPath = "" }
                                  ) {
                                      Text("根目录", style = MaterialTheme.typography.labelMedium,
                                          color = MaterialTheme.colorScheme.onSecondaryContainer,
                                          modifier = Modifier.padding(horizontal = 10.dp, vertical = 6.dp))
                                  }
                                  val parts = currentPath.trimEnd('/').split('/')
                                  var acc = ""
                                  parts.forEachIndexed { i, p ->
                                      Icon(Icons.Filled.ChevronRight, null,
                                          tint = MaterialTheme.colorScheme.outline, modifier = Modifier.size(16.dp))
                                      acc += p + "/"
                                      val target = acc
                                      val last = i == parts.lastIndex
                                      Box(
                                          modifier = Modifier
                                              .clip(RoundedCornerShape(16.dp))
                                              .background(if (last) MaterialTheme.colorScheme.secondaryContainer
                                                  else MaterialTheme.colorScheme.surface)
                                              .clickable { currentPath = target }
                                      ) {
                                          Text(p, style = MaterialTheme.typography.labelMedium,
                                              color = if (last) MaterialTheme.colorScheme.onSecondaryContainer
                                                  else MaterialTheme.colorScheme.onSurfaceVariant,
                                              modifier = Modifier.padding(horizontal = 10.dp, vertical = 6.dp))
                                      }
                                  }
                              }
                          }
                      }
                  }

                  when {
                      loading -> Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Text("正在读取…", color = MaterialTheme.colorScheme.onSurfaceVariant)
                      }
                      errorMsg != null -> Box(Modifier.fillMaxSize().padding(32.dp), contentAlignment = Alignment.Center) {
                          Text(errorMsg ?: "", color = MaterialTheme.colorScheme.error)
                      }
                      displayItems.isEmpty() -> Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Text("此目录为空", color = MaterialTheme.colorScheme.onSurfaceVariant)
                      }
                      else -> LazyColumn(modifier = Modifier.fillMaxSize(),
                          contentPadding = PaddingValues(top = 4.dp, bottom = 24.dp)) {
                          items(count = displayItems.size, key = { idx -> displayItems[idx].name }) { idx ->
                              val e = displayItems[idx]
                              Row(
                                  modifier = Modifier.fillMaxWidth()
                                      .combinedClickable(
                                          onClick = {
                                              if (e.isDirectory) currentPath = e.name
                                              else scope.launch {
                                                  val cacheDir = File(context.cacheDir, "zip_extract")
                                                  val outFile = withContext(Dispatchers.IO) {
                                                      ArchiveEngine.extractEntry(item.file, item.extension, e.name, cacheDir)
                                                  }
                                                  if (outFile == null) {
                                                      Toast.makeText(context, "无法解压此条目", Toast.LENGTH_SHORT).show()
                                                      return@launch
                                                  }
                                                  val ext = outFile.name.substringAfterLast('.', "").lowercase(Locale.ROOT)
                                                  val type = mimeOf(ext)
                                                  try {
                                                      val uri = FileProvider.getUriForFile(context, context.packageName + ".fileprovider", outFile)
                                                      val intent = Intent(Intent.ACTION_VIEW).apply {
                                                          setDataAndType(uri, type)
                                                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                                      }
                                                      context.startActivity(intent)
                                                  } catch (e3: Exception) {
                                                      Toast.makeText(context, "无法打开：" + (e3.message ?: ""), Toast.LENGTH_SHORT).show()
                                                  }
                                              }
                                          },
                                          onLongClick = { editTarget = e }
                                      )
                                      .padding(horizontal = 20.dp, vertical = 10.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Icon(if (e.isDirectory) Icons.Filled.Folder else Icons.Filled.InsertDriveFile,
                                      null, modifier = Modifier.size(22.dp),
                                      tint = MaterialTheme.colorScheme.onSurfaceVariant)
                                  Spacer(Modifier.width(12.dp))
                                  Column(Modifier.weight(1f)) {
                                      val displayName = if (currentPath.isEmpty()) e.name else e.name.removePrefix(currentPath)
                                      Text(displayName.trimEnd('/'),
                                          fontFamily = FontFamily.Monospace, fontSize = 13.sp, maxLines = 1,
                                          overflow = TextOverflow.Ellipsis,
                                          color = MaterialTheme.colorScheme.onSurface,
                                          fontWeight = if (e.isDirectory) FontWeight.Medium else FontWeight.Normal)
                                      if (!e.isDirectory) Text(humanSize(e.size), fontSize = 11.sp,
                                          color = MaterialTheme.colorScheme.onSurfaceVariant)
                                  }
                                  if (e.isDirectory) {
                                      Icon(Icons.Filled.ChevronRight, null,
                                          tint = MaterialTheme.colorScheme.outline, modifier = Modifier.size(20.dp))
                                  }
                                  IconButton(onClick = { editTarget = e }) {
                                      Icon(Icons.Filled.MoreVert, "更多", tint = MaterialTheme.colorScheme.onSurfaceVariant)
                                  }
                              }
                          }
                      }
                  }
              }

              val t = editTarget
              if (t != null) {
                  val shortName = t.name.trimEnd('/').substringAfterLast('/')
                  ActionSheet(
                      title = shortName,
                      subtitle = if (t.isDirectory) "压缩包内目录" else humanSize(t.size),
                      actions = buildList {
                          if (!t.isDirectory) {
                              add(SheetAction(Icons.Filled.FolderOpen, "用其他应用打开") {
                                  scope.launch {
                                      val cacheDir = File(context.cacheDir, "zip_extract")
                                      val outFile = withContext(Dispatchers.IO) {
                                          ArchiveEngine.extractEntry(item.file, item.extension, t.name, cacheDir)
                                      }
                                      if (outFile != null) {
                                          val ext = outFile.name.substringAfterLast('.', "").lowercase(Locale.ROOT)
                                          val type = mimeOf(ext)
                                          try {
                                              val uri = FileProvider.getUriForFile(context, context.packageName + ".fileprovider", outFile)
                                              val intent = Intent(Intent.ACTION_VIEW).apply {
                                                  setDataAndType(uri, type)
                                                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                              }
                                              context.startActivity(intent)
                                          } catch (_: Exception) {}
                                      }
                                  }
                              })
                              add(SheetAction(Icons.Filled.Save, "解压到当前目录") {
                                  scope.launch {
                                      busy = true
                                      val target = item.file.parentFile ?: return@launch
                                      val count = withContext(Dispatchers.IO) {
                                          ArchiveEngine.extractAll(item.file, item.extension, target, t.name)
                                      }
                                      busy = false
                                      vm.showSnack("已解压 " + count + " 个文件")
                                  }
                              })
                          } else {
                              add(SheetAction(Icons.Filled.Save, "解压此目录到当前目录") {
                                  scope.launch {
                                      busy = true
                                      val target = item.file.parentFile ?: return@launch
                                      val count = withContext(Dispatchers.IO) {
                                          ArchiveEngine.extractAll(item.file, item.extension, target, t.name)
                                      }
                                      busy = false
                                      vm.showSnack("已解压 " + count + " 个文件")
                                  }
                              })
                          }
                          if (editable) {
                              add(SheetAction(Icons.Filled.Edit, "重命名") { renameTarget = t })
                              add(SheetAction(Icons.Filled.Delete, "从压缩包删除", destructive = true) {
                                  scope.launch {
                                      busy = true
                                      val ok = withContext(Dispatchers.IO) {
                                          vm.zipDeleteEntry(item.file, t.name, t.isDirectory)
                                      }
                                      busy = false
                                      if (ok) { vm.showSnack("已从压缩包删除"); reloadKey++ }
                                      else vm.showSnack("删除失败")
                                  }
                              })
                          }
                      },
                      onDismiss = { editTarget = null }
                  )
              }

              val rt = renameTarget
              if (rt != null) {
                  val shortName = rt.name.trimEnd('/').substringAfterLast('/')
                  TextInputDialog(
                      title = "重命名压缩包内条目",
                      initial = shortName,
                      label = "新名称",
                      onConfirm = { newShort ->
                          val prefix = rt.name.substringBeforeLast('/', "")
                          val newName = if (prefix.isEmpty()) {
                              if (rt.isDirectory) "$newShort/" else newShort
                          } else {
                              if (rt.isDirectory) "$prefix/$newShort/" else "$prefix/$newShort"
                          }
                          scope.launch {
                              busy = true
                              val ok = withContext(Dispatchers.IO) {
                                  vm.zipRenameEntry(item.file, rt.name, newName, rt.isDirectory)
                              }
                              busy = false
                              if (ok) { vm.showSnack("已重命名"); reloadKey++ }
                              else vm.showSnack("重命名失败")
                          }
                      },
                      onDismiss = { renameTarget = null }
                  )
              }

              if (showNewFolder) {
                  TextInputDialog(
                      title = "在压缩包内新建文件夹",
                      initial = "new_folder",
                      label = "文件夹名",
                      onConfirm = { name ->
                          val full = currentPath + name + "/"
                          scope.launch {
                              busy = true
                              val ok = withContext(Dispatchers.IO) {
                                  vm.zipAddFolder(item.file, full)
                              }
                              busy = false
                              if (ok) { vm.showSnack("已创建文件夹"); reloadKey++ }
                              else vm.showSnack("创建失败")
                          }
                      },
                      onDismiss = { showNewFolder = false }
                  )
              }
          }

          private fun buildZipDisplayItems(all: List<ZipEntryInfo>, currentPath: String): List<ZipEntryInfo> {
              if (currentPath.isEmpty()) {
                  val seenDirs = HashSet<String>()
                  val out = ArrayList<ZipEntryInfo>()
                  for (e in all) {
                      val name = e.name
                      val slash = name.indexOf('/')
                      if (slash < 0) out.add(e)
                      else {
                          val dir = name.substring(0, slash + 1)
                          if (seenDirs.add(dir)) out.add(ZipEntryInfo(dir, 0L, true))
                      }
                  }
                  return out.sortedWith(compareBy({ !it.isDirectory }, { it.name.lowercase() }))
              }
              val prefixLen = currentPath.length
              val seenDirs = HashSet<String>()
              val out = ArrayList<ZipEntryInfo>()
              for (e in all) {
                  if (!e.name.startsWith(currentPath)) continue
                  if (e.name == currentPath) continue
                  val rel = e.name.substring(prefixLen)
                  if (rel.isEmpty()) continue
                  val slash = rel.indexOf('/')
                  if (slash < 0) out.add(e)
                  else {
                      val dirRel = rel.substring(0, slash + 1)
                      val full = currentPath + dirRel
                      if (seenDirs.add(full)) out.add(ZipEntryInfo(full, 0L, true))
                  }
              }
              return out.sortedWith(compareBy({ !it.isDirectory }, { it.name.lowercase() }))
          }

