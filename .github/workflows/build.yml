          @Composable
          fun MD3Theme(content: @Composable () -> Unit) {
              val dark = isSystemInDarkTheme()
              MaterialTheme(
                  colorScheme = if (dark) DarkColors else LightColors,
                  content = content
              )
          }

          enum class FileKind { FOLDER, IMAGE, VIDEO, AUDIO, ARCHIVE, CODE, PDF, FILE }

          data class FileItem(
              val path: String,
              val name: String,
              val isDirectory: Boolean,
              val size: Long,
              val lastModified: Long
          ) {
              val file: File get() = File(path)
              val extension: String
                  get() = if (isDirectory || !name.contains('.')) ""
                  else name.substringAfterLast('.').lowercase(Locale.ROOT)
              val kind: FileKind
                  get() = when {
                      isDirectory -> FileKind.FOLDER
                      extension in setOf("jpg","jpeg","png","gif","webp","bmp","svg","ico","heic","avif") -> FileKind.IMAGE
                      extension in setOf("mp4","mkv","mov","avi","webm","flv","m4v","wmv") -> FileKind.VIDEO
                      extension in setOf("mp3","wav","flac","aac","ogg","m4a","wma","opus") -> FileKind.AUDIO
                      extension in setOf("zip","rar","7z","tar","gz","bz2","xz","iso") -> FileKind.ARCHIVE
                      extension in setOf("txt","md","json","xml","yml","yaml","js","ts","jsx","tsx",
                          "html","css","scss","less","kt","kts","java","py","c","cpp","h","hpp",
                          "cs","go","rs","rb","php","swift","sh","bat","ps1","sql",
                          "gradle","properties","ini","conf","log","toml","csv") -> FileKind.CODE
                      extension == "pdf" -> FileKind.PDF
                      else -> FileKind.FILE
                  }
          }

          fun File.toItem() = FileItem(absolutePath, name, isDirectory,
              if (isDirectory) 0L else length(), lastModified())

          fun Long.humanSize(): String {
              if (this < 1024) return "$this B"
              val units = arrayOf("KB","MB","GB","TB")
              var v = this.toDouble() / 1024
              var i = -1
              while (v >= 1024 && i < units.size - 1) { v /= 1024; i++ }
              return String.format(Locale.US, if (v < 10) "%.1f %s" else "%.0f %s", v, units[i])
          }

          enum class Tab { FILES, RECENT, STARRED, SETTINGS }
          enum class SortKey { NAME, SIZE, MTIME }
          enum class ClipMode { COPY, CUT }
          data class ClipData(val mode: ClipMode, val path: String)

          class FileManagerViewModel(app: Application) : AndroidViewModel(app) {
              private val prefs = app.getSharedPreferences("fm_md3", 0)

              var currentDir by mutableStateOf(resolveRoot(app))
                  private set
              var items by mutableStateOf<List<FileItem>>(emptyList())
                  private set
              var recentItems by mutableStateOf<List<FileItem>>(emptyList())
                  private set
              var starredItems by mutableStateOf<List<FileItem>>(emptyList())
                  private set

              var currentTab by mutableStateOf(Tab.FILES)
              var gridMode by mutableStateOf(prefs.getBoolean("grid", false))
              var sortKey by mutableStateOf(runCatching { SortKey.valueOf(prefs.getString("sort","NAME")!!) }.getOrDefault(SortKey.NAME))
              var showHidden by mutableStateOf(prefs.getBoolean("hidden", false))
              var searchQuery by mutableStateOf("")
              var searchMode by mutableStateOf(false)
              var clipboard by mutableStateOf<ClipData?>(null)
              var starredPaths by mutableStateOf(prefs.getStringSet("starred", emptySet()) ?: emptySet())
                  private set
              var snackMessage by mutableStateOf<String?>(null)

              init {
                  prefs.getString("lastDir", null)?.let {
                      val f = File(it)
                      if (f.exists() && f.isDirectory && f.canRead()) currentDir = f
                  }
                  refresh(); refreshRecent(); refreshStarred()
              }

              private fun resolveRoot(app: Application): File {
                  val ext = Environment.getExternalStorageDirectory()
                  return if (ext.exists() && ext.canRead()) ext
                  else app.getExternalFilesDir(null) ?: app.filesDir
              }

              fun refresh() {
                  val list = try { currentDir.listFiles()?.toList() ?: emptyList() } catch (_: Exception) { emptyList() }
                  val filtered = list.filter { showHidden || !it.name.startsWith(".") }.map { it.toItem() }
                  items = sortList(filtered)
              }

              fun refreshRecent() {
                  val recent = prefs.getString("recent", "")?.split('\n')?.filter { it.isNotBlank() } ?: emptyList()
                  recentItems = recent.mapNotNull { File(it).takeIf { f -> f.exists() }?.toItem() }
              }

              fun refreshStarred() {
                  starredItems = starredPaths.mapNotNull { File(it).takeIf { f -> f.exists() }?.toItem() }
              }

              private fun sortList(list: List<FileItem>) = list.sortedWith(
                  when (sortKey) {
                      SortKey.NAME -> compareBy<FileItem> { !it.isDirectory }.thenBy(String.CASE_INSENSITIVE_ORDER) { it.name }
                      SortKey.SIZE -> compareBy<FileItem> { !it.isDirectory }.thenBy { it.size }
                      SortKey.MTIME -> compareBy<FileItem> { !it.isDirectory }.thenByDescending { it.lastModified }
                  }
              )

              fun open(item: FileItem) {
                  if (item.isDirectory) {
                      if (!item.file.canRead()) { showSnack("无法访问"); return }
                      currentDir = item.file
                      searchQuery = ""; searchMode = false
                      prefs.edit().putString("lastDir", item.path).apply()
                      refresh()
                  } else {
                      val list = (prefs.getString("recent","")?.split('\n')?.filter{it.isNotBlank()} ?: emptyList())
                          .toMutableList().apply { remove(item.path); add(0, item.path) }
                      prefs.edit().putString("recent", list.take(50).joinToString("\n")).apply()
                      refreshRecent()
                  }
              }

              fun navigateTo(dir: File) {
                  if (!dir.isDirectory || !dir.canRead()) { showSnack("无法访问"); return }
                  currentDir = dir; searchQuery = ""; searchMode = false
                  prefs.edit().putString("lastDir", dir.absolutePath).apply()
                  refresh()
              }

              fun goUp(): Boolean {
                  val p = currentDir.parentFile ?: return false
                  if (!p.canRead()) return false
                  navigateTo(p); return true
              }

              fun breadcrumbs(): List<File> {
                  val list = ArrayList<File>()
                  var f: File? = currentDir
                  while (f != null) { list.add(0, f); f = f.parentFile }
                  return list
              }

              fun doSearch(q: String) {
                  searchQuery = q
                  if (q.isBlank()) { refresh(); return }
                  val results = ArrayList<FileItem>()
                  val stack = ArrayDeque<File>().apply { add(currentDir) }
                  val lower = q.lowercase()
                  while (stack.isNotEmpty() && results.size < 300) {
                      val dir = stack.removeFirst()
                      val children = try { dir.listFiles() } catch (_: Exception) { null } ?: continue
                      for (c in children) {
                          if (c.name.startsWith(".")) continue
                          if (c.name.lowercase().contains(lower)) results.add(c.toItem())
                          if (c.isDirectory) stack.add(c)
                      }
                  }
                  items = sortList(results)
              }

              fun exitSearch() { searchQuery = ""; searchMode = false; refresh() }

              fun createFolder(name: String) {
                  if (name.isBlank()) return
                  if (File(currentDir, name).mkdirs()) { refresh(); showSnack("已创建「$name」") }
                  else showSnack("创建失败")
              }

              fun createFile(name: String) {
                  if (name.isBlank()) return
                  try {
                      if (File(currentDir, name).createNewFile()) { refresh(); showSnack("已创建「$name」") }
                      else showSnack("创建失败")
                  } catch (_: Exception) { showSnack("创建失败") }
              }

              fun rename(item: FileItem, newName: String) {
                  if (newName.isBlank() || newName == item.name) return
                  val dest = File(item.file.parentFile, newName)
                  if (dest.exists()) { showSnack("已存在同名项目"); return }
                  if (item.file.renameTo(dest)) {
                      if (starredPaths.contains(item.path)) {
                          starredPaths = starredPaths - item.path + dest.absolutePath
                          prefs.edit().putStringSet("starred", starredPaths).apply()
                      }
                      refresh(); refreshStarred(); refreshRecent(); showSnack("已重命名")
                  } else showSnack("重命名失败")
              }

              fun delete(item: FileItem) {
                  val ok = if (item.isDirectory) item.file.deleteRecursively() else item.file.delete()
                  if (ok) {
                      starredPaths = starredPaths - item.path
                      prefs.edit().putStringSet("starred", starredPaths).apply()
                      if (clipboard?.path == item.path) clipboard = null
                      refresh(); refreshStarred(); refreshRecent(); showSnack("已删除")
                  } else showSnack("删除失败")
              }

              fun copy(item: FileItem) { clipboard = ClipData(ClipMode.COPY, item.path); showSnack("已复制") }
              fun cut(item: FileItem) { clipboard = ClipData(ClipMode.CUT, item.path); showSnack("已剪切") }

              fun pasteInto(target: File = currentDir) {
                  val cb = clipboard ?: return
                  val src = File(cb.path)
                  if (!src.exists()) { clipboard = null; showSnack("源文件不存在"); return }
                  if (src.isDirectory && target.absolutePath.startsWith(src.absolutePath + "/")) {
                      showSnack("不能移动到自身子目录"); return
                  }
                  val dest = uniqueFile(target, src.name)
                  val ok = try {
                      if (cb.mode == ClipMode.CUT) {
                          if (src.renameTo(dest)) true
                          else { val c = copyRec(src, dest); if (c) src.deleteRecursively(); c }
                      } else copyRec(src, dest)
                  } catch (_: Exception) { false }
                  if (ok) {
                      clipboard = null
                      refresh(); refreshStarred(); refreshRecent(); showSnack("已粘贴")
                  } else showSnack("粘贴失败")
              }

              private fun copyRec(src: File, dest: File): Boolean = try {
                  if (src.isDirectory) src.copyRecursively(dest, overwrite = false)
                  else { dest.parentFile?.mkdirs(); src.copyTo(dest, overwrite = false) }
                  true
              } catch (_: Exception) { false }

              private fun uniqueFile(dir: File, name: String): File {
                  var f = File(dir, name)
                  if (!f.exists()) return f
                  val dot = name.lastIndexOf('.')
                  val stem = if (dot > 0) name.substring(0, dot) else name
                  val ext = if (dot > 0) name.substring(dot) else ""
                  var i = 1
                  while (f.exists()) { f = File(dir, "$stem ($i)$ext"); i++ }
                  return f
              }

              fun toggleStar(item: FileItem) {
                  starredPaths = if (starredPaths.contains(item.path)) starredPaths - item.path
                                 else starredPaths + item.path
                  prefs.edit().putStringSet("starred", starredPaths).apply()
                  refreshStarred(); refresh()
                  showSnack(if (starredPaths.contains(item.path)) "已收藏" else "已取消收藏")
              }

              fun isStarred(path: String) = starredPaths.contains(path)

              fun setGrid(g: Boolean) { gridMode = g; prefs.edit().putBoolean("grid", g).apply() }
              fun setSort(k: SortKey) { sortKey = k; prefs.edit().putString("sort", k.name).apply(); refresh() }
              fun setShowHidden(s: Boolean) { showHidden = s; prefs.edit().putBoolean("hidden", s).apply(); refresh() }

              fun showSnack(m: String) { snackMessage = m }
              fun consumeSnack() { snackMessage = null }
          }

          private fun iconFor(kind: FileKind): ImageVector = when (kind) {
              FileKind.FOLDER -> Icons.Filled.Folder
              FileKind.IMAGE -> Icons.Filled.Image
              FileKind.VIDEO -> Icons.Filled.Movie
              FileKind.AUDIO -> Icons.Filled.MusicNote
              FileKind.ARCHIVE -> Icons.Filled.Folder
              FileKind.CODE -> Icons.Filled.InsertDriveFile
              FileKind.PDF -> Icons.Filled.PictureAsPdf
              FileKind.FILE -> Icons.Filled.InsertDriveFile
          }

          private fun iconBg(kind: FileKind, dark: Boolean): Pair<Color, Color> = when (kind) {
              FileKind.FOLDER -> if (dark) Color(0xFF4F378B) to Color(0xFFEADDFF) else Color(0xFFEADDFF) to Color(0xFF21005D)
              FileKind.IMAGE -> if (dark) Color(0xFF1E4A36) to Color(0xFFA8E9C8) else Color(0xFFD7F2E3) to Color(0xFF0A5236)
              FileKind.VIDEO -> if (dark) Color(0xFF3A2F7A) to Color(0xFFD6CDFF) else Color(0xFFE5E0FF) to Color(0xFF3A2F7A)
              FileKind.AUDIO -> if (dark) Color(0xFF7A2A47) to Color(0xFFFFD0DE) else Color(0xFFFFE0E9) to Color(0xFF7A2A47)
              FileKind.ARCHIVE -> if (dark) Color(0xFF6B4A00) to Color(0xFFFFE0A3) else Color(0xFFFFEBC7) to Color(0xFF6B4A00)
              FileKind.CODE -> if (dark) Color(0xFF14395F) to Color(0xFFC6E0FF) else Color(0xFFD7E9FF) to Color(0xFF14395F)
              FileKind.PDF -> if (dark) Color(0xFF7A1B14) to Color(0xFFFFDAD6) else Color(0xFFFFDAD6) to Color(0xFF7A1B14)
              FileKind.FILE -> if (dark) Color(0xFF3A383E) to Color(0xFFCAC4D0) else Color(0xFFE7E0EC) to Color(0xFF49454F)
          }

          @Composable
          fun FileIconBadge(item: FileItem, size: Int = 44) {
              val dark = MaterialTheme.colorScheme.background.luminance() < 0.5f
              val (bg, fg) = iconBg(item.kind, dark)
              Box(
                  modifier = Modifier.size(size.dp)
                      .clip(RoundedCornerShape((size / 3).dp))
                      .background(bg),
                  contentAlignment = Alignment.Center
              ) {
                  Icon(iconFor(item.kind), null, tint = fg,
                      modifier = Modifier.size((size * 0.56).dp))
              }
          }

          private fun Color.luminance() = 0.299f * red + 0.587f * green + 0.114f * blue

          private val dateFmt = SimpleDateFormat("yyyy-MM-dd HH:mm", Locale.getDefault())

          private fun subtitleOf(item: FileItem): String = if (item.isDirectory) {
              "文件夹 · ${dateFmt.format(Date(item.lastModified))}"
          } else {
              val t = when (item.kind) {
                  FileKind.IMAGE -> "图片"; FileKind.VIDEO -> "视频"; FileKind.AUDIO -> "音频"
                  FileKind.ARCHIVE -> "压缩包"; FileKind.CODE -> "文本"; FileKind.PDF -> "PDF"
                  else -> "文件"
              }
              "$t · ${item.size.humanSize()} · ${dateFmt.format(Date(item.lastModified))}"
          }

          @OptIn(ExperimentalFoundationApi::class)
          @Composable
          fun FileRow(item: FileItem, starred: Boolean, onClick: () -> Unit, onMenu: () -> Unit) {
              Row(
                  modifier = Modifier.fillMaxWidth()
                      .clip(RoundedCornerShape(20.dp))
                      .combinedClickable(onClick = onClick, onLongClick = onMenu)
                      .padding(horizontal = 12.dp, vertical = 10.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  FileIconBadge(item)
                  Spacer(Modifier.width(12.dp))
                  Column(Modifier.weight(1f)) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Text(item.name, style = MaterialTheme.typography.bodyLarge,
                              fontWeight = FontWeight.Medium, maxLines = 1,
                              overflow = TextOverflow.Ellipsis,
                              modifier = Modifier.weight(1f, fill = false))
                          if (starred) {
                              Spacer(Modifier.width(6.dp))
                              Icon(Icons.Filled.Star, null, tint = MaterialTheme.colorScheme.primary,
                                  modifier = Modifier.size(16.dp))
                          }
                      }
                      Spacer(Modifier.height(2.dp))
                      Text(subtitleOf(item), style = MaterialTheme.typography.labelMedium,
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                          maxLines = 1, overflow = TextOverflow.Ellipsis)
                  }
                  IconButton(onClick = onMenu) {
                      Icon(Icons.Filled.MoreVert, "更多",
                          tint = MaterialTheme.colorScheme.onSurfaceVariant)
                  }
              }
          }

          @Composable
          fun FileCard(item: FileItem, onMenu: () -> Unit, onClick: () -> Unit) {
              Card(onClick = onClick, modifier = Modifier.fillMaxWidth(),
                  shape = RoundedCornerShape(20.dp),
                  colors = CardDefaults.cardColors(
                      containerColor = MaterialTheme.colorScheme.surfaceContainerLow)) {
                  Column(Modifier.fillMaxWidth().padding(horizontal = 8.dp, vertical = 14.dp),
                      horizontalAlignment = Alignment.CenterHorizontally) {
                      Box(Modifier.fillMaxWidth()) {
                          Box(Modifier.align(Alignment.Center)) { FileIconBadge(item, 52) }
                          IconButton(onClick = onMenu,
                              modifier = Modifier.align(Alignment.TopEnd).size(30.dp)) {
                              Icon(Icons.Filled.MoreVert, "更多",
                                  modifier = Modifier.size(18.dp),
                                  tint = MaterialTheme.colorScheme.onSurfaceVariant)
                          }
                      }
                      Spacer(Modifier.height(8.dp))
                      Text(item.name, style = MaterialTheme.typography.labelMedium,
                          maxLines = 2, overflow = TextOverflow.Ellipsis,
                          color = MaterialTheme.colorScheme.onSurface)
                  }
              }
          }

          @Composable
          fun FileList(items: List<FileItem>, isStarred: (String) -> Boolean,
                       onOpen: (FileItem) -> Unit, onMenu: (FileItem) -> Unit,
                       grid: Boolean) {
              if (grid) {
                  LazyVerticalGrid(
                      columns = GridCells.Adaptive(108.dp),
                      modifier = Modifier.fillMaxSize(),
                      contentPadding = PaddingValues(start = 12.dp, end = 12.dp, top = 4.dp, bottom = 180.dp),
                      horizontalArrangement = Arrangement.spacedBy(8.dp),
                      verticalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      items(items.size, key = { items[it].path }) { idx ->
                          val it = items[idx]
                          FileCard(it, onMenu = { onMenu(it) }, onClick = { onOpen(it) })
                      }
                  }
              } else {
                  LazyColumn(
                      modifier = Modifier.fillMaxSize(),
                      contentPadding = PaddingValues(start = 8.dp, end = 8.dp, top = 4.dp, bottom = 180.dp)
                  ) {
                      items(items.size, key = { items[it].path }) { idx ->
                          val it = items[idx]
                          FileRow(it, isStarred(it.path),
                              onClick = { onOpen(it) }, onMenu = { onMenu(it) })
                      }
                  }
              }
          }

          data class NavEntry(val icon: ImageVector, val label: String)

          @Composable
          fun FloatingNavBar(items: List<NavEntry>, selectedIndex: Int, onSelect: (Int) -> Unit, modifier: Modifier = Modifier) {
              Surface(modifier = modifier, shape = RoundedCornerShape(28.dp),
                  color = MaterialTheme.colorScheme.surfaceContainer,
                  tonalElevation = 3.dp, shadowElevation = 8.dp) {
                  Row(Modifier.padding(horizontal = 8.dp, vertical = 8.dp),
                      horizontalArrangement = Arrangement.spacedBy(2.dp),
                      verticalAlignment = Alignment.CenterVertically) {
                      items.forEachIndexed { i, it ->
                          val sel = i == selectedIndex
                          Column(
                              modifier = Modifier.clip(RoundedCornerShape(20.dp))
                                  .clickable { onSelect(i) }
                                  .padding(horizontal = 4.dp, vertical = 4.dp),
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              Box(
                                  modifier = Modifier
                                      .width(if (sel) 60.dp else 44.dp)
                                      .height(30.dp)
                                      .clip(RoundedCornerShape(15.dp))
                                      .background(if (sel) MaterialTheme.colorScheme.secondaryContainer
                                                  else Color.Transparent),
                                  contentAlignment = Alignment.Center
                              ) {
                                  Icon(it.icon, it.label,
                                      tint = if (sel) MaterialTheme.colorScheme.onSecondaryContainer
                                             else MaterialTheme.colorScheme.onSurfaceVariant,
                                      modifier = Modifier.size(22.dp))
                              }
                              Spacer(Modifier.height(2.dp))
                              Text(it.label, style = MaterialTheme.typography.labelSmall,
                                  color = if (sel) MaterialTheme.colorScheme.onSurface
                                          else MaterialTheme.colorScheme.onSurfaceVariant)
                          }
                      }
                  }
              }
          }

          data class SheetAction(val icon: ImageVector, val label: String,
                                 val destructive: Boolean = false, val enabled: Boolean = true,
                                 val onClick: () -> Unit)

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun ActionSheet(title: String, subtitle: String? = null,
                          actions: List<SheetAction>, onDismiss: () -> Unit) {
              val sheetState = rememberModalBottomSheetState(skipPartiallyExpanded = true)
              ModalBottomSheet(onDismissRequest = onDismiss, sheetState = sheetState,
                  containerColor = MaterialTheme.colorScheme.surfaceContainerLow) {
                  Column(Modifier.padding(bottom = 24.dp)) {
                      Column(Modifier.padding(horizontal = 24.dp, vertical = 8.dp)) {
                          Text(title, style = MaterialTheme.typography.titleMedium)
                          if (subtitle != null) {
                              Spacer(Modifier.height(2.dp))
                              Text(subtitle, style = MaterialTheme.typography.bodyMedium,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant)
                          }
                      }
                      Spacer(Modifier.height(8.dp))
                      actions.forEach { a ->
                          ListItem(
                              headlineContent = {
                                  Text(a.label, color = if (a.destructive) MaterialTheme.colorScheme.error
                                                        else MaterialTheme.colorScheme.onSurface)
                              },
                              leadingContent = {
                                  Icon(a.icon, null,
                                      tint = if (a.destructive) MaterialTheme.colorScheme.error
                                             else MaterialTheme.colorScheme.onSurfaceVariant)
                              },
                              modifier = Modifier.fillMaxWidth()
                                  .clickable(enabled = a.enabled) { a.onClick(); onDismiss() }
                                  .padding(horizontal = 8.dp)
                          )
                      }
                  }
              }
          }

          @Composable
          fun TextInputDialog(title: String, initial: String = "", label: String = "名称",
                              confirmText: String = "确定",
                              onConfirm: (String) -> Unit, onDismiss: () -> Unit) {
              var value by remember { mutableStateOf(initial) }
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text(title) },
                  text = {
                      OutlinedTextField(value = value, onValueChange = { value = it },
                          label = { Text(label) }, singleLine = true,
                          modifier = Modifier.fillMaxWidth(),
                          keyboardOptions = KeyboardOptions(imeAction = ImeAction.Done),
                          keyboardActions = KeyboardActions(onDone = {
                              if (value.isNotBlank()) { onConfirm(value.trim()); onDismiss() }
                          }))
                  },
                  confirmButton = {
                      TextButton(onClick = {
                          if (value.isNotBlank()) { onConfirm(value.trim()); onDismiss() }
                      }) { Text(confirmText) }
                  },
                  dismissButton = { TextButton(onClick = onDismiss) { Text("取消") } }
              )
          }

          @Composable
          fun ConfirmDialog(title: String, message: String, confirmText: String = "确定",
                            destructive: Boolean = false,
                            onConfirm: () -> Unit, onDismiss: () -> Unit) {
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text(title) },
                  text = { Text(message) },
                  confirmButton = {
                      TextButton(onClick = { onConfirm(); onDismiss() }) {
                          Text(confirmText, color = if (destructive) MaterialTheme.colorScheme.error
                                                   else MaterialTheme.colorScheme.primary)
                      }
                  },
                  dismissButton = { TextButton(onClick = onDismiss) { Text("取消") } }
              )
          }

          private val navItems = listOf(
              NavEntry(Icons.Filled.Folder, "文件"),
              NavEntry(Icons.Filled.Schedule, "最近"),
              NavEntry(Icons.Filled.Star, "收藏"),
              NavEntry(Icons.Filled.Settings, "设置")
          )

          private sealed interface UiSheet {
              data object NewMenu : UiSheet
              data class ItemMenu(val item: FileItem) : UiSheet
          }

          private sealed interface UiDialog {
              data object NewFolder : UiDialog
              data object NewFile : UiDialog
              data class Rename(val item: FileItem) : UiDialog
              data class Delete(val item: FileItem) : UiDialog
          }

          private fun hasPermission(): Boolean {
              return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                  Environment.isExternalStorageManager()
              } else true
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun FileManagerScreen(vm: FileManagerViewModel = viewModel()) {
              val ctx = LocalContext.current
              var granted by remember { mutableStateOf(hasPermission()) }

              val settingsLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { granted = hasPermission() }

              LaunchedEffect(Unit) { granted = hasPermission() }

              if (!granted) {
                  Column(Modifier.fillMaxSize().padding(32.dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.Center) {
                      Icon(Icons.Filled.Folder, null,
                          modifier = Modifier.size(80.dp),
                          tint = MaterialTheme.colorScheme.primary)
                      Spacer(Modifier.height(24.dp))
                      Text("需要存储访问权限", style = MaterialTheme.typography.titleLarge,
                          fontWeight = FontWeight.Medium)
                      Spacer(Modifier.height(8.dp))
                      Text("请授予「所有文件访问权限」以管理设备文件",
                          style = MaterialTheme.typography.bodyMedium,
                          color = MaterialTheme.colorScheme.onSurfaceVariant)
                      Spacer(Modifier.height(24.dp))
                      Surface(onClick = {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                              try {
                                  settingsLauncher.launch(
                                      Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION)
                                          .setData(Uri.parse("package:${ctx.packageName}"))
                                  )
                              } catch (_: Exception) {
                                  settingsLauncher.launch(
                                      Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION)
                                  )
                              }
                          }
                      }, shape = RoundedCornerShape(20.dp),
                          color = MaterialTheme.colorScheme.primary) {
                          Text("去授权",
                              color = MaterialTheme.colorScheme.onPrimary,
                              style = MaterialTheme.typography.labelLarge,
                              modifier = Modifier.padding(horizontal = 24.dp, vertical = 12.dp))
                      }
                  }
                  return
              }

              val snackbar = remember { SnackbarHostState() }
              LaunchedEffect(vm.snackMessage) {
                  vm.snackMessage?.let { snackbar.showSnackbar(it); vm.consumeSnack() }
              }

              var sheet by remember { mutableStateOf<UiSheet?>(null) }
              var dialog by remember { mutableStateOf<UiDialog?>(null) }

              Scaffold(
                  containerColor = MaterialTheme.colorScheme.background,
                  snackbarHost = { SnackbarHost(snackbar) },
                  topBar = {
                      Surface(color = MaterialTheme.colorScheme.background) {
                          Column(Modifier.statusBarsPadding()) {
                              Row(Modifier.fillMaxWidth().height(64.dp).padding(horizontal = 4.dp),
                                  verticalAlignment = Alignment.CenterVertically) {
                                  when (vm.currentTab) {
                                      Tab.FILES -> {
                                          if (vm.searchMode) {
                                              IconButton(onClick = { vm.exitSearch() }) {
                                                  Icon(Icons.Filled.ArrowBack, "返回")
                                              }
                                              BasicTextField(
                                                  value = vm.searchQuery,
                                                  onValueChange = { vm.doSearch(it) },
                                                  modifier = Modifier.weight(1f),
                                                  textStyle = TextStyle(
                                                      color = MaterialTheme.colorScheme.onSurface,
                                                      fontSize = MaterialTheme.typography.bodyLarge.fontSize),
                                                  singleLine = true,
                                                  cursorBrush = SolidColor(MaterialTheme.colorScheme.primary),
                                                  keyboardOptions = KeyboardOptions(imeAction = ImeAction.Search),
                                                  decorationBox = { inner ->
                                                      Box {
                                                          if (vm.searchQuery.isEmpty()) Text("搜索当前目录…",
                                                              color = MaterialTheme.colorScheme.onSurfaceVariant)
                                                          inner()
                                                      }
                                                  }
                                              )
                                              IconButton(onClick = { vm.exitSearch() }) {
                                                  Icon(Icons.Filled.Close, "关闭")
                                              }
                                          } else {
                                              val canUp = vm.currentDir.parentFile != null
                                              IconButton(onClick = { vm.goUp() }, enabled = canUp) {
                                                  Icon(Icons.Filled.ArrowBack, "返回",
                                                      tint = if (canUp) MaterialTheme.colorScheme.onSurface
                                                             else MaterialTheme.colorScheme.onSurfaceVariant)
                                              }
                                              Text(vm.currentDir.name.ifEmpty { "存储" },
                                                  style = MaterialTheme.typography.titleLarge,
                                                  fontWeight = FontWeight.Medium,
                                                  maxLines = 1, overflow = TextOverflow.Ellipsis,
                                                  modifier = Modifier.weight(1f).padding(horizontal = 4.dp))
                                              IconButton(onClick = { vm.searchMode = true }) {
                                                  Icon(Icons.Filled.Search, "搜索")
                                              }
                                              IconButton(onClick = { vm.setGrid(!vm.gridMode) }) {
                                                  Icon(if (vm.gridMode) Icons.Filled.ViewList else Icons.Filled.GridView, "切换视图")
                                              }
                                          }
                                      }
                                      else -> Text(
                                          when (vm.currentTab) {
                                              Tab.RECENT -> "最近"; Tab.STARRED -> "收藏"; else -> "设置"
                                          },
                                          style = MaterialTheme.typography.titleLarge,
                                          fontWeight = FontWeight.Medium,
                                          modifier = Modifier.weight(1f).padding(horizontal = 16.dp))
                                  }
                              }
                              if (vm.currentTab == Tab.FILES && !vm.searchMode) {
                                  Row(Modifier.fillMaxWidth()
                                      .horizontalScroll(rememberScrollState())
                                      .padding(horizontal = 12.dp, vertical = 4.dp),
                                      verticalAlignment = Alignment.CenterVertically) {
                                      val crumbs = vm.breadcrumbs()
                                      crumbs.forEachIndexed { i, f ->
                                          val last = i == crumbs.lastIndex
                                          Surface(onClick = { vm.navigateTo(f) },
                                              shape = RoundedCornerShape(16.dp),
                                              color = if (last) MaterialTheme.colorScheme.secondaryContainer
                                                      else MaterialTheme.colorScheme.surface) {
                                              Text(if (f.name.isEmpty()) "存储" else f.name,
                                                  style = MaterialTheme.typography.labelMedium,
                                                  color = if (last) MaterialTheme.colorScheme.onSecondaryContainer
                                                          else MaterialTheme.colorScheme.onSurfaceVariant,
                                                  modifier = Modifier.padding(horizontal = 10.dp, vertical = 6.dp))
                                          }
                                          if (!last) Icon(Icons.Filled.ChevronRight, null,
                                              tint = MaterialTheme.colorScheme.outline,
                                              modifier = Modifier.size(16.dp))
                                      }
                                  }
                              }
                          }
                      }
                  },
                  floatingActionButton = {
                      if (vm.currentTab != Tab.SETTINGS) {
                          FloatingActionButton(onClick = { sheet = UiSheet.NewMenu },
                              modifier = Modifier.padding(bottom = 96.dp, end = 8.dp),
                              containerColor = MaterialTheme.colorScheme.primaryContainer,
                              contentColor = MaterialTheme.colorScheme.onPrimaryContainer,
                              shape = RoundedCornerShape(16.dp)) {
                              Icon(if (vm.clipboard != null) Icons.Filled.ContentPaste else Icons.Filled.Add, "新建")
                          }
                      }
                  }
              ) { inner ->
                  Box(Modifier.fillMaxSize().padding(inner)) {
                      when (vm.currentTab) {
                          Tab.FILES -> {
                              if (vm.items.isEmpty()) EmptyState(
                                  if (vm.searchQuery.isNotBlank()) "没有匹配项" else "这个文件夹是空的",
                                  if (vm.searchQuery.isNotBlank()) "试试其他关键词" else "点击右下角 + 新建")
                              else FileList(vm.items, vm::isStarred, vm::open,
                                  { item -> sheet = UiSheet.ItemMenu(item) }, vm.gridMode)
                          }
                          Tab.RECENT -> {
                              if (vm.recentItems.isEmpty()) EmptyState("暂无最近文件", "打开过的文件会出现在这里")
                              else FileList(vm.recentItems, vm::isStarred, vm::open,
                                  { item -> sheet = UiSheet.ItemMenu(item) }, vm.gridMode)
                          }
                          Tab.STARRED -> {
                              if (vm.starredItems.isEmpty()) EmptyState("暂无收藏", "在菜单中点击收藏即可加入")
                              else FileList(vm.starredItems, vm::isStarred, vm::open,
                                  { item -> sheet = UiSheet.ItemMenu(item) }, vm.gridMode)
                          }
                          Tab.SETTINGS -> SettingsScreen(vm)
                      }

                      FloatingNavBar(
                          items = navItems,
                          selectedIndex = vm.currentTab.ordinal,
                          onSelect = { vm.currentTab = Tab.values()[it] },
                          modifier = Modifier.align(Alignment.BottomCenter)
                              .navigationBarsPadding().padding(bottom = 16.dp)
                      )
                  }
              }

              when (val s = sheet) {
                  is UiSheet.ItemMenu -> {
                      val item = s.item
                      ActionSheet(
                          title = item.name,
                          subtitle = subtitleOf(item),
                          actions = buildList {
                              add(SheetAction(
                                  if (item.isDirectory) Icons.Filled.FolderOpen else Icons.Filled.InsertDriveFile,
                                  "打开") { vm.open(item) })
                              add(SheetAction(
                                  if (vm.isStarred(item.path)) Icons.Filled.Star else Icons.Filled.StarBorder,
                                  if (vm.isStarred(item.path)) "取消收藏" else "收藏") { vm.toggleStar(item) })
                              add(SheetAction(Icons.Filled.Edit, "重命名") { dialog = UiDialog.Rename(item) })
                              add(SheetAction(Icons.Filled.ContentCopy, "复制") { vm.copy(item) })
                              add(SheetAction(Icons.Filled.ContentCut, "剪切") { vm.cut(item) })
                              if (item.isDirectory) {
                                  add(SheetAction(Icons.Filled.ContentPaste, "粘贴到此处",
                                      enabled = vm.clipboard != null) { vm.pasteInto(item.file) })
                              }
                              add(SheetAction(Icons.Filled.Delete, "删除", destructive = true) {
                                  dialog = UiDialog.Delete(item)
                              })
                          },
                          onDismiss = { sheet = null }
                      )
                  }
                  UiSheet.NewMenu -> {
                      ActionSheet(
                          title = "新建",
                          actions = buildList {
                              add(SheetAction(Icons.Filled.CreateNewFolder, "新建文件夹") {
                                  dialog = UiDialog.NewFolder
                              })
                              add(SheetAction(Icons.Filled.InsertDriveFile, "新建文件") {
                                  dialog = UiDialog.NewFile
                              })
                              if (vm.clipboard != null) {
                                  add(SheetAction(Icons.Filled.ContentPaste, "粘贴到此处") { vm.pasteInto() })
                              }
                          },
                          onDismiss = { sheet = null }
                      )
                  }
                  null -> Unit
              }

              when (val d = dialog) {
                  UiDialog.NewFolder -> TextInputDialog(
                      title = "新建文件夹",
                      initial = "新建文件夹",
                      onConfirm = { vm.createFolder(it) },
                      onDismiss = { dialog = null }
                  )
                  UiDialog.NewFile -> TextInputDialog(
                      title = "新建文件",
                      initial = "新建文件.txt",
                      onConfirm = { vm.createFile(it) },
                      onDismiss = { dialog = null }
                  )
                  is UiDialog.Rename -> TextInputDialog(
                      title = "重命名",
                      initial = d.item.name,
                      onConfirm = { vm.rename(d.item, it) },
                      onDismiss = { dialog = null }
                  )
                  is UiDialog.Delete -> ConfirmDialog(
                      title = "删除「${d.item.name}」？",
                      message = if (d.item.isDirectory)
                          "该文件夹及其中所有内容都将被删除，此操作不可撤销。"
                      else "此操作不可撤销。",
                      confirmText = "删除",
                      destructive = true,
                      onConfirm = { vm.delete(d.item) },
                      onDismiss = { dialog = null }
                  )
                  null -> Unit
              }
          }

          @Composable
          fun EmptyState(title: String, subtitle: String) {
              Column(Modifier.fillMaxSize().padding(bottom = 120.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center) {
                  Icon(Icons.Filled.Folder, null,
                      modifier = Modifier.size(64.dp),
                      tint = MaterialTheme.colorScheme.outlineVariant)
                  Spacer(Modifier.height(16.dp))
                  Text(title, style = MaterialTheme.typography.titleMedium)
                  Spacer(Modifier.height(4.dp))
                  Text(subtitle, style = MaterialTheme.typography.bodyMedium,
                      color = MaterialTheme.colorScheme.onSurfaceVariant)
              }
          }

          @Composable
          fun SettingsScreen(vm: FileManagerViewModel) {
              Column(Modifier.fillMaxSize().padding(horizontal = 16.dp).padding(bottom = 120.dp)) {
                  Spacer(Modifier.height(8.dp))
                  Text("浏览", style = MaterialTheme.typography.labelMedium,
                      color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.SemiBold,
                      modifier = Modifier.padding(vertical = 8.dp))
                  Row(Modifier.fillMaxWidth().padding(vertical = 12.dp),
                      verticalAlignment = Alignment.CenterVertically) {
                      Column(Modifier.weight(1f)) {
                          Text("显示隐藏文件", style = MaterialTheme.typography.bodyLarge)
                          Text("以 . 开头的文件与文件夹",
                              style = MaterialTheme.typography.labelMedium,
                              color = MaterialTheme.colorScheme.onSurfaceVariant)
                      }
                      Switch(checked = vm.showHidden, onCheckedChange = vm::setShowHidden)
                  }
                  Spacer(Modifier.height(12.dp))
                  Text("默认视图", style = MaterialTheme.typography.bodyLarge)
                  Spacer(Modifier.height(8.dp))
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      listOf("列表" to false, "网格" to true).forEach { (label, v) ->
                          Surface(onClick = { vm.setGrid(v) },
                              shape = RoundedCornerShape(20.dp),
                              color = if (vm.gridMode == v) MaterialTheme.colorScheme.secondaryContainer
                                      else MaterialTheme.colorScheme.surface,
                              border = androidx.compose.foundation.BorderStroke(1.dp,
                                  if (vm.gridMode == v) MaterialTheme.colorScheme.secondaryContainer
                                  else MaterialTheme.colorScheme.outline)) {
                              Text(label, style = MaterialTheme.typography.labelMedium,
                                  color = if (vm.gridMode == v) MaterialTheme.colorScheme.onSecondaryContainer
                                          else MaterialTheme.colorScheme.onSurface,
                                  modifier = Modifier.padding(horizontal = 16.dp, vertical = 8.dp))
                          }
                      }
                  }
                  Spacer(Modifier.height(20.dp))
                  Text("排序方式", style = MaterialTheme.typography.bodyLarge)
                  Spacer(Modifier.height(8.dp))
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      listOf("名称" to SortKey.NAME, "大小" to SortKey.SIZE, "时间" to SortKey.MTIME).forEach { (label, v) ->
                          Surface(onClick = { vm.setSort(v) },
                              shape = RoundedCornerShape(20.dp),
                              color = if (vm.sortKey == v) MaterialTheme.colorScheme.secondaryContainer
                                      else MaterialTheme.colorScheme.surface,
                              border = androidx.compose.foundation.BorderStroke(1.dp,
                                  if (vm.sortKey == v) MaterialTheme.colorScheme.secondaryContainer
                                  else MaterialTheme.colorScheme.outline)) {
                              Text(label, style = MaterialTheme.typography.labelMedium,
                                  color = if (vm.sortKey == v) MaterialTheme.colorScheme.onSecondaryContainer
                                          else MaterialTheme.colorScheme.onSurface,
                                  modifier = Modifier.padding(horizontal = 16.dp, vertical = 8.dp))
                          }
                      }
                  }
                  Spacer(Modifier.height(32.dp))
                  Text("Files · MD3\nMaterial Design 3 风格文件管理器",
                      style = MaterialTheme.typography.labelSmall,
                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                      modifier = Modifier.fillMaxWidth())
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  setContent {
                      MD3Theme {
                          FileManagerScreen()
                      }
                  }
              }
          }
          KOTLIN_EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
