name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          {
            echo "JAVA: $(java -version 2>&1 | head -1)"
            echo "SDK: $ANDROID_HOME"
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          } > build.log 2>&1

      - name: Show log
        if: always()
        run: tail -100 build.log || true

      - name: Push log on failure
        if: steps.build.outcome == 'failure'
        run: |
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git checkout -B ci-log
          cp build.log ci-build.log
          git add ci-build.log
          git commit -m "ci build log"
          git push -f origin ci-log

      - name: Fail
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Rename APK
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/FileKeeper-${{ github.run_number }}.apk"

      - name: Upload artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FileKeeper-apk
          path: out/*.apk

      - name: Publish latest release
        if: steps.build.outcome == 'success' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 文件管家 最新构建
          body: |
            自动构建 ${{ github.run_number }}
            提交：${{ github.sha }}
          files: out/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
