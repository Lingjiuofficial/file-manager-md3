          private fun badgeColors(kind: FileKind, cs: ColorScheme): Pair<Color, Color> = when (kind) {
              FileKind.FOLDER -> cs.primaryContainer to cs.onPrimaryContainer
              FileKind.IMAGE -> cs.tertiaryContainer to cs.onTertiaryContainer
              FileKind.VIDEO -> cs.secondaryContainer to cs.onSecondaryContainer
              FileKind.AUDIO -> cs.primaryContainer to cs.onPrimaryContainer
              FileKind.ARCHIVE -> cs.secondaryContainer to cs.onSecondaryContainer
              FileKind.CODE -> cs.tertiaryContainer to cs.onTertiaryContainer
              FileKind.PDF -> cs.errorContainer to cs.onErrorContainer
              FileKind.DOCUMENT -> cs.secondaryContainer to cs.onSecondaryContainer
              FileKind.APK -> cs.primaryContainer to cs.onPrimaryContainer
              FileKind.FONT -> cs.tertiaryContainer to cs.onTertiaryContainer
              FileKind.DATABASE -> cs.secondaryContainer to cs.onSecondaryContainer
              FileKind.DISK_IMAGE -> cs.primaryContainer to cs.onPrimaryContainer
              FileKind.TORRENT -> cs.tertiaryContainer to cs.onTertiaryContainer
              FileKind.EXECUTABLE -> cs.errorContainer to cs.onErrorContainer
              FileKind.FILE -> cs.surfaceContainerHigh to cs.onSurfaceVariant
          }

          private object ThumbCache {
              val lru: android.util.LruCache<String, Bitmap> = object : android.util.LruCache<String, Bitmap>(16 * 1024 * 1024) {
                  override fun sizeOf(key: String, value: Bitmap): Int = value.byteCount
              }
              /** 解码并发限流：快速滚动时最多 2 个缩略图同时解码（v5.4 性能） */
              val semaphore = Semaphore(2)
          }

          private fun loadThumb(f: File): Bitmap? {
              if (f.length() > 64L * 1024 * 1024) return null // 超大文件（如大 PSD）不做缩略图，避免无谓解码 IO
              val key = f.absolutePath + "@" + f.lastModified()
              ThumbCache.lru.get(key)?.let { return it }
              return try {
                  val o = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  BitmapFactory.decodeFile(f.absolutePath, o)
                  if (o.outWidth <= 0 || o.outHeight <= 0) return null
                  var s = 1
                  while (o.outWidth / s > 128 || o.outHeight / s > 128) s *= 2
                  val d = BitmapFactory.Options().apply { inSampleSize = s }
                  val bmp = BitmapFactory.decodeFile(f.absolutePath, d) ?: return null
                  ThumbCache.lru.put(key, bmp)
                  bmp
              } catch (_: Exception) { null }
          }

          @Composable
          fun FileIconBadge(item: FileItem, size: Int = 44) {
              val cs = MaterialTheme.colorScheme
              val (bg, fg) = badgeColors(item.kind, cs)
              val icon = ICON_MAP[item.kind] ?: Icons.Filled.InsertDriveFile
              val badgeShape = RoundedCornerShape((size / 3).dp)
              var thumb by remember(item.path) { mutableStateOf<ImageBitmap?>(null) }
              if (item.kind == FileKind.IMAGE) {
                  LaunchedEffect(item.path) {
                      thumb = withContext(Dispatchers.IO) {
                          ThumbCache.semaphore.withPermit { loadThumb(item.file)?.asImageBitmap() }
                      }
                  }
              }
              val bmp = thumb
              if (item.kind == FileKind.IMAGE && bmp != null) {
                  Image(
                      bitmap = bmp,
                      contentDescription = null,
                      modifier = Modifier.size(size.dp).clip(badgeShape).background(bg),
                      contentScale = ContentScale.Crop
                  )
              } else {
                  Box(
                      modifier = Modifier.size(size.dp).clip(badgeShape).background(bg),
                      contentAlignment = Alignment.Center
                  ) {
                      Icon(icon, null, tint = fg, modifier = Modifier.size((size * 0.56).dp))
                  }
              }
          }

