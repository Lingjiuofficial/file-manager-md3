          @Composable
          fun MD3Theme(content: @Composable () -> Unit) {
              val dark = isSystemInDarkTheme()
              val context = LocalContext.current
              val colorScheme = remember(dark) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      if (dark) dynamicDarkColorScheme(context) else dynamicLightColorScheme(context)
                  } else {
                      if (dark) DarkColors else LightColors
                  }
              }
              MaterialTheme(colorScheme = colorScheme, content = content)
          }

          enum class FileKind { FOLDER, IMAGE, VIDEO, AUDIO, ARCHIVE, CODE, PDF, FILE }

          private val IMAGE_EXTS = setOf("jpg","jpeg","png","gif","webp","bmp","svg","ico","heic","avif")
          private val VIDEO_EXTS = setOf("mp4","mkv","mov","avi","webm","flv","m4v","wmv","3gp")
          private val AUDIO_EXTS = setOf("mp3","wav","flac","aac","ogg","m4a","wma","opus","amr")
          private val ARCHIVE_EXTS = setOf("zip","rar","7z","tar","gz","bz2","xz","iso","jar")
          private val CODE_EXTS = setOf(
              "txt","md","json","xml","yml","yaml","js","ts","jsx","tsx",
              "html","css","scss","less","kt","kts","java","py","c","cpp","h","hpp",
              "cs","go","rs","rb","php","swift","sh","bat","ps1","sql",
              "gradle","properties","ini","conf","log","toml","csv"
          )

          private val DATE_FORMATTER: DateTimeFormatter =
              DateTimeFormatter.ofPattern("yyyy-MM-dd HH:mm", Locale.getDefault())
          private val ZONE_ID: ZoneId = ZoneId.systemDefault()
          private val subtitleCache = LruCache<String, String>(2000)

          @Immutable
          data class FileItem(
              val path: String,
              val name: String,
              val isDirectory: Boolean,
              val size: Long,
              val lastModified: Long
          ) {
              val extension: String = if (isDirectory || !name.contains('.')) ""
                  else name.substringAfterLast('.').lowercase(Locale.ROOT)

              val kind: FileKind = when {
                  isDirectory -> FileKind.FOLDER
                  extension in IMAGE_EXTS -> FileKind.IMAGE
                  extension in VIDEO_EXTS -> FileKind.VIDEO
                  extension in AUDIO_EXTS -> FileKind.AUDIO
                  extension in ARCHIVE_EXTS -> FileKind.ARCHIVE
                  extension in CODE_EXTS -> FileKind.CODE
                  extension == "pdf" -> FileKind.PDF
                  else -> FileKind.FILE
              }
          }

          fun File.toItem() = FileItem(absolutePath, name, isDirectory,
              if (isDirectory) 0L else length(), lastModified())

          fun humanSize(bytes: Long): String {
              if (bytes < 1024L) return "$bytes B"
              val kb = bytes / 1024L
              if (kb < 1024L) return "$kb KB"
              val mb = kb / 1024L
              if (mb < 1024L) {
                  if (mb < 10) {
                      val tenth = (kb % 1024L) * 10L / 1024L
                      if (tenth == 0L) return "$mb MB"
                      return "$mb.$tenth MB"
                  }
                  return "$mb MB"
              }
              val gb = mb / 1024L
              return "$gb GB"
          }

          fun formatDate(ts: Long): String =
              Instant.ofEpochMilli(ts).atZone(ZONE_ID).format(DATE_FORMATTER)

          fun kindLabel(k: FileKind): String = when (k) {
              FileKind.IMAGE -> "图片"; FileKind.VIDEO -> "视频"; FileKind.AUDIO -> "音频"
              FileKind.ARCHIVE -> "压缩包"; FileKind.CODE -> "文本"; FileKind.PDF -> "PDF"
              FileKind.FOLDER -> "文件夹"; FileKind.FILE -> "文件"
          }

          fun getSubtitle(item: FileItem): String {
              subtitleCache.get(item.path)?.let { return it }
              val s = if (item.isDirectory) {
                  "文件夹 · " + formatDate(item.lastModified)
              } else {
                  kindLabel(item.kind) + " · " + humanSize(item.size) + " · " + formatDate(item.lastModified)
              }
              subtitleCache.put(item.path, s)
              return s
          }

          /**
           * 用系统应用打开文件。
           * 对于已知 MIME 用具体类型，未知扩展名（如 .ZTSD）回退到 "*/*"，
           * 让系统弹出所有可能的应用供用户选择。
           */
          fun openFileWithSystem(context: Context, item: FileItem) {
              if (item.isDirectory) return
              val mime = if (item.extension.isNotEmpty()) {
                  MimeTypeMap.getSingleton().getMimeTypeFromExtension(item.extension)
              } else null
              // 未知扩展名 → 用 */* 让系统给用户选择
              val type = mime ?: "*/*"
              try {
                  val uri = FileProvider.getUriForFile(
                      context, "${context.packageName}.fileprovider", File(item.path)
                  )
                  val intent = Intent(Intent.ACTION_VIEW).apply {
                      setDataAndType(uri, type)
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
                  context.startActivity(intent)
              } catch (_: Exception) {
                  Toast.makeText(context, "没有应用可以打开此文件", Toast.LENGTH_SHORT).show()
              }
          }

          enum class Tab { FILES, RECENT, STARRED, SETTINGS }
          enum class SortKey { NAME, SIZE, MTIME }
          enum class ClipMode { COPY, CUT }
          data class ClipData(val mode: ClipMode, val path: String)

          private data class DirSnapshot(
              val items: List<FileItem>,
              val dirMtime: Long,
              val sortKey: SortKey,
              val showHidden: Boolean
          )

          class FileManagerViewModel(app: Application) : AndroidViewModel(app) {
              private val prefs = app.getSharedPreferences("fm_md3", 0)
              private var searchJob: Job? = null
              private var refreshJob: Job? = null

              private val dirCache = ConcurrentHashMap<String, DirSnapshot>()
              private val maxCacheSize = 20

              var currentDir by mutableStateOf(resolveRoot(app))
                  private set
              var items by mutableStateOf<List<FileItem>>(emptyList())
                  private set
              var recentItems by mutableStateOf<List<FileItem>>(emptyList())
                  private set
              var starredItems by mutableStateOf<List<FileItem>>(emptyList())
                  private set

              var currentTab by mutableStateOf(Tab.FILES)
              var gridMode by mutableStateOf(prefs.getBoolean("grid", false))
              var sortKey by mutableStateOf(
                  runCatching { SortKey.valueOf(prefs.getString("sort","NAME")!!) }.getOrDefault(SortKey.NAME)
              )
              var showHidden by mutableStateOf(prefs.getBoolean("hidden", false))
              var searchQuery by mutableStateOf("")
              var searchMode by mutableStateOf(false)
              var clipboard by mutableStateOf<ClipData?>(null)
              var starredPaths by mutableStateOf(prefs.getStringSet("starred", emptySet()) ?: emptySet())
                  private set
              var snackMessage by mutableStateOf<String?>(null)
              var isRefreshing by mutableStateOf(false)
                  private set

              init {
                  prefs.getString("lastDir", null)?.let {
                      val f = File(it)
                      if (f.exists() && f.isDirectory && f.canRead()) currentDir = f
                  }
                  refresh(force = false)
                  refreshRecent(); refreshStarred()
              }

              private fun resolveRoot(app: Application): File {
                  val ext = Environment.getExternalStorageDirectory()
                  return if (ext.exists() && ext.canRead()) ext
                  else app.getExternalFilesDir(null) ?: app.filesDir
              }

              private fun sortList(list: List<FileItem>, key: SortKey): List<FileItem> {
                  val cmp = when (key) {
                      SortKey.NAME -> compareBy<FileItem> { !it.isDirectory }
                          .thenBy(String.CASE_INSENSITIVE_ORDER) { it.name }
                      SortKey.SIZE -> compareBy<FileItem> { !it.isDirectory }.thenBy { it.size }
                      SortKey.MTIME -> compareBy<FileItem> { !it.isDirectory }.thenByDescending { it.lastModified }
                  }
                  return list.sortedWith(cmp)
              }

              /**
               * 智能刷新：
               * 1. 缓存命中且非强制 → 立即显示缓存（0 延迟）
               * 2. 后台检查目录 mtime
               *    - 与缓存一致 → 什么都不做
               *    - 不一致或强制 → 重读并更新 UI + 缓存
               * 3. 三重校验（dir + sortKey + showHidden）防止过期协程覆盖
               */
              fun refresh(force: Boolean = false) {
                  refreshJob?.cancel()
                  val dir = currentDir
                  val dirPath = dir.absolutePath
                  val currentSort = sortKey
                  val currentHidden = showHidden
                  val cached = dirCache[dirPath]

                  // 缓存命中：立即显示
                  if (!force && cached != null &&
                      cached.sortKey == currentSort && cached.showHidden == currentHidden) {
                      items = cached.items
                  }

                  refreshJob = viewModelScope.launch {
                      val nowMtime = withContext(Dispatchers.IO) {
                          try { dir.lastModified() } catch (_: Exception) { 0L }
                      }

                      // 命中且无变化 → 不重读
                      if (!force && cached != null &&
                          cached.dirMtime == nowMtime &&
                          cached.sortKey == currentSort &&
                          cached.showHidden == currentHidden) {
                          return@launch
                      }

                      val computed = withContext(Dispatchers.IO) {
                          val list = try { dir.listFiles()?.toList() ?: emptyList() }
                                     catch (_: Exception) { emptyList() }
                          val filtered = list.filter { currentHidden || !it.name.startsWith(".") }
                              .map { it.toItem() }
                          sortList(filtered, currentSort)
                      }

                      // 三重校验：目录、排序、隐藏文件设置都没变才写入
                      if (dir == currentDir &&
                          currentSort == sortKey &&
                          currentHidden == showHidden) {
                          if (dirCache.size > maxCacheSize) dirCache.clear()
                          dirCache[dirPath] = DirSnapshot(computed, nowMtime, currentSort, currentHidden)
                          items = computed
                      }
                  }
              }

              /** 用户手动下拉刷新：显示指示器，忽略缓存强制重读 */
              fun pullToRefresh() {
                  viewModelScope.launch {
                      isRefreshing = true
                      try {
                          val dir = currentDir
                          val dirPath = dir.absolutePath
                          val currentSort = sortKey
                          val currentHidden = showHidden
                          val nowMtime = withContext(Dispatchers.IO) {
                              try { dir.lastModified() } catch (_: Exception) { 0L }
                          }
                          val computed = withContext(Dispatchers.IO) {
                              val list = try { dir.listFiles()?.toList() ?: emptyList() }
                                         catch (_: Exception) { emptyList() }
                              val filtered = list.filter { currentHidden || !it.name.startsWith(".") }
                                  .map { it.toItem() }
                              sortList(filtered, currentSort)
                          }
                          if (dir == currentDir) {
                              if (dirCache.size > maxCacheSize) dirCache.clear()
                              dirCache[dirPath] = DirSnapshot(computed, nowMtime, currentSort, currentHidden)
                              items = computed
                          }
                          // 最少展示 300ms
                          delay(300)
                      } finally {
                          isRefreshing = false
                      }
                  }
              }

              /** 应用内操作（新建/删除/重命名/粘贴）→ 直接失效缓存并强制刷新 */
              private fun invalidateAndRefresh() {
                  dirCache.remove(currentDir.absolutePath)
                  refresh(force = true)
              }

              fun refreshRecent() {
                  viewModelScope.launch {
                      val recent = prefs.getString("recent", "")
                          ?.split('\n')?.filter { it.isNotBlank() } ?: emptyList()
                      recentItems = withContext(Dispatchers.IO) {
                          recent.mapNotNull { File(it).takeIf { f -> f.exists() }?.toItem() }
                      }
                  }
              }

              fun refreshStarred() {
                  viewModelScope.launch {
                      val paths = starredPaths
                      starredItems = withContext(Dispatchers.IO) {
                          paths.mapNotNull { File(it).takeIf { f -> f.exists() }?.toItem() }
                      }
                  }
              }

              /** 记录"最近"——只有成功打开文件后才调用 */
              fun recordRecent(item: FileItem) {
                  if (item.isDirectory) return
                  val list = (prefs.getString("recent","")?.split('\n')?.filter{it.isNotBlank()} ?: emptyList())
                      .toMutableList().apply { remove(item.path); add(0, item.path) }
                  prefs.edit().putString("recent", list.take(50).joinToString("\n")).apply()
                  refreshRecent()
              }

              /** 打开文件夹（进入）；文件由 UI 层调用系统应用打开 */
              fun open(item: FileItem) {
                  if (!item.isDirectory) return
                  if (!item.file.canRead()) { showSnack("无法访问"); return }
                  currentDir = item.file
                  searchQuery = ""; searchMode = false
                  prefs.edit().putString("lastDir", item.path).apply()
                  refresh(force = false)
              }

              fun navigateTo(dir: File) {
                  if (!dir.isDirectory || !dir.canRead()) { showSnack("无法访问"); return }
                  currentDir = dir; searchQuery = ""; searchMode = false
                  prefs.edit().putString("lastDir", dir.absolutePath).apply()
                  refresh(force = false)
              }

              fun goUp(): Boolean {
                  val p = currentDir.parentFile ?: return false
                  if (!p.canRead()) return false
                  navigateTo(p); return true
              }

              fun breadcrumbs(): List<File> {
                  val list = ArrayList<File>(8)
                  var f: File? = currentDir
                  while (f != null) { list.add(0, f); f = f.parentFile }
                  return list
              }

              fun doSearch(q: String) {
                  searchQuery = q
                  searchJob?.cancel()
                  if (q.isBlank()) { refresh(force = false); return }
                  val dir = currentDir
                  val key = sortKey
                  searchJob = viewModelScope.launch {
                      delay(250)
                      val results = withContext(Dispatchers.IO) {
                          val res = ArrayList<FileItem>()
                          val stack = ArrayDeque<File>().apply { add(dir) }
                          val lower = q.lowercase()
                          while (stack.isNotEmpty() && res.size < 300) {
                              val d = stack.removeFirst()
                              val children = try { d.listFiles() } catch (_: Exception) { null } ?: continue
                              for (c in children) {
                                  if (c.name.startsWith(".")) continue
                                  if (c.name.lowercase().contains(lower)) res.add(c.toItem())
                                  if (c.isDirectory) stack.add(c)
                              }
                          }
                          sortList(res, key)
                      }
                      if (q == searchQuery) items = results
                  }
              }

              fun exitSearch() { searchQuery = ""; searchMode = false; refresh(force = false) }

              fun createFolder(name: String) {
                  if (name.isBlank()) return
                  viewModelScope.launch {
                      val ok = withContext(Dispatchers.IO) { File(currentDir, name).mkdirs() }
                      if (ok) { invalidateAndRefresh(); showSnack("已创建「$name」") }
                      else showSnack("创建失败")
                  }
              }

              fun createFile(name: String) {
                  if (name.isBlank()) return
                  viewModelScope.launch {
                      val ok = withContext(Dispatchers.IO) {
                          try { File(currentDir, name).createNewFile() } catch (_: Exception) { false }
                      }
                      if (ok) { invalidateAndRefresh(); showSnack("已创建「$name」") }
                      else showSnack("创建失败")
                  }
              }

              fun rename(item: FileItem, newName: String) {
                  if (newName.isBlank() || newName == item.name) return
                  val dest = File(item.file.parentFile, newName)
                  if (dest.exists()) { showSnack("已存在同名项目"); return }
                  viewModelScope.launch {
                      val ok = withContext(Dispatchers.IO) { item.file.renameTo(dest) }
                      if (ok) {
                          subtitleCache.remove(item.path)
                          if (starredPaths.contains(item.path)) {
                              starredPaths = starredPaths - item.path + dest.absolutePath
                              prefs.edit().putStringSet("starred", starredPaths).apply()
                          }
                          invalidateAndRefresh(); refreshStarred(); refreshRecent()
                          showSnack("已重命名")
                      } else showSnack("重命名失败")
                  }
              }

              fun delete(item: FileItem) {
                  viewModelScope.launch {
                      val ok = withContext(Dispatchers.IO) {
                          if (item.isDirectory) item.file.deleteRecursively() else item.file.delete()
                      }
                      if (ok) {
                          starredPaths = starredPaths - item.path
                          prefs.edit().putStringSet("starred", starredPaths).apply()
                          if (clipboard?.path == item.path) clipboard = null
                          subtitleCache.remove(item.path)
                          invalidateAndRefresh(); refreshStarred(); refreshRecent()
                          showSnack("已删除")
                      } else showSnack("删除失败")
                  }
              }

              fun copy(item: FileItem) { clipboard = ClipData(ClipMode.COPY, item.path); showSnack("已复制") }
              fun cut(item: FileItem) { clipboard = ClipData(ClipMode.CUT, item.path); showSnack("已剪切") }

              fun pasteInto(target: File = currentDir) {
                  val cb = clipboard ?: return
                  val src = File(cb.path)
                  if (!src.exists()) { clipboard = null; showSnack("源文件不存在"); return }
                  if (src.isDirectory && target.absolutePath.startsWith(src.absolutePath + "/")) {
                      showSnack("不能移动到自身子目录"); return
                  }
                  viewModelScope.launch {
                      val ok = withContext(Dispatchers.IO) {
                          try {
                              val dest = uniqueFile(target, src.name)
                              if (cb.mode == ClipMode.CUT) {
                                  if (src.renameTo(dest)) true
                                  else { val c = copyRec(src, dest); if (c) src.deleteRecursively(); c }
                              } else copyRec(src, dest)
                          } catch (_: Exception) { false }
                      }
                      if (ok) {
                          clipboard = null
                          if (target.absolutePath == currentDir.absolutePath) {
                              invalidateAndRefresh()
                          }
                          refreshStarred(); refreshRecent()
                          showSnack("已粘贴")
                      } else showSnack("粘贴失败")
                  }
              }

              private fun copyRec(src: File, dest: File): Boolean = try {
                  if (src.isDirectory) src.copyRecursively(dest, overwrite = false)
                  else { dest.parentFile?.mkdirs(); src.copyTo(dest, overwrite = false) }
                  true
              } catch (_: Exception) { false }

              private fun uniqueFile(dir: File, name: String): File {
                  var f = File(dir, name)
                  if (!f.exists()) return f
                  val dot = name.lastIndexOf('.')
                  val stem = if (dot > 0) name.substring(0, dot) else name
                  val ext = if (dot > 0) name.substring(dot) else ""
                  var i = 1
                  while (f.exists()) { f = File(dir, "$stem ($i)$ext"); i++ }
                  return f
              }

              fun toggleStar(item: FileItem) {
                  starredPaths = if (starredPaths.contains(item.path)) starredPaths - item.path
                                 else starredPaths + item.path
                  prefs.edit().putStringSet("starred", starredPaths).apply()
                  refreshStarred()
                  showSnack(if (starredPaths.contains(item.path)) "已收藏" else "已取消收藏")
              }

              fun isStarred(path: String) = starredPaths.contains(path)

              fun updateGrid(g: Boolean) { gridMode = g; prefs.edit().putBoolean("grid", g).apply() }

              fun updateSort(k: SortKey) {
                  sortKey = k
                  prefs.edit().putString("sort", k.name).apply()
                  // 排序变了，所有缓存的顺序都失效
                  dirCache.clear()
                  refresh(force = true)
              }

              fun updateShowHidden(s: Boolean) {
                  showHidden = s
                  prefs.edit().putBoolean("hidden", s).apply()
                  // 过滤条件变了，所有缓存失效
                  dirCache.clear()
                  refresh(force = true)
              }

              fun showSnack(m: String) { snackMessage = m }
              fun consumeSnack() { snackMessage = null }
          }

