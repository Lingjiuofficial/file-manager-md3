          enum class CategoryKind(val label: String) {
              ALL("全部"), AUDIO("音频"), VIDEO("视频"), TEXT("文本"),
              ARCHIVE("压缩包"), IMAGE("图片"), DOCUMENT("文档"), APK("安装包");

              fun matches(item: FileItem): Boolean = when (this) {
                  ALL -> true
                  AUDIO -> item.kind == FileKind.AUDIO
                  VIDEO -> item.kind == FileKind.VIDEO
                  TEXT -> item.kind == FileKind.CODE
                  ARCHIVE -> item.kind == FileKind.ARCHIVE
                  IMAGE -> item.kind == FileKind.IMAGE
                  DOCUMENT -> item.kind == FileKind.DOCUMENT || item.kind == FileKind.PDF
                  APK -> item.kind == FileKind.APK
              }
          }

