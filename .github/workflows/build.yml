          data class ZipEntryInfo(val name: String, val size: Long, val isDirectory: Boolean)

          private fun fmtTime(ms: Int): String {
              if (ms <= 0) return "0:00"
              val s = ms / 1000
              val m = s / 60
              val sec = s % 60
              return m.toString() + ":" + (if (sec < 10) "0" else "") + sec
          }

