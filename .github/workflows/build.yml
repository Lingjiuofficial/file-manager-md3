          @Composable
          fun FileList(items: List<FileItem>, starredPaths: Set<String>,
                       onOpen: (FileItem) -> Unit, onMenu: (FileItem) -> Unit, grid: Boolean,
                       onRegisterScrollTop: (() -> Unit) -> Unit = { _ -> },
                       selectionMode: Boolean = false, selectedPaths: Set<String> = emptySet(),
                       onToggleSelect: (FileItem) -> Unit = {}) {
              val listState = rememberLazyListState()
              val gridState = rememberLazyGridState()
              val itemScope = rememberCoroutineScope()
              LaunchedEffect(grid) {
                  onRegisterScrollTop {
                      itemScope.launch {
                          if (grid) gridState.animateScrollToItem(0) else listState.animateScrollToItem(0)
                      }
                  }
              }
              Box(Modifier.fillMaxSize()) {
              if (grid) {
                  LazyVerticalGrid(columns = GridCells.Adaptive(108.dp), state = gridState, modifier = Modifier.fillMaxSize(),
                      contentPadding = PaddingValues(start = 12.dp, end = 12.dp, top = 4.dp, bottom = 180.dp),
                      horizontalArrangement = Arrangement.spacedBy(8.dp),
                      verticalArrangement = Arrangement.spacedBy(8.dp)) {
                      items(count = items.size, key = { items[it].path }, contentType = { "card" }) { idx ->
                          val it = items[idx]
                          FileCard(it, selectionMode = selectionMode, selected = selectedPaths.contains(it.path),
                              onMenu = { onMenu(it) }, onClick = { onOpen(it) }, onToggleSelect = { onToggleSelect(it) })
                      }
                  }
              } else {
                  LazyColumn(state = listState, modifier = Modifier.fillMaxSize(),
                      contentPadding = PaddingValues(start = 8.dp, end = 8.dp, top = 4.dp, bottom = 180.dp)) {
                      items(count = items.size, key = { items[it].path }, contentType = { "row" }) { idx ->
                          val it = items[idx]
                          FileRow(it, starredPaths.contains(it.path), selectionMode = selectionMode,
                              selected = selectedPaths.contains(it.path), onClick = { onOpen(it) },
                              onMenu = { onMenu(it) }, onToggleSelect = { onToggleSelect(it) })
                      }
                  }
              }
              if (items.size > 40) {
                  val total = items.size
                  FastScrollbar(
                      fractionProvider = {
                          if (grid) gridState.firstVisibleItemIndex.toFloat() / total
                          else listState.firstVisibleItemIndex.toFloat() / total
                      },
                      onScrub = { f ->
                          val idx = (f * (total - 1)).toInt().coerceIn(0, total - 1)
                          itemScope.launch { if (grid) gridState.scrollToItem(idx) else listState.scrollToItem(idx) }
                      },
                      modifier = Modifier.align(Alignment.CenterEnd)
                  )
              }
              }
          }

          @Composable
          fun FastScrollbar(fractionProvider: () -> Float, onScrub: (Float) -> Unit, modifier: Modifier = Modifier) {
              var dragging by remember { mutableStateOf(false) }
              val thumbColor = if (dragging) MaterialTheme.colorScheme.primary
                  else MaterialTheme.colorScheme.primary.copy(alpha = 0.5f)
              Canvas(
                  modifier = modifier
                      .fillMaxHeight()
                      .width(18.dp)
                      .pointerInput(Unit) {
                          detectVerticalDragGestures(
                              onDragStart = { off ->
                                  dragging = true
                                  onScrub((off.y / size.height).coerceIn(0f, 1f))
                              },
                              onVerticalDrag = { ch, _ -> onScrub((ch.position.y / size.height).coerceIn(0f, 1f)) },
                              onDragEnd = { dragging = false },
                              onDragCancel = { dragging = false }
                          )
                      }
              ) {
                  // fraction 放到绘制阶段读取：列表滚动仅触发重绘，不触发组合
                  val fraction = fractionProvider().coerceIn(0f, 1f)
                  val pad = 10.dp.toPx()
                  val trackH = size.height - pad * 2
                  val thumbH = 44.dp.toPx()
                  val cy = pad + (trackH - thumbH) * fraction
                  drawRoundRect(
                      color = thumbColor,
                      topLeft = Offset(size.width / 2 - 3.dp.toPx(), cy),
                      size = Size(6.dp.toPx(), thumbH),
                      cornerRadius = CornerRadius(3.dp.toPx(), 3.dp.toPx())
                  )
              }
          }

