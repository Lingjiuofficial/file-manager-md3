          @OptIn(ExperimentalFoundationApi::class)
          @Composable
          fun FtpScreen(vm: FileManagerViewModel, onDismiss: () -> Unit) {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              val prefs = remember { ctx.getSharedPreferences("fm_md3", 0) }
              var profiles by remember { mutableStateOf(loadFtpProfiles(prefs)) }
              var showProfileDialog by remember { mutableStateOf(false) }
              var editSeed by remember { mutableStateOf<FtpProfile?>(null) }
              var client by remember { mutableStateOf<FTPClient?>(null) }
              var remotePath by remember { mutableStateOf("/") }
              var entries by remember { mutableStateOf<List<FTPFile>>(emptyList()) }
              var busy by remember { mutableStateOf(false) }
              var statusMsg by remember { mutableStateOf<String?>(null) }
              var menuTarget by remember { mutableStateOf<FTPFile?>(null) }
              var renameTarget by remember { mutableStateOf<FTPFile?>(null) }
              var showMkdir by remember { mutableStateOf(false) }
              var showUpload by remember { mutableStateOf(false) }
              var transferDesc by remember { mutableStateOf<String?>(null) }

              fun disconnectSilently() {
                  val c = client ?: return
                  client = null; entries = emptyList(); remotePath = "/"
                  Thread { try { c.disconnect() } catch (_: Exception) {} }.start()
              }

              fun refreshRemote(path: String) {
                  val c = client ?: return
                  scope.launch {
                      busy = true
                      var newPath: String? = null
                      var newEntries: List<FTPFile> = emptyList()
                      var err: String? = null
                      withContext(Dispatchers.IO) {
                          try {
                              if (c.changeWorkingDirectory(path)) {
                                  val cur = c.printWorkingDirectory() ?: path
                                  newPath = cur
                                  newEntries = c.listFiles(cur)?.toList() ?: emptyList()
                              } else err = "无法进入目录：" + path
                          } catch (e: Exception) { err = "操作失败：" + (e.message ?: "") }
                      }
                      busy = false
                      val np = newPath
                      if (np != null) {
                          remotePath = np
                          entries = newEntries.sortedWith(compareBy({ !it.isDirectory }, { it.name.lowercase(Locale.ROOT) }))
                      }
                      if (err != null) statusMsg = err
                  }
              }

              fun connectTo(p: FtpProfile) {
                  scope.launch {
                      busy = true; statusMsg = null
                      val res = withContext(Dispatchers.IO) {
                          try {
                              val c: FTPClient = if (p.secure) {
                                  FTPSClient(false).apply {
                                      setTrustManager(TrustManagerUtils.getAcceptAllTrustManager())
                                      setEndpointCheckingEnabled(false)
                                  }
                              } else FTPClient()
                              c.connectTimeout = 10_000
                              c.defaultTimeout = 30_000
                              c.connect(p.host, p.port)
                              c.enterLocalPassiveMode()
                              try { c.setControlEncoding(p.encoding) } catch (_: Exception) {}
                              if (c.login(p.user, p.pass)) {
                                  if (c is FTPSClient) { try { c.execPBSZ(0); c.execPROT("P") } catch (_: Exception) {} }
                                  c to null
                              } else { try { c.disconnect() } catch (_: Exception) {}; null to "登录失败（检查用户名 / 密码）" }
                          } catch (e: Exception) { null to ("连接失败：" + (e.message ?: "")) }
                      }
                      busy = false
                      val c = res.first
                      if (c != null) { client = c; refreshRemote("/") } else statusMsg = res.second ?: "连接失败"
                  }
              }

              fun remoteFull(name: String): String = remotePath.trimEnd('/') + "/" + name

              fun downloadEntry(e: FTPFile) {
                  val c = client ?: return
                  val safeName = e.name.substringAfterLast('/').substringAfterLast('\\')
                  if (safeName.isEmpty() || safeName == "." || safeName == "..") { statusMsg = "非法文件名"; return }
                  val target = vm.currentDir
                  scope.launch {
                      busy = true
                      transferDesc = "下载中 0%"
                      val ok = withContext(Dispatchers.IO) {
                          try {
                              c.setCopyStreamListener(progressListener(e.size) { pct ->
                                  scope.launch { transferDesc = "下载中 " + pct + "%" } })
                              File(target, safeName).outputStream().buffered().use { out -> c.retrieveFile(remoteFull(e.name), out) }
                          } catch (_: Exception) { false } finally {
                              try { c.setCopyStreamListener(null) } catch (_: Exception) {}
                          }
                      }
                      transferDesc = null
                      busy = false
                      if (ok) { vm.pullToRefresh(); vm.showSnack("已下载「" + safeName + "」到 " + target.name) }
                      else statusMsg = "下载失败：" + e.name
                  }
              }

              fun uploadEntry(f: File) {
                  val c = client ?: return
                  scope.launch {
                      busy = true
                      transferDesc = "上传中 0%"
                      val ok = withContext(Dispatchers.IO) {
                          try {
                              c.setCopyStreamListener(progressListener(f.length()) { pct ->
                                  scope.launch { transferDesc = "上传中 " + pct + "%" } })
                              f.inputStream().buffered().use { input -> c.storeFile(remoteFull(f.name), input) }
                          } catch (_: Exception) { false } finally {
                              try { c.setCopyStreamListener(null) } catch (_: Exception) {}
                          }
                      }
                      transferDesc = null
                      busy = false
                      if (ok) { vm.showSnack("已上传 " + f.name); refreshRemote(remotePath) }
                      else statusMsg = "上传失败：" + f.name
                  }
              }

              fun mkdirRemote(name: String) {
                  val c = client ?: return
                  scope.launch {
                      busy = true
                      val ok = withContext(Dispatchers.IO) {
                          try { c.makeDirectory(remoteFull(name)) } catch (_: Exception) { false }
                      }
                      busy = false
                      if (ok) { vm.showSnack("已创建文件夹"); refreshRemote(remotePath) } else statusMsg = "创建失败"
                  }
              }

              fun deleteEntry(e: FTPFile) {
                  val c = client ?: return
                  scope.launch {
                      busy = true
                      val ok = withContext(Dispatchers.IO) {
                          try {
                              if (e.isDirectory) c.removeDirectory(remoteFull(e.name)) else c.deleteFile(remoteFull(e.name))
                          } catch (_: Exception) { false }
                      }
                      busy = false
                      if (ok) { vm.showSnack("已删除"); refreshRemote(remotePath) } else statusMsg = "删除失败（目录需先清空）"
                  }
              }

              fun renameEntry(e: FTPFile, newName: String) {
                  val c = client ?: return
                  if (newName.isBlank() || newName == e.name) return
                  scope.launch {
                      busy = true
                      val ok = withContext(Dispatchers.IO) {
                          try { c.rename(remoteFull(e.name), remoteFull(newName)) } catch (_: Exception) { false }
                      }
                      busy = false
                      if (ok) { vm.showSnack("已重命名"); refreshRemote(remotePath) } else statusMsg = "重命名失败"
                  }
              }

              BackHandler { if (client != null) disconnectSilently() else onDismiss() }

              Box(Modifier.fillMaxSize()) {
                  Column(Modifier.fillMaxSize()) {
                      Surface(color = MaterialTheme.colorScheme.surfaceContainer) {
                          Row(modifier = Modifier.fillMaxWidth().statusBarsPadding().height(64.dp).padding(horizontal = 4.dp),
                              verticalAlignment = Alignment.CenterVertically) {
                              IconButton(onClick = { if (client != null) disconnectSilently() else onDismiss() }) {
                                  Icon(Icons.Filled.ArrowBack, "返回")
                              }
                              Column(Modifier.weight(1f).padding(horizontal = 4.dp)) {
                                  Text("FTP 客户端", style = MaterialTheme.typography.titleLarge,
                                      maxLines = 1, overflow = TextOverflow.Ellipsis)
                                  Text(if (client == null) "连接管理" else "已连接 · 下载到「" + vm.currentDir.name + "」",
                                      style = MaterialTheme.typography.labelSmall,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant, maxLines = 1, overflow = TextOverflow.Ellipsis)
                              }
                              if (client != null) {
                                  IconButton(onClick = { refreshRemote(remotePath) }, enabled = !busy) {
                                      Icon(Icons.Filled.Refresh, "刷新")
                                  }
                                  IconButton(onClick = { showUpload = true }, enabled = !busy) {
                                      Icon(Icons.Filled.Upload, "上传文件")
                                  }
                                  IconButton(onClick = { showMkdir = true }, enabled = !busy) {
                                      Icon(Icons.Filled.CreateNewFolder, "新建文件夹")
                                  }
                              }
                          }
                      }

                      if (client == null) {
                          if (profiles.isEmpty()) {
                              Box(Modifier.fillMaxSize().padding(32.dp), contentAlignment = Alignment.Center) {
                                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                      Icon(Icons.Filled.Storage, null, modifier = Modifier.size(56.dp),
                                          tint = MaterialTheme.colorScheme.outlineVariant)
                                      Spacer(Modifier.height(12.dp))
                                      Text("还没有 FTP 连接", style = MaterialTheme.typography.titleMedium)
                                      Spacer(Modifier.height(4.dp))
                                      Text("点击右下角 + 新建一个连接", style = MaterialTheme.typography.bodyMedium,
                                          color = MaterialTheme.colorScheme.onSurfaceVariant)
                                  }
                              }
                          } else {
                              LazyColumn(Modifier.fillMaxSize(), contentPadding = PaddingValues(top = 4.dp, bottom = 96.dp)) {
                                  items(count = profiles.size, key = { profiles[it].host + ":" + profiles[it].port + profiles[it].name }) { idx ->
                                      val p = profiles[idx]
                                      Row(
                                          modifier = Modifier.fillMaxWidth()
                                              .combinedClickable(
                                                  onClick = { connectTo(p) },
                                                  onLongClick = { editSeed = p; showProfileDialog = true }
                                              )
                                              .padding(horizontal = 20.dp, vertical = 12.dp),
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Icon(Icons.Filled.Storage, null, modifier = Modifier.size(22.dp),
                                              tint = MaterialTheme.colorScheme.primary)
                                          Spacer(Modifier.width(12.dp))
                                          Column(Modifier.weight(1f)) {
                                              Text(p.name, style = MaterialTheme.typography.bodyLarge,
                                                  maxLines = 1, overflow = TextOverflow.Ellipsis)
                                              Text(p.user + "@" + p.host + ":" + p.port, style = MaterialTheme.typography.labelSmall,
                                                  color = MaterialTheme.colorScheme.onSurfaceVariant, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                          }
                                          IconButton(onClick = { editSeed = p; showProfileDialog = true }) {
                                              Icon(Icons.Filled.Edit, "编辑", tint = MaterialTheme.colorScheme.onSurfaceVariant)
                                          }
                                          IconButton(onClick = {
                                              val p2 = p
                                              profiles = profiles.filter { it != p2 }
                                              saveFtpProfiles(prefs, profiles)
                                          }) {
                                              Icon(Icons.Filled.Delete, "删除", tint = MaterialTheme.colorScheme.error)
                                          }
                                      }
                                  }
                              }
                          }
                      } else {
                          Column(Modifier.fillMaxSize()) {
                              Row(Modifier.fillMaxWidth().padding(start = 20.dp, end = 8.dp, top = 4.dp, bottom = 2.dp),
                                  verticalAlignment = Alignment.CenterVertically) {
                                  Icon(Icons.Filled.Storage, null, modifier = Modifier.size(14.dp),
                                      tint = MaterialTheme.colorScheme.onSurfaceVariant)
                                  Spacer(Modifier.width(6.dp))
                                  Text(remotePath, style = MaterialTheme.typography.labelMedium,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                                      maxLines = 1, overflow = TextOverflow.Ellipsis,
                                      modifier = Modifier.weight(1f))
                                  TextButton(onClick = {
                                      val parent = remotePath.trimEnd('/').substringBeforeLast('/', "")
                                      refreshRemote(if (parent.isEmpty()) "/" else parent)
                                  }, enabled = !busy && remotePath != "/") { Text("上级") }
                              }
                              if (entries.isEmpty()) {
                                  Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                      Text(if (busy) "读取中…" else "此目录为空", color = MaterialTheme.colorScheme.onSurfaceVariant)
                                  }
                              } else {
                                  LazyColumn(Modifier.fillMaxSize(), contentPadding = PaddingValues(top = 2.dp, bottom = 24.dp)) {
                                      items(count = entries.size, key = { entries[it].name }) { idx ->
                                          val e = entries[idx]
                                          val kind = if (e.isDirectory) FileKind.FOLDER
                                              else kindOf(e.name.substringAfterLast('.', "").lowercase(Locale.ROOT), false)
                                          Row(
                                              modifier = Modifier.fillMaxWidth()
                                                  .combinedClickable(
                                                      onClick = {
                                                          if (e.isDirectory) refreshRemote(remotePath.trimEnd('/') + "/" + e.name)
                                                          else downloadEntry(e)
                                                      },
                                                      onLongClick = { menuTarget = e }
                                                  )
                                                  .padding(horizontal = 20.dp, vertical = 10.dp),
                                              verticalAlignment = Alignment.CenterVertically
                                          ) {
                                              Icon(ICON_MAP[kind] ?: Icons.Filled.InsertDriveFile, null,
                                                  modifier = Modifier.size(22.dp),
                                                  tint = MaterialTheme.colorScheme.onSurfaceVariant)
                                              Spacer(Modifier.width(12.dp))
                                              Column(Modifier.weight(1f)) {
                                                  Text(e.name, maxLines = 1, overflow = TextOverflow.Ellipsis,
                                                      style = MaterialTheme.typography.bodyMedium)
                                                  if (!e.isDirectory) Text(humanSize(e.size), style = MaterialTheme.typography.labelSmall,
                                                      color = MaterialTheme.colorScheme.onSurfaceVariant)
                                              }
                                              if (e.isDirectory) Icon(Icons.Filled.ChevronRight, null,
                                                  tint = MaterialTheme.colorScheme.outline, modifier = Modifier.size(20.dp))
                                              else IconButton(onClick = { menuTarget = e }) {
                                                  Icon(Icons.Filled.MoreVert, "更多", tint = MaterialTheme.colorScheme.onSurfaceVariant)
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
                  if (busy) {
                      Surface(
                          modifier = Modifier.align(Alignment.Center),
                          shape = RoundedCornerShape(16.dp),
                          color = MaterialTheme.colorScheme.surfaceContainerHigh,
                          shadowElevation = 8.dp
                      ) {
                          Row(Modifier.padding(horizontal = 20.dp, vertical = 14.dp), verticalAlignment = Alignment.CenterVertically) {
                              CircularProgressIndicator(modifier = Modifier.size(20.dp), strokeWidth = 2.dp)
                              Spacer(Modifier.width(12.dp))
                              Text(transferDesc ?: "处理中…", style = MaterialTheme.typography.bodyMedium)
                          }
                      }
                  }
                  if (client == null) {
                      FloatingActionButton(onClick = { editSeed = null; showProfileDialog = true },
                          modifier = Modifier.align(Alignment.BottomEnd).navigationBarsPadding().padding(24.dp),
                          containerColor = MaterialTheme.colorScheme.primaryContainer,
                          contentColor = MaterialTheme.colorScheme.onPrimaryContainer,
                          shape = RoundedCornerShape(16.dp)) {
                          Icon(Icons.Filled.Add, "新建连接")
                      }
                  }
              }

              if (showProfileDialog) {
                  FtpProfileDialog(initial = editSeed, onConfirm = { p ->
                      val base = editSeed
                      profiles = if (base == null) profiles + p else profiles.map { if (it == base) p else it }
                      saveFtpProfiles(prefs, profiles)
                  }, onDismiss = { showProfileDialog = false; editSeed = null })
              }
              if (showMkdir) {
                  TextInputDialog(title = "新建远程文件夹", initial = "新建文件夹", label = "文件夹名",
                      onConfirm = { mkdirRemote(it) }, onDismiss = { showMkdir = false })
              }
              if (showUpload) {
                  ActionSheet(title = "上传文件", subtitle = "从「" + vm.currentDir.name + "」选择", actions = buildList {
                      vm.items.filter { !it.isDirectory }.take(100).forEach { f ->
                          add(SheetAction(Icons.Filled.Upload, f.name) { uploadEntry(f.file) })
                      }
                  }, onDismiss = { showUpload = false })
              }
              val mt = menuTarget
              if (mt != null) {
                  ActionSheet(title = mt.name,
                      subtitle = if (mt.isDirectory) "远程目录" else humanSize(mt.size),
                      actions = buildList {
                          if (!mt.isDirectory) add(SheetAction(Icons.Filled.Download, "下载到「" + vm.currentDir.name + "」") { downloadEntry(mt) })
                          add(SheetAction(Icons.Filled.Edit, "重命名") { renameTarget = mt })
                          add(SheetAction(Icons.Filled.Delete, "删除", destructive = true) { deleteEntry(mt) })
                      }, onDismiss = { menuTarget = null })
              }
              val rt = renameTarget
              if (rt != null) {
                  TextInputDialog(title = "重命名远程条目", initial = rt.name, label = "新名称",
                      onConfirm = { renameEntry(rt, it) }, onDismiss = { renameTarget = null })
              }
              val sm = statusMsg
              if (sm != null) {
                  AlertDialog(onDismissRequest = { statusMsg = null }, title = { Text("FTP") },
                      text = { Text(sm) },
                      confirmButton = { TextButton(onClick = { statusMsg = null }) { Text("知道了") } })
              }
          }

          @Composable
          fun ReplaceDialog(text: String, onConfirm: (String, String) -> Unit, onDismiss: () -> Unit) {
              var find by remember { mutableStateOf("") }
              var replace by remember { mutableStateOf("") }
              val matchCount = remember(find, text) {
                  if (find.isEmpty()) 0
                  else {
                      var i = 0; var n = 0
                      while (true) { val j = text.indexOf(find, i); if (j < 0) break; n++; i = j + find.length }
                      n
                  }
              }
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text("查找替换") },
                  text = {
                      Column {
                          OutlinedTextField(value = find, onValueChange = { find = it }, label = { Text("查找") },
                              singleLine = true, modifier = Modifier.fillMaxWidth())
                          if (find.isNotEmpty()) {
                              Spacer(Modifier.height(4.dp))
                              Text("匹配 " + matchCount + " 处", style = MaterialTheme.typography.labelSmall,
                                  color = if (matchCount > 0) MaterialTheme.colorScheme.primary
                                      else MaterialTheme.colorScheme.error)
                          }
                          Spacer(Modifier.height(8.dp))
                          OutlinedTextField(value = replace, onValueChange = { replace = it }, label = { Text("替换为") },
                              singleLine = true, modifier = Modifier.fillMaxWidth())
                      }
                  },
                  confirmButton = { TextButton(onClick = { onConfirm(find, replace); onDismiss() }) { Text("全部替换") } },
                  dismissButton = { TextButton(onClick = onDismiss) { Text("取消") } }
              )
          }

          @Composable
          fun AboutDialog(onOpenRepo: () -> Unit, onDismiss: () -> Unit) {
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text("Files · MD3") },
                  text = {
                      Column {
                          Text("版本：v5.6", style = MaterialTheme.typography.bodyMedium)
                          Spacer(Modifier.height(4.dp))
                          Text("作者：Lingjiuofficial", style = MaterialTheme.typography.bodyMedium)
                          Spacer(Modifier.height(4.dp))
                          Text("开源许可：GPL-3.0", style = MaterialTheme.typography.bodyMedium)
                          Spacer(Modifier.height(8.dp))
                          Text("github.com/Lingjiuofficial/file-manager-md3",
                              style = MaterialTheme.typography.labelMedium,
                              color = MaterialTheme.colorScheme.primary)
                      }
                  },
                  confirmButton = { TextButton(onClick = { onOpenRepo(); onDismiss() }) { Text("打开仓库") } },
                  dismissButton = { TextButton(onClick = onDismiss) { Text("关闭") } }
              )
          }

          class MainActivity : ComponentActivity() {
              private val prefs by lazy { getSharedPreferences("fm_md3", 0) }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  val savedHz = prefs.getFloat("preferredHz", 0f)
                  window.decorView.post {
                      if (savedHz > 0f) applyRefreshRate(this, savedHz)
                  }
                  setContent {
                      val vm: FileManagerViewModel = viewModel()
                      val dark = when (vm.themeMode) {
                          1 -> false
                          2 -> true
                          else -> isSystemInDarkTheme()
                      }
                      LaunchedEffect(dark) {
                          WindowCompat.getInsetsController(window, window.decorView).let {
                              it.isAppearanceLightStatusBars = !dark
                              it.isAppearanceLightNavigationBars = !dark
                          }
                      }
                      MD3Theme(dynamicColor = vm.dynamicColor, darkTheme = dark) {
                          FileManagerScreen(vm)
                      }
                  }
              }
          }
          KOTLIN_EOF

      - name: Sync generated sources
        continue-on-error: true
        run: |
          rm -rf generated && mkdir -p generated
          cp -r app generated/app
          cp settings.gradle.kts build.gradle.kts gradle.properties generated/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f generated
          if git diff --cached --quiet; then echo "generated sources unchanged"; else git commit -m "chore: sync generated sources [skip ci]"; git push; fi

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: files-md3-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo ${{ github.repository }} > /dev/null 2>&1 \
            && gh release upload latest app/build/outputs/apk/release/app-release.apk --clobber --repo ${{ github.repository }} \
            || gh release create latest app/build/outputs/apk/release/app-release.apk --title "Files · MD3（滚动最新构建）" --notes "自动构建 · run #${{ github.run_number }}" --repo ${{ github.repository }}
