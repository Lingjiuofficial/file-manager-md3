                  ) {
                      Column {
                          Text("Root 文件管理", style = MaterialTheme.typography.bodyLarge)
                          Spacer(Modifier.height(2.dp))
                          Text("浏览系统分区 · 需 KernelSU / Magisk 授权", style = MaterialTheme.typography.labelMedium,
                              color = MaterialTheme.colorScheme.onSurfaceVariant)
                      }
                  }

                  Spacer(Modifier.height(24.dp))
                  Text("存储", style = MaterialTheme.typography.labelMedium,
                      color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.SemiBold,
                      modifier = Modifier.padding(vertical = 8.dp))
                  Surface(color = MaterialTheme.colorScheme.surfaceContainerLow,
                      shape = RoundedCornerShape(16.dp),
                      modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(16.dp)).clickable { onOpenStorage() }) {
                      Column(Modifier.padding(16.dp)) {
                          val si = storageInfo
                          if (si == null) {
                              Text("正在读取存储信息…", style = MaterialTheme.typography.labelMedium,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant)
                          } else {
                              val (total, used, avail) = si
                              val fraction = if (total > 0) used.toFloat() / total else 0f
                              Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                                  Text("内部存储", style = MaterialTheme.typography.bodyLarge, modifier = Modifier.weight(1f))
                                  Text((fraction * 100).toInt().toString() + "%",
                                      style = MaterialTheme.typography.labelMedium,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant)
                              }
                              Spacer(Modifier.height(8.dp))
                              Box(Modifier.fillMaxWidth().height(8.dp).clip(RoundedCornerShape(4.dp))
                                  .background(MaterialTheme.colorScheme.surfaceVariant)) {
                                  Box(Modifier.fillMaxWidth(fraction.coerceIn(0f, 1f)).height(8.dp)
                                      .background(MaterialTheme.colorScheme.primary))
