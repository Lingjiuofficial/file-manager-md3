          // ============================================================
          // APK 详情页（内置查看：图标 / 版本 / 签名 / 权限 / 组件 / DEX）
          // ============================================================
          data class ApkComponent(val type: String, val name: String)

          data class ApkInfoData(
              val label: String, val packageName: String, val versionName: String, val versionCode: Long,
              val size: Long, val minSdk: Int, val targetSdk: Int,
              val permissions: List<String>, val components: List<ApkComponent>,
              val signerSha256: String?, val signerMd5: String?, val dexCount: Int, val entryCount: Int
          )

          private fun loadApkInfo(ctx: Context, f: File): Pair<ApkInfoData?, String?> {
              return try {
                  val pm = ctx.packageManager
                  @Suppress("DEPRECATION")
                  val flags = PackageManager.GET_PERMISSIONS or PackageManager.GET_ACTIVITIES or
                      PackageManager.GET_SERVICES or PackageManager.GET_RECEIVERS or PackageManager.GET_PROVIDERS
                  @Suppress("DEPRECATION")
                  val pi = pm.getPackageArchiveInfo(f.absolutePath, flags) ?: return null to "无法解析 APK"
                  val ai = pi.applicationInfo
                  if (ai != null) {
                      ai.sourceDir = f.absolutePath
                      ai.publicSourceDir = f.absolutePath
                  }
                  val label = try { ai?.loadLabel(pm)?.toString().orEmpty() } catch (_: Exception) { "" }
                  var sha256: String? = null
                  var md5: String? = null
                  try {
                      val cert = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          pi.signingInfo?.apkContentsSigners?.firstOrNull()
                      } else {
                          @Suppress("DEPRECATION")
                          pi.signatures?.firstOrNull()
                      }
                      if (cert != null) {
                          val bytes = cert.toByteArray()
                          sha256 = java.security.MessageDigest.getInstance("SHA-256").digest(bytes).joinToString("") { "%02x".format(it) }
                          md5 = java.security.MessageDigest.getInstance("MD5").digest(bytes).joinToString("") { "%02x".format(it) }
                      }
                  } catch (_: Exception) {}
                  val comps = ArrayList<ApkComponent>(64)
                  pi.activities?.forEach { comps.add(ApkComponent("Activity", it.name)) }
                  pi.services?.forEach { comps.add(ApkComponent("Service", it.name)) }
                  pi.receivers?.forEach { comps.add(ApkComponent("Receiver", it.name)) }
                  pi.providers?.forEach { comps.add(ApkComponent("Provider", it.name)) }
                  var dexCount = 0
                  var entryCount = 0
                  try {
                      val dexRe = Regex("classes\\d*\\.dex")
                      ZipFile(f).use { zip ->
                          val e = zip.entries()
                          while (e.hasMoreElements()) {
                              val en = e.nextElement()
                              entryCount++
                              if (dexRe.matches(en.name)) dexCount++
                          }
                      }
                  } catch (_: Exception) {}
                  ApkInfoData(
                      label.ifEmpty { f.name }, pi.packageName, pi.versionName ?: "?", pi.versionCode.toLong(),
                      f.length(), ai?.minSdkVersion ?: 0, ai?.targetSdkVersion ?: 0,
                      pi.requestedPermissions?.toList() ?: emptyList(), comps, sha256, md5, dexCount, entryCount
                  ) to null
              } catch (e: Exception) { null to ("读取失败：" + (e.message ?: "")) }
          }

          private fun loadApkIcon(ctx: Context, f: File): Bitmap? {
              return try {
                  val pm = ctx.packageManager
                  @Suppress("DEPRECATION")
                  val pi = pm.getPackageArchiveInfo(f.absolutePath, 0) ?: return null
                  val ai = pi.applicationInfo ?: return null
                  ai.sourceDir = f.absolutePath
                  ai.publicSourceDir = f.absolutePath
                  val d = ai.loadIcon(pm) ?: return null
                  val size = 144
                  val bmp = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888)
                  val canvas = android.graphics.Canvas(bmp)
                  d.setBounds(0, 0, size, size)
                  d.draw(canvas)
                  bmp
              } catch (_: Exception) { null }
          }

