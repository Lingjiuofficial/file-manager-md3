      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Generate project files
        run: |
          mkdir -p app/src/main/java/com/example/filemanagermd3
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat > settings.gradle.kts << 'EOF' 
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FileManagerMD3"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF' 
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF

          cat > gradle.properties << 'EOF' 
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF

          cat > app/build.gradle.kts << 'EOF' 
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.example.filemanagermd3"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.filemanagermd3"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = System.getenv("FM_VERSION_CODE")?.toIntOrNull() ?: 20
                  versionName = "5.6"
              }

              buildTypes {
                  debug { isDebuggable = false; isMinifyEnabled = false }
                  release {
                      isDebuggable = false
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              buildFeatures { compose = true }
              packaging { resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" } }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.6")
              implementation(platform("androidx.compose:compose-bom:2024.09.02"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("org.apache.commons:commons-compress:1.27.1")
              implementation("org.tukaani:xz:1.10")
              implementation("commons-net:commons-net:3.11.1")
              implementation("com.github.junrar:junrar:8.1.1")
              implementation("org.slf4j:slf4j-api:2.0.17")
              implementation("org.slf4j:slf4j-nop:2.0.17")
          }
          EOF

          cat > app/proguard-rules.pro << 'EOF' 
          # Compose 库自带 consumer keep 规则；手动 keep 全部成员会显著增大 APK，已移除
          -keepattributes *Annotation*, Signature, InnerClasses, EnclosingMethod
          -dontwarn androidx.compose.**
          # commons-compress 可选编解码器未打包，静音 R8 缺失类告警
          -dontwarn org.apache.commons.compress.**
          -dontwarn org.apache.commons.net.**
          -dontwarn org.slf4j.**
          -dontwarn com.github.junrar.**
          -dontwarn org.brotli.**
          -dontwarn com.aayushatharva.brotli4j.**
          -dontwarn com.github.luben.zstd.**
          -dontwarn org.lz4.**
          -dontwarn org.xerial.snappy.**
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF' 
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SET_WALLPAPER" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:requestLegacyExternalStorage="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.FileManagerMD3">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize|uiMode|density"
                      android:exported="true"
                      android:theme="@style/Theme.FileManagerMD3">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/file_paths.xml << 'EOF' 
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <root-path name="root" path="/" />
              <external-path name="external" path="." />
              <external-files-path name="external_files" path="." />
              <cache-path name="cache" path="." />
          </paths>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF' 
          <resources>
              <string name="app_name">Files</string>
          </resources>
          EOF

          cat > app/src/main/res/values/colors.xml << 'EOF' 
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#6750A4</color>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF' 
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.FileManagerMD3" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowBackground">#FEF7FF</item>
                  <item name="android:hardwareAccelerated">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml << 'EOF' 
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <group android:scaleX="2.2" android:scaleY="2.2"
                  android:translateX="27.6" android:translateY="27.6">
