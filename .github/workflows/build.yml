          // ============================================================
          // 十六进制查看器（只读 · 分页 16KB · 支持跳转偏移）
          // ============================================================
          private data class HexRow(val offset: Long, val bytes: ByteArray, val ascii: String)

          private fun readHexPage(f: File, start: Long, count: Int): List<HexRow> {
              return try {
                  RandomAccessFile(f, "r").use { raf ->
                      raf.seek(start)
                      val buf = ByteArray(count)
                      val read = raf.read(buf)
                      val n = if (read < 0) 0 else read
                      val rows = ArrayList<HexRow>((n + 15) / 16)
                      var i = 0
                      while (i < n) {
                          val len = minOf(16, n - i)
                          val slice = buf.copyOfRange(i, i + len)
                          val ascii = buildString(len) {
                              for (b in slice) {
                                  val c = b.toInt() and 0xFF
                                  append(if (c in 32..126) c.toChar() else '.')
                              }
                          }
                          rows.add(HexRow(start + i, slice, ascii))
                          i += 16
                      }
                      rows
                  }
              } catch (_: Exception) { emptyList() }
          }

          private fun hexLineOf(r: HexRow): String {
              val hex = StringBuilder(50)
              for (i in 0 until 16) {
                  if (i < r.bytes.size) hex.append("%02X".format(r.bytes[i])) else hex.append("  ")
                  hex.append(if (i == 7) "  " else " ")
              }
              return "%08X  %s |%s|".format(r.offset, hex.toString(), r.ascii)
          }

          private fun parseHexOffset(text: String): Long? {
              val t = text.trim().lowercase()
              return try {
                  if (t.startsWith("0x")) t.substring(2).toLong(16) else t.toLong()
              } catch (_: Exception) { null }
          }

          @Composable
          fun HexViewerScreen(item: FileItem, onDismiss: () -> Unit) {
              val clipboard = LocalClipboardManager.current
              val pageBytes = 16 * 1024
              var offset by remember { mutableLongStateOf(0L) }
              var rows by remember { mutableStateOf<List<HexRow>>(emptyList()) }
              var loading by remember { mutableStateOf(true) }
              var showJump by remember { mutableStateOf(false) }
              val fileSize = item.size

              LaunchedEffect(offset) {
                  loading = true
                  rows = withContext(Dispatchers.IO) { readHexPage(item.file, offset, pageBytes) }
                  loading = false
              }
              BackHandler { onDismiss() }

              Column(Modifier.fillMaxSize()) {
                  Surface(color = MaterialTheme.colorScheme.surfaceContainer) {
                      Row(modifier = Modifier.fillMaxWidth().statusBarsPadding().height(64.dp).padding(horizontal = 4.dp),
                          verticalAlignment = Alignment.CenterVertically) {
                          IconButton(onClick = onDismiss) { Icon(Icons.Filled.ArrowBack, "返回") }
                          Column(Modifier.weight(1f).padding(horizontal = 4.dp)) {
                              Text(item.name, style = MaterialTheme.typography.titleLarge, maxLines = 1, overflow = TextOverflow.Ellipsis)
                              Text("十六进制查看 · " + humanSize(fileSize), style = MaterialTheme.typography.labelSmall,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant, maxLines = 1)
                          }
                          IconButton(onClick = { showJump = true }) { Icon(Icons.Filled.Search, "跳转到偏移") }
                          IconButton(onClick = {
                              val sb = StringBuilder()
                              rows.forEach { r -> sb.append(hexLineOf(r)).append('\n') }
                              clipboard.setText(AnnotatedString(sb.toString()))
                          }) { Icon(Icons.Filled.ContentCopy, "复制本页") }
                      }
                  }
                  Box(Modifier.weight(1f).fillMaxWidth()) {
                      if (loading) {
                          Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                              Text("读取中…", color = MaterialTheme.colorScheme.onSurfaceVariant)
                          }
                      } else if (rows.isEmpty()) {
                          Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                              Text("无法读取（空文件或已到末尾）", color = MaterialTheme.colorScheme.onSurfaceVariant)
                          }
                      } else {
                          Box(Modifier.fillMaxSize().horizontalScroll(rememberScrollState())) {
