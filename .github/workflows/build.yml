name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Generate project files
        run: |
          mkdir -p app/src/main/java/com/example/filemanagermd3
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat > settings.gradle.kts << 'EOF' | sed 's/^  //'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FileManagerMD3"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF' | sed 's/^  //'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF

          cat > gradle.properties << 'EOF' | sed 's/^  //'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          org.gradle.parallel=true
          org.gradle.caching=true
          android.enableR8.fullMode=true
          android.experimental.enableNewResourceShrinker=true
          EOF

          cat > app/build.gradle.kts << 'EOF' | sed 's/^  //'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.example.filemanagermd3"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.filemanagermd3"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 22
                  versionName = "4.0"
              }

              buildTypes {
                  debug { isDebuggable = false; isMinifyEnabled = false }
                  release {
                      isDebuggable = false
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.getByName("debug")
                      ndk { debugSymbolLevel = "none" }
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              buildFeatures { compose = true }
              packaging { resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" } }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.6")
              implementation(platform("androidx.compose:compose-bom:2024.09.02"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
          }
          EOF

          cat > app/proguard-rules.pro << 'EOF' | sed 's/^  //'
          -keepattributes *Annotation*, Signature, InnerClasses, EnclosingMethod
          -keep class androidx.compose.runtime.** { *; }
          -keep class androidx.compose.ui.** { *; }
          -keep class androidx.compose.material3.** { *; }
          -dontwarn androidx.compose.**
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF' | sed 's/^  //'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
