              var starredPaths by mutableStateOf(prefs.getStringSet("starred", emptySet()) ?: emptySet())
                  private set
              var snackMessage by mutableStateOf<String?>(null)
              var isRefreshing by mutableStateOf(false)
                  private set
              var selectionMode by mutableStateOf(false)
                  private set
              var selectedPaths by mutableStateOf<Set<String>>(emptySet())
                  private set
              var busyLabel by mutableStateOf<String?>(null)
                  private set

              init {
                  val lastDir = prefs.getString("lastDir", null)
                  if (lastDir != null) {
                      val f = File(lastDir)
                      if (f.exists() && f.isDirectory && f.canRead()) currentDir = f
                  }
                  refresh(force = false); refreshRecent(); refreshStarred()
              }

              private fun resolveRoot(app: Application): File {
                  val ext = Environment.getExternalStorageDirectory()
                  return if (ext.exists() && ext.canRead()) ext
                      else app.getExternalFilesDir(null) ?: app.filesDir
              }

              private fun sortList(list: List<FileItem>, key: SortKey): List<FileItem> {
                  val cmp = when (key) {
                      SortKey.NAME -> compareBy<FileItem> { !it.isDirectory }.thenBy(String.CASE_INSENSITIVE_ORDER) { it.name }
                      SortKey.SIZE -> compareBy<FileItem> { !it.isDirectory }.thenBy { it.size }
                      SortKey.MTIME -> compareBy<FileItem> { !it.isDirectory }.thenByDescending { it.lastModified }
                  }
                  return list.sortedWith(cmp)
              }

              fun refresh(force: Boolean = false) {
                  refreshJob?.cancel()
                  refreshJob = viewModelScope.launch { loadCurrentDir(force) }
              }

              fun pullToRefresh() {
                  refreshJob?.cancel()
                  refreshJob = viewModelScope.launch {
                      isRefreshing = true
                      try {
                          loadCurrentDir(force = true)
                          delay(300)
                      } finally { isRefreshing = false }
                  }
              }

              private suspend fun loadCurrentDir(force: Boolean) {
                  val dir = currentDir
                  val dirPath = dir.absolutePath
                  val key = sortKey
                  val hidden = showHidden
                  val cached = dirCache[dirPath]
                  if (!force && cached != null && cached.sortKey == key && cached.showHidden == hidden) {
                      items = cached.items
                  }
                  // 单次 IO 内完成「mtime 校验 + 目录读取」：缓存命中仅读一次 mtime，未命中则一次线程切换内完成扫描
                  val (nowMtime, computed) = withContext(Dispatchers.IO) {
                      val mtime = try { dir.lastModified() } catch (e: Exception) { 0L }
                      if (!force && cached != null && cached.dirMtime == mtime &&
                          cached.sortKey == key && cached.showHidden == hidden) {
                          mtime to null
                      } else {
                          val list = try { dir.listFiles()?.toList() ?: emptyList() } catch (e: Exception) { emptyList() }
                          val filtered = list.filter { hidden || !it.name.startsWith(".") }.map { it.toItem() }
                          mtime to sortList(filtered, key)
                      }
                  }
                  if (computed == null) return
                  if (dir == currentDir && key == sortKey && hidden == showHidden) {
                      if (dirCache.size > maxCacheSize) dirCache.clear()
                      dirCache[dirPath] = DirSnapshot(computed, nowMtime, key, hidden)
                      items = computed
                  }
              }

              fun selectCategory(cat: CategoryKind) {
                  currentCategory = cat
                  if (cat == CategoryKind.ALL) { categoryItems = emptyList(); return }
                  val cached = categoryScanCache[cat]
                  val now = System.currentTimeMillis()
                  if (cached != null && now - cached.timestamp < scanCacheTTL) {
                      categoryItems = sortList(cached.items, sortKey); return
                  }
                  scanCategory(cat)
              }

              fun scanCategory(cat: CategoryKind) {
                  scanJob?.cancel()
                  scanJob = viewModelScope.launch {
                      isScanning = true
                      try {
                          val root = resolveRoot(getApplication())
                          val currentSort = sortKey
                          val result = withContext(Dispatchers.IO) {
                              scanByCategory(root, cat, maxScanResults, currentSort)
                          }
                          if (cat == currentCategory) {
                              categoryScanCache[cat] = ScanSnapshot(result, System.currentTimeMillis())
                              categoryItems = result
                          }
                      } finally { isScanning = false }
                  }
              }

              fun globalSearch(q: String) {
                  globalSearchQuery = q
                  searchJob?.cancel()
                  if (q.isBlank()) { globalSearchResults = emptyList(); return }
                  searchJob = viewModelScope.launch {
                      isSearching = true
                      try {
                          delay(300)
                          val root = resolveRoot(getApplication())
                          val currentSort = sortKey
                          val result = withContext(Dispatchers.IO) {
                              searchGlobal(root, q, maxScanResults, currentSort)
                          }
                          if (q == globalSearchQuery) globalSearchResults = result
                      } finally { isSearching = false }
                  }
              }

              fun exitGlobalSearch() {
                  globalSearchQuery = ""
                  globalSearchResults = emptyList()
                  globalSearchMode = false
              }

              /** Android/data、Android/obb 为应用私有目录（海量小文件且用户价值低），自动扫描/搜索时跳过 */
              private fun isPrivateAppDir(f: File): Boolean =
                  (f.name == "data" || f.name == "obb") && f.parentFile?.name == "Android"

              private suspend fun scanByCategory(root: File, cat: CategoryKind, max: Int, key: SortKey): List<FileItem> {
                  val res = ArrayList<FileItem>(64)
                  val stack = ArrayDeque<File>(); stack.add(root)
                  var dirs = 0
                  while (stack.isNotEmpty() && res.size < max) {
                      yield() // 响应扫描取消
                      if (++dirs > 200_000) break
                      val dir = stack.removeFirst()
                      val children = try { dir.listFiles() } catch (_: Exception) { null } ?: continue
                      for (c in children) {
                          if (c.name.startsWith(".")) continue
                          if (c.isDirectory) { if (!isSymlinkSafe(c) && !isPrivateAppDir(c)) stack.add(c) }
                          else { val item = c.toItem(); if (cat.matches(item)) res.add(item) }
                      }
                  }
                  return sortList(res, key)
              }

              private suspend fun searchGlobal(root: File, q: String, max: Int, key: SortKey): List<FileItem> {
                  if (q.isBlank()) return emptyList()
                  val res = ArrayList<FileItem>(64)
                  val stack = ArrayDeque<File>(); stack.add(root)
                  var dirs = 0
                  while (stack.isNotEmpty() && res.size < max) {
                      yield() // 响应搜索取消
                      if (++dirs > 200_000) break
                      val dir = stack.removeFirst()
                      val children = try { dir.listFiles() } catch (_: Exception) { null } ?: continue
                      for (c in children) {
                          if (c.name.startsWith(".")) continue
                          if (c.name.contains(q, ignoreCase = true)) res.add(c.toItem())
                          if (c.isDirectory) { if (!isSymlinkSafe(c) && !isPrivateAppDir(c)) stack.add(c) }
                      }
                  }
                  return sortList(res, key)
              }

              private fun invalidateAndRefresh() {
                  dirCache.remove(currentDir.absolutePath); refresh(force = true)
              }

              fun refreshRecent() {
                  viewModelScope.launch {
                      val recent = prefs.getString("recent", "")?.split('\n')?.filter { it.isNotBlank() } ?: emptyList()
                      recentItems = withContext(Dispatchers.IO) {
                          recent.mapNotNull { File(it).takeIf { f -> f.exists() }?.toItem() }
                      }
                  }
              }

              fun refreshStarred() {
                  viewModelScope.launch {
                      val paths = starredPaths
                      starredItems = withContext(Dispatchers.IO) {
                          paths.mapNotNull { File(it).takeIf { f -> f.exists() }?.toItem() }
                      }
                  }
              }

              fun recordRecent(item: FileItem) {
                  if (item.isDirectory) return
                  val list = (prefs.getString("recent","")?.split('\n')?.filter{it.isNotBlank()} ?: emptyList())
                      .toMutableList().apply { remove(item.path); add(0, item.path) }
                  prefs.edit().putString("recent", list.take(50).joinToString("\n")).apply()
                  refreshRecent()
              }

              fun open(item: FileItem) {
                  if (!item.isDirectory) return
                  if (!item.file.canRead()) { showSnack("无法访问"); return }
                  currentDir = item.file; searchQuery = ""; searchMode = false
                  prefs.edit().putString("lastDir", item.path).apply()
                  refresh(force = false)
              }

              fun navigateTo(dir: File): Boolean {
                  if (!dir.isDirectory || !dir.canRead()) { showSnack("无法访问"); return false }
                  currentDir = dir; searchQuery = ""; searchMode = false
                  prefs.edit().putString("lastDir", dir.absolutePath).apply()
                  refresh(force = false)
                  return true
              }

              /** 双窗格：未设置时把当前目录设为对照；已设置则与对照交换跳转（反复点 = 来回切换）。 */
              fun swapDual() {
                  val target = dualDir
                  if (target == null) {
                      dualDir = currentDir.path
                      prefs.edit().putString("dualDir", currentDir.path).apply()
                      showSnack("已将「" + currentDir.name.ifEmpty { "存储" } + "」设为双窗格目录，再点切换")
                  } else {
                      val prev = currentDir.path
                      if (navigateTo(File(target))) {
                          dualDir = prev
                          prefs.edit().putString("dualDir", prev).apply()
                          showSnack("双窗格：已切换到「" + File(target).name.ifEmpty { "存储" } + "」")
                      }
                  }
              }

              /** 打开某文件/文件夹所在目录（全局搜索、最近、收藏场景常用），并退出全局搜索 */
              fun openParentOf(item: FileItem) {
                  val parent = item.file.parentFile ?: return
                  navigateTo(parent)
                  exitGlobalSearch()
              }

              fun goUp(): Boolean {
                  val p = currentDir.parentFile ?: return false
                  if (!p.canRead()) return false
                  navigateTo(p); return true
              }

              fun breadcrumbs(): List<File> {
                  val list = ArrayList<File>(8)
                  var f: File? = currentDir
                  while (f != null) { list.add(0, f); f = f.parentFile }
                  return list
              }

              fun doSearch(q: String) {
                  searchQuery = q
                  searchJob?.cancel()
                  if (q.isBlank()) { refresh(force = false); return }
                  val dir = currentDir
                  val key = sortKey
                  searchJob = viewModelScope.launch {
                      delay(250)
                      val results = withContext(Dispatchers.IO) {
                          val res = ArrayList<FileItem>()
                          val stack = ArrayDeque<File>().apply { add(dir) }
                          val lower = q.lowercase()
                          while (stack.isNotEmpty() && res.size < 300) {
                              val d = stack.removeFirst()
                              val children = try { d.listFiles() } catch (e: Exception) { null } ?: continue
                              for (c in children) {
                                  if (c.name.startsWith(".")) continue
                                  if (c.name.lowercase().contains(lower)) res.add(c.toItem())
                                  if (c.isDirectory) { if (!isPrivateAppDir(c)) stack.add(c) }
                              }
                          }
                          sortList(res, key)
                      }
                      if (q == searchQuery) items = results
                  }
              }

              fun exitSearch() { searchQuery = ""; searchMode = false; refresh(force = false) }

              fun createFolder(name: String) {
                  if (name.isBlank()) return
                  if (name.contains('/')) { showSnack("名称不能包含 /"); return }
                  viewModelScope.launch {
                      val ok = withContext(Dispatchers.IO) { File(currentDir, name).mkdirs() }
                      if (ok) { invalidateAndRefresh(); showSnack("已创建「" + name + "」") } else showSnack("创建失败")
                  }
              }

              fun createFile(name: String) {
                  if (name.isBlank()) return
                  if (name.contains('/')) { showSnack("名称不能包含 /"); return }
                  viewModelScope.launch {
                      val ok = withContext(Dispatchers.IO) {
                          try { File(currentDir, name).createNewFile() } catch (e: Exception) { false }
                      }
                      if (ok) { invalidateAndRefresh(); showSnack("已创建「" + name + "」") } else showSnack("创建失败")
                  }
              }

              fun rename(item: FileItem, newName: String) {
                  if (newName.isBlank() || newName == item.name) return
                  val dest = File(item.file.parentFile, newName)
                  if (dest.exists()) { showSnack("已存在同名项目"); return }
                  viewModelScope.launch {
                      val ok = withContext(Dispatchers.IO) { item.file.renameTo(dest) }
                      if (ok) {
                          if (starredPaths.contains(item.path)) {
                              starredPaths = starredPaths - item.path + dest.absolutePath
                              prefs.edit().putStringSet("starred", starredPaths).apply()
                          }
                          invalidateAndRefresh(); refreshStarred(); refreshRecent(); showSnack("已重命名")
                      } else showSnack("重命名失败")
                  }
              }

              fun delete(item: FileItem) {
                  viewModelScope.launch {
                      val ok = withContext(Dispatchers.IO) {
                          if (item.isDirectory) item.file.deleteRecursively() else item.file.delete()
                      }
                      if (ok) {
                          starredPaths = starredPaths - item.path
                          prefs.edit().putStringSet("starred", starredPaths).apply()
                          if (clipboard?.paths?.contains(item.path) == true) clipboard = null
                          invalidateAndRefresh(); refreshStarred(); refreshRecent(); showSnack("已删除")
                      } else showSnack("删除失败")
                  }
              }

              fun copy(item: FileItem) { clipboard = ClipData(ClipMode.COPY, listOf(item.path)); showSnack("已复制") }
              fun cut(item: FileItem) { clipboard = ClipData(ClipMode.CUT, listOf(item.path)); showSnack("已剪切") }

              fun pasteInto(target: File = currentDir) {
                  val cb = clipboard ?: return
                  val sources = cb.paths.map { File(it) }
                  viewModelScope.launch {
                      busyLabel = "正在粘贴…"
                      val result = withContext(Dispatchers.IO) {
                          var ok = 0
                          var fail = 0
                          val targetPath = try { target.canonicalPath } catch (_: Exception) { target.absolutePath }
                          for (src in sources) {
                              try {
                                  if (!src.exists()) { fail++; continue }
                                  if (src.isDirectory) {
                                      val srcPath = src.canonicalPath
                                      if (targetPath == srcPath || targetPath.startsWith(srcPath + File.separator)) { fail++; continue }
                                  }
                                  val dest = uniqueFile(target, src.name)
                                  val success = if (cb.mode == ClipMode.CUT) {
                                      if (src.renameTo(dest)) true else { val c = copyRec(src, dest); if (c) src.deleteRecursively(); c }
                                  } else copyRec(src, dest)
                                  if (success) ok++ else fail++
                              } catch (_: Exception) { fail++ }
                          }
                          ok to fail
                      }
                      busyLabel = null
                      if (cb.mode == ClipMode.CUT) clipboard = null
                      if (target.absolutePath == currentDir.absolutePath) invalidateAndRefresh()
                      refreshStarred(); refreshRecent()
                      showSnack("粘贴完成：成功 " + result.first + " 项" + (if (result.second > 0) "，失败 " + result.second + " 项" else ""))
                  }
              }

              /** 递归复制（跳过符号链接防环 + 周期性 yield 可取消；目标已存在则跳过，不覆盖） */
              private suspend fun copyRec(src: File, dest: File): Boolean = try {
                  if (!src.isDirectory) {
                      dest.parentFile?.mkdirs()
                      src.inputStream().buffered().use { i -> dest.outputStream().buffered().use { o -> i.copyTo(o) } }
                  } else {
                      val base = src.absolutePath
                      val stack = ArrayDeque<Pair<File, File>>()
                      stack.addLast(src to dest)
                      var n = 0
                      while (stack.isNotEmpty()) {
                          yield()
                          val (sd, dd) = stack.removeLast()
                          dd.mkdirs()
                          val children = sd.listFiles() ?: continue
                          for (c in children) {
                              if (isSymlinkSafe(c)) continue
                              val target = File(dest, c.absolutePath.removePrefix(base))
                              if (c.isDirectory) stack.addLast(c to target)
                              else {
                                  if (target.exists()) continue
                                  target.parentFile?.mkdirs()
                                  c.inputStream().buffered().use { i -> target.outputStream().buffered().use { o -> i.copyTo(o) } }
                                  if (++n % 512 == 0) yield()
                              }
                          }
                      }
                  }
                  true
              } catch (e: Exception) { false }

              private fun uniqueFile(dir: File, name: String): File {
                  var f = File(dir, name)
                  if (!f.exists()) return f
                  val dot = name.lastIndexOf('.')
                  val stem = if (dot > 0) name.substring(0, dot) else name
                  val ext = if (dot > 0) name.substring(dot) else ""
                  var i = 1
                  while (f.exists()) { f = File(dir, stem + " (" + i + ")" + ext); i++ }
                  return f
              }

              // ---------- 多选与批量操作 ----------
              private fun visibleList(): List<FileItem> = when {
                  currentTab == Tab.RECENT -> recentItems
                  currentTab == Tab.STARRED -> starredItems
                  currentCategory != CategoryKind.ALL -> categoryItems
                  else -> items
              }

              fun enterOrToggle(item: FileItem) {
                  if (selectionMode) toggleSelection(item.path)
                  else { selectionMode = true; selectedPaths = setOf(item.path) }
              }

              fun toggleSelection(path: String) {
                  val next = if (selectedPaths.contains(path)) selectedPaths - path else selectedPaths + path
                  selectedPaths = next
                  if (next.isEmpty()) selectionMode = false
              }

              fun exitSelection() { selectionMode = false; selectedPaths = emptySet() }

              fun selectAllVisible() { selectedPaths = visibleList().map { it.path }.toSet() }

              fun invertSelection() {
                  selectedPaths = visibleList().map { it.path }.toSet() - selectedPaths
                  if (selectedPaths.isEmpty()) selectionMode = false
              }

              fun copySelection() {
                  if (selectedPaths.isEmpty()) return
                  val n = selectedPaths.size
                  clipboard = ClipData(ClipMode.COPY, selectedPaths.toList())
                  exitSelection()
                  showSnack("已复制 " + n + " 项")
              }

              fun cutSelection() {
                  if (selectedPaths.isEmpty()) return
                  val n = selectedPaths.size
                  clipboard = ClipData(ClipMode.CUT, selectedPaths.toList())
                  exitSelection()
                  showSnack("已剪切 " + n + " 项")
              }

              fun deleteSelection() {
                  if (selectedPaths.isEmpty()) return
                  val paths = selectedPaths.toList()
                  exitSelection()
                  viewModelScope.launch {
                      busyLabel = "正在删除…"
                      val done = withContext(Dispatchers.IO) {
                          var n = 0
                          for (p in paths) {
                              try {
                                  val f = File(p)
                                  val okOne = if (f.isDirectory) f.deleteRecursively() else f.delete()
                                  if (okOne) n++
                              } catch (_: Exception) {}
                          }
                          n
                      }
                      busyLabel = null
                      starredPaths = starredPaths - paths.toSet()
                      prefs.edit().putStringSet("starred", starredPaths).apply()
                      val cbNow = clipboard
                      if (cbNow != null && cbNow.paths.any { paths.contains(it) }) clipboard = null
                      invalidateAndRefresh(); refreshStarred(); refreshRecent()
                      showSnack("已删除 " + done + " 项")
                  }
              }

              fun selectionZipName(): String {
                  val sel = visibleList().filter { selectedPaths.contains(it.path) }
                  return if (sel.size == 1) {
                      (if (sel[0].isDirectory) sel[0].name else sel[0].name.substringBeforeLast('.', sel[0].name)) + ".zip"
                  } else "archive.zip"
              }

              fun zipSelection(name: String) {
                  val paths = selectedPaths.toList()
                  if (paths.isEmpty()) return
                  exitSelection()
                  zipFiles(paths.map { File(it) }, name)
              }

              fun zipFiles(files: List<File>, name: String) {
                  if (files.isEmpty()) return
                  val zipName = if (name.endsWith(".zip", true)) name else name + ".zip"
                  val out = uniqueFile(currentDir, zipName)
                  val list = files.toList()
                  viewModelScope.launch {
                      busyLabel = "正在压缩…"
                      val count = withContext(Dispatchers.IO) { zipItemsTo(list, out) }
                      busyLabel = null
                      if (count > 0) { invalidateAndRefresh(); showSnack("已压缩 " + count + " 个文件到 " + out.name) }
                      else { out.delete(); showSnack("压缩失败") }
                  }
              }

              fun extractOtherArchive(item: FileItem) {
                  viewModelScope.launch {
                      busyLabel = "正在解压…"
                      val count = withContext(Dispatchers.IO) {
                          try {
                              val target = currentDir
                              val lower = item.name.lowercase(Locale.ROOT)
                              when {
                                  lower.endsWith(".gz") && !lower.endsWith(".tar.gz") -> extractGzTo(item.file, target)
                                  lower.endsWith(".7z") -> ArchiveEngine.extractAll(item.file, "7z", target, "")
                                  lower.endsWith(".tar.gz") || lower.endsWith(".tgz") -> ArchiveEngine.extractAll(item.file, "tgz", target, "")
                                  lower.endsWith(".tar") -> ArchiveEngine.extractAll(item.file, "tar", target, "")
                                  lower.endsWith(".rar") -> ArchiveEngine.extractAll(item.file, "rar", target, "")
                                  else -> 0
                              }
                          } catch (_: Exception) { 0 }
                      }
                      busyLabel = null
                      if (count > 0) { invalidateAndRefresh(); showSnack("已解压 " + count + " 个文件") } else showSnack("解压失败")
                  }
              }

              private suspend fun zipItemsTo(files: List<File>, outFile: File): Int {
                  val counter = intArrayOf(0)
                  return try {
                      ZipOutputStream(outFile.outputStream().buffered()).use { zout ->
                          for (f in files) zipAddTo(zout, f, f.name, counter)
                      }
                      counter[0]
                  } catch (_: Exception) {
                      try { outFile.delete() } catch (_: Exception) {}
                      0
                  }
              }

              private suspend fun zipAddTo(zout: ZipOutputStream, f: File, entryName: String, counter: IntArray) {
                  if (isSymlinkSafe(f)) return // 跳过符号链接（防环；对齐 tar/du 语义）
                  if (f.isDirectory) {
                      val kids = f.listFiles()
                      if (kids == null || kids.isEmpty()) {
                          zout.putNextEntry(ZipEntry(if (entryName.endsWith("/")) entryName else entryName + "/"))
                          zout.closeEntry()
                      } else {
                          for (k in kids) zipAddTo(zout, k, entryName + "/" + k.name, counter)
                      }
                  } else {
                      zout.putNextEntry(ZipEntry(entryName))
                      f.inputStream().buffered().use { input -> input.copyTo(zout) }
                      zout.closeEntry()
                      counter[0]++
                      if (counter[0] % 256 == 0) yield()
                  }
              }

              private fun extractGzTo(src: File, target: File): Int {
                  var outName = src.name
                  if (outName.lowercase(Locale.ROOT).endsWith(".gz")) outName = outName.substring(0, outName.length - 3)
                  if (outName.isEmpty()) outName = src.name + ".out"
                  val outFile = uniqueFile(target, outName)
                  return try {
                      GzipCompressorInputStream(src.inputStream().buffered()).use { gin ->
                          outFile.outputStream().buffered().use { out -> gin.copyTo(out) }
                      }
                      1
                  } catch (_: Exception) { 0 }
              }

              /** RAR 解压（junrar 8.x：RAR4 + RAR5 全支持）；prefix 非空时只解压该前缀下的内容 */
              /** 从 RAR 中提取单个条目到缓存目录（浏览包内文件用） */
              fun renameSelection(find: String, replace: String, addIndex: Boolean) {
                  val paths = selectedPaths.toList()
                  if (paths.isEmpty()) return
                  exitSelection()
                  viewModelScope.launch {
                      busyLabel = "正在重命名…"
                      val done = withContext(Dispatchers.IO) {
                          var n = 0
                          var idx = 1
                          for (p in paths) {
                              try {
                                  val f = File(p)
                                  var newName = f.name
                                  if (find.isNotEmpty()) newName = newName.replace(find, replace)
                                  if (addIndex) {
                                      val dot = newName.lastIndexOf('.')
                                      newName = if (dot > 0) newName.substring(0, dot) + "_" + idx + newName.substring(dot)
                                      else newName + "_" + idx
                                  }
                                  idx++
                                  if (newName != f.name && newName.isNotBlank()) {
                                      val dest = File(f.parentFile, newName)
                                      if (!dest.exists() && f.renameTo(dest)) n++
                                  }
                              } catch (_: Exception) {}
                          }
                          n
                      }
                      busyLabel = null
                      starredPaths = starredPaths - paths.toSet()
                      prefs.edit().putStringSet("starred", starredPaths).apply()
                      invalidateAndRefresh(); refreshStarred(); refreshRecent()
                      showSnack("已重命名 " + done + " 项")
                  }
              }

              fun computeHashes(item: FileItem, onResult: (String?) -> Unit) {
                  if (item.isDirectory) { onResult(null); return }
                  viewModelScope.launch {
                      busyLabel = "正在计算哈希…"
                      val res = withContext(Dispatchers.IO) {
                          try {
                              val md5 = java.security.MessageDigest.getInstance("MD5")
                              val sha1 = java.security.MessageDigest.getInstance("SHA-1")
                              item.file.inputStream().buffered().use { input ->
                                  val buf = ByteArray(64 * 1024)
                                  while (true) {
                                      val r = input.read(buf)
                                      if (r <= 0) break
                                      md5.update(buf, 0, r)
                                      sha1.update(buf, 0, r)
                                  }
                              }
                              "MD5：" + md5.digest().joinToString("") { b -> "%02x".format(b) } + "\nSHA-1：" + sha1.digest().joinToString("") { b -> "%02x".format(b) }
                          } catch (_: Exception) { null }
                      }
                      busyLabel = null
                      onResult(res)
                  }
              }

              fun computeDirSize(item: FileItem, onResult: (String?) -> Unit) {
                  if (!item.isDirectory) { onResult(null); return }
                  viewModelScope.launch {
                      busyLabel = "正在统计大小…"
                      val res = withContext(Dispatchers.IO) {
                          try {
                              var total = 0L
                              var files = 0
                              var dirs = 0
                              val stack = ArrayDeque<File>()
                              stack.add(item.file)
                              while (stack.isNotEmpty()) {
                                  val d = stack.removeFirst()
                                  val kids = d.listFiles() ?: continue
                                  for (k in kids) {
                                      if (k.isDirectory) { dirs++; stack.add(k) } else { files++; total += k.length() }
                                  }
                              }
                              "大小：" + humanSize(total) + "\n" + files + " 个文件 · " + dirs + " 个文件夹"
                          } catch (_: Exception) { null }
                      }
                      busyLabel = null
                      onResult(res)
                  }
              }

              fun shareSelection() {
                  shareItems(selectedPaths.toList())
                  exitSelection()
              }

              fun shareItems(paths: List<String>) {
                  if (paths.isEmpty()) return
                  val app = getApplication<Application>()
                  try {
                      val uris = ArrayList<Uri>()
                      for (p in paths) {
                          uris.add(FileProvider.getUriForFile(app, app.packageName + ".fileprovider", File(p)))
                      }
                      if (uris.size == 1) {
                          val ext = File(paths[0]).name.substringAfterLast('.', "").lowercase(Locale.ROOT)
                          val intent = Intent(Intent.ACTION_SEND).apply {
                              type = mimeOf(ext)
                              putExtra(Intent.EXTRA_STREAM, uris[0])
                              addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          }
                          app.startActivity(Intent.createChooser(intent, "分享"))
                      } else {
                          val intent = Intent(Intent.ACTION_SEND_MULTIPLE).apply {
                              type = "*/*"
                              putParcelableArrayListExtra(Intent.EXTRA_STREAM, uris)
                              addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          }
                          app.startActivity(Intent.createChooser(intent, "分享"))
                      }
                  } catch (_: Exception) { showSnack("分享失败") }
              }

